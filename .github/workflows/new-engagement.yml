name: New engagement

# Start a new client from the GitHub website: Actions -> New engagement -> Run workflow.
# Opens a PR that replaces the current record (engagement/ and intake/) with a
# clean one for the new client. Review and merge it to begin.
on:
  workflow_dispatch:
    inputs:
      client: {description: "Client name", required: true}
      start: {description: "Engagement start (YYYY-MM-DD)", required: true}
      stage1: {description: "Planned Stage 1 audit (YYYY-MM-DD)", required: true}
      stage2: {description: "Planned Stage 2 audit (YYYY-MM-DD)", required: true}
      hours: {description: "Consulting hours budget", required: true, default: "200"}
      lead: {description: "Engagement lead", required: false}

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  new:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Reset the record
        env:
          CLIENT: ${{ inputs.client }}
          START: ${{ inputs.start }}
          STAGE1: ${{ inputs.stage1 }}
          STAGE2: ${{ inputs.stage2 }}
          HOURS: ${{ inputs.hours }}
          LEAD: ${{ inputs.lead }}
        run: |
          python -m grc new-engagement --client "$CLIENT" --start "$START" --stage1 "$STAGE1" \
            --stage2 "$STAGE2" --hours "$HOURS" ${LEAD:+--lead "$LEAD"} --confirm-reset
          python -m grc validate
      - name: Open the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLIENT: ${{ inputs.client }}
        run: |
          BRANCH="new-engagement/$(echo "$CLIENT" | tr -cs 'A-Za-z0-9' '-' | tr 'A-Z' 'a-z' | sed 's/^-//;s/-$//')"
          git config user.name "grc-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A engagement intake
          git commit -q -m "New engagement: $CLIENT"
          git push -f origin "$BRANCH"
          printf '%s\n' "Replaces the current engagement record with a clean one for **$CLIENT**." "" \
            "Next: edit \`engagement/owners.yaml\`, then upload client documents to \`intake/\` and configure \`engagement/collectors.yaml\`." \
            "" "Merging this deletes the previous engagement data from \`main\` (it remains in git history)." > body.md
          gh pr create --base main --head "$BRANCH" --title "New engagement: $CLIENT" --body-file body.md
          gh workflow run validate.yml --ref "$BRANCH"
