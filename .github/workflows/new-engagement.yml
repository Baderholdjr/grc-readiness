name: New engagement

# Start a new client from the GitHub website: Actions -> New engagement -> Run workflow.
# Opens a PR that replaces the current record (engagement/ and intake/) with a
# clean one for the new client. Review and merge it to begin.
on:
  workflow_dispatch:
    inputs:
      client: {description: "Client name", required: true}
      start: {description: "Engagement start (YYYY-MM-DD)", required: true}
      stage1: {description: "Planned Stage 1 audit, or SOC 2 observation period start (YYYY-MM-DD)", required: true}
      stage2: {description: "Planned Stage 2 audit, or SOC 2 observation period end (YYYY-MM-DD)", required: true}
      hours: {description: "Consulting hours budget", required: true, default: "200"}
      lead: {description: "Engagement lead", required: false}
      framework:
        description: "Framework"
        type: choice
        options: [iso42001, iso27001, soc2]
        default: iso42001
      engagement: {description: "Record folder: engagement (main) or engagement-27001, engagement-soc2 etc. for another framework", required: false, default: engagement}
      categories: {description: "SOC 2 only: optional categories, comma-separated (availability,confidentiality,processing_integrity,privacy)", required: false}

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  new:
    uses: ./.github/workflows/grc-new-engagement.yml
    with:
      engine: local
      client: ${{ inputs.client }}
      start: ${{ inputs.start }}
      stage1: ${{ inputs.stage1 }}
      stage2: ${{ inputs.stage2 }}
      hours: ${{ inputs.hours }}
      lead: ${{ inputs.lead }}
      framework: ${{ inputs.framework }}
      engagement: ${{ inputs.engagement }}
      categories: ${{ inputs.categories }}
    secrets: inherit
