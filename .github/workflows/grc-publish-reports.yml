name: Publish reports (reusable)

# Keeps the `reports` branch in sync with main: brief (Markdown + Word), control
# matrix, SoA, gap register, evidence index. Browse it at /tree/reports.
# Runs after every merge and daily (so expiry dates stay current). The branch
# history is a dated record of readiness; it is never edited by hand.
# Called by thin wrappers in each repo; the triggers and permissions live there.
on:
  workflow_call:
    # Only these secrets reach this workflow (callers pass them by name, not `secrets: inherit`).
    secrets:
      GRC_ENGINE_TOKEN: {required: false}
    inputs:
      engine:
        description: "'pinned' = install the version in the caller's requirements.txt; 'local' = install from the checkout (engine repo only)"
        type: string
        default: pinned

# The most this workflow may use; a caller can only grant less.
permissions:
  contents: write

jobs:
  # A repository made from the template has no record until *New engagement* runs:
  # skip quietly instead of failing every scheduled run.
  record:
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.check.outputs.found }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        run: |
          if compgen -G "engagement/engagement.yaml" >/dev/null || compgen -G "engagement-*/engagement.yaml" >/dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No engagement record in this repository yet, so there is nothing to do. Start one with **Actions → New engagement**." >> "$GITHUB_STEP_SUMMARY"
          fi
  publish:
    needs: record
    if: needs.record.outputs.found == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the GRC engine
        env:
          ENGINE: ${{ inputs.engine }}
          GRC_ENGINE_TOKEN: ${{ secrets.GRC_ENGINE_TOKEN }}
        run: |
          if [ "$ENGINE" = "local" ]; then
            pip install -q --require-hashes -r grc/resources/locks/engine.txt
            pip install -q --no-deps .
          else
            # requirements.txt pins the engine (git+https://github.com/<owner>/grc-readiness@engine-vX.Y.Z).
            # The engine repo is private: read it with GRC_ENGINE_TOKEN, then drop the credential again.
            if [ -n "$GRC_ENGINE_TOKEN" ]; then
              git config --global url."https://x-access-token:${GRC_ENGINE_TOKEN}@github.com/".insteadOf "https://github.com/"
            fi
            # The engine first, without its dependencies; then its dependencies from the engine's own hash-locked
            # file; then anything else the client's requirements.txt lists.
            grep -E '^grc-readiness' requirements.txt > "$RUNNER_TEMP/engine-pin.txt"
            pip install -q --no-deps -r "$RUNNER_TEMP/engine-pin.txt"
            if LOCK=$(python -m grc.locks engine 2>/dev/null); then
              pip install -q --require-hashes -r "$LOCK"
            else
              echo "::warning::This engine version has no lock files (added in 0.25.0), so its dependencies are not hash-checked. Merge the engine upgrade PR."
            fi
            pip install -q -r requirements.txt
            git config --global --unset-all url."https://x-access-token:${GRC_ENGINE_TOKEN}@github.com/".insteadOf || true
          fi
          python -c "import grc; print('GRC engine', grc.__version__)"
      # --force: publish even when validation has errors (they are shown on the landing page).
      - name: Build the reports (other frameworks' records go in subfolders)
        run: |
          engs=$(python -m grc engagements) || exit 1
          for e in $engs; do
            if [ "$e" = engagement ]; then o=out; else o="out/$e"; fi
            python -m grc --engagement "$e" build --out "$o" --force
          done
          # a malformed program file must not stop the records' reports from publishing
          if [ -d program ]; then python -m grc program report --out out/program || echo "::warning::program reports not built (see Validate)"; fi
      - name: Commit to the reports branch
        env:
          SHA: ${{ github.sha }}
        run: |
          git config user.name "grc-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin reports >/dev/null; then
            git fetch -q --depth=1 origin reports
            git worktree add -q pub FETCH_HEAD
            git -C pub checkout -q -B reports
          else
            git worktree add -q --detach pub
            git -C pub checkout -q --orphan reports
            git -C pub rm -rqf --cached . && find pub -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          find pub -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a out/. pub/
          cd pub
          git add -A
          if git diff --cached --quiet; then echo "Reports unchanged."; exit 0; fi
          git commit -q -m "Reports as of $(date -u +%F) (main@${SHA::7})"
          git push -q origin reports
          echo "Published: https://github.com/${GITHUB_REPOSITORY}/tree/reports" >> "$GITHUB_STEP_SUMMARY"
