name: Internal audit (reusable)

# plan: generate a workpaper per in-scope requirement, with test steps.
# sample: draw reproducible samples from each workpaper's population.
# Opens (or updates) a PR with the result; the auditor completes the workpapers in it or later PRs.
on:
  workflow_call:
    # Only these secrets reach this workflow (callers pass them by name, not `secrets: inherit`).
    secrets:
      GRC_ENGINE_TOKEN: {required: false}
    inputs:
      engagement:
        description: "Record folder: engagement (the main record) or engagement-<name> (another framework, e.g. engagement-27001)"
        type: string
        default: engagement
      engine:
        type: string
        default: pinned
      audit:
        type: string
        required: true
      action:
        type: string
        required: true

# The most this workflow may use; a caller can only grant less.
permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      GRC_ENGAGEMENT: ${{ inputs.engagement }}
    steps:
      - name: Check the record folder
        run: |
          [[ "$GRC_ENGAGEMENT" =~ ^engagement(-[a-z0-9]+)?$ ]] || {
            echo "::error::engagement must be 'engagement' or 'engagement-<name>' (lowercase letters and digits)"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Continue on the audit's branch if it already exists (never discard auditor work)
        env:
          AUDIT: ${{ inputs.audit }}
          ACTION: ${{ inputs.action }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          BRANCH="audit/$AUDIT-$ACTION${GRC_ENGAGEMENT#engagement}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git fetch -q origin "$BRANCH"
            git checkout -q -B "$BRANCH" FETCH_HEAD
            git config user.name "grc-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git merge -q --no-edit "origin/$BASE" || {
              echo "::error::$BRANCH conflicts with $BASE - resolve it (or merge/close its PR) and re-run."; exit 1; }
            echo "Continuing on existing branch $BRANCH (up to date with $BASE)"
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the GRC engine
        env:
          ENGINE: ${{ inputs.engine }}
          GRC_ENGINE_TOKEN: ${{ secrets.GRC_ENGINE_TOKEN }}
        run: |
          if [ "$ENGINE" = "local" ]; then
            pip install -q --require-hashes -r grc/resources/locks/engine.txt
            pip install -q --no-deps .
          else
            # requirements.txt pins the engine (git+https://github.com/<owner>/grc-readiness@engine-vX.Y.Z).
            # The engine repo is private: read it with GRC_ENGINE_TOKEN, then drop the credential again.
            if [ -n "$GRC_ENGINE_TOKEN" ]; then
              git config --global url."https://x-access-token:${GRC_ENGINE_TOKEN}@github.com/".insteadOf "https://github.com/"
            fi
            # The engine first, without its dependencies; then its dependencies from the engine's own hash-locked
            # file; then anything else the client's requirements.txt lists.
            grep -E '^grc-readiness' requirements.txt > "$RUNNER_TEMP/engine-pin.txt"
            pip install -q --no-deps -r "$RUNNER_TEMP/engine-pin.txt"
            if LOCK=$(python -m grc.locks engine 2>/dev/null); then
              pip install -q --require-hashes -r "$LOCK"
            else
              echo "::warning::This engine version has no lock files (added in 0.25.0), so its dependencies are not hash-checked. Merge the engine upgrade PR."
            fi
            pip install -q -r requirements.txt
            git config --global --unset-all url."https://x-access-token:${GRC_ENGINE_TOKEN}@github.com/".insteadOf || true
          fi
          python -c "import grc; print('GRC engine', grc.__version__)"
      - name: Run
        env:
          AUDIT: ${{ inputs.audit }}
          ACTION: ${{ inputs.action }}
        run: |
          case "$ACTION" in plan|sample) ;; *) echo "::error::action must be plan or sample"; exit 1;; esac
          python -m grc audit "$ACTION" "$AUDIT" --report report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUDIT: ${{ inputs.audit }}
          ACTION: ${{ inputs.action }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          BRANCH="audit/$AUDIT-$ACTION${GRC_ENGAGEMENT#engagement}"
          git config user.name "grc-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B "$BRANCH"
          git add -A "$GRC_ENGAGEMENT"/audit
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -q -m "Internal audit $AUDIT: $ACTION"
          git push origin "$BRANCH"
          { cat report.md; echo
            if [ "$ACTION" = plan ]; then
              echo "Next: merge, then run **Actions → Internal audit** with action \`sample\`."
            else
              echo "Next: merge, then complete each workpaper (results, conclusion, summary, performed_by/on) in PRs."
              echo "A second person sets reviewed_by/on. Raise findings in \`$GRC_ENGAGEMENT/findings.yaml\`."
            fi; } > body.md
          NUM=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -z "$NUM" ]; then
            gh pr create --base "$BASE" --head "$BRANCH" --title "Internal audit $AUDIT: $ACTION" --body-file body.md || {
              echo "::error title=Could not open the PR::Enable Settings -> Actions -> General -> 'Allow GitHub Actions to create and approve pull requests'. The work was pushed to branch $BRANCH."
              exit 1; }
          else
            gh pr edit "$NUM" --body-file body.md
          fi
          gh workflow run validate.yml --ref "$BRANCH"
