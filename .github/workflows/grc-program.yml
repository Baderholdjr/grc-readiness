name: Compliance program (reusable)

# The program layer (program/ at the repository root): common controls, governance calendar and
# quarterly owner certification.
#   action: issues  - open an Issue per obligation that is due soon or overdue; close it once done
#   action: certify - open a pull request per control owner with their certification for the quarter
#                     that just ended (program/certifications/<period>/<owner>.yaml)
# Called by thin wrappers in each repo; the triggers and permissions live there.
on:
  workflow_call:
    inputs:
      engine:
        description: "'pinned' = install the version in the caller's requirements.txt; 'local' = install from the checkout (engine repo only)"
        type: string
        default: pinned
      action:
        description: "issues or certify"
        type: string
        default: issues
      period:
        description: "certify: quarter such as 2026-Q3 (default: the quarter that just ended)"
        type: string
        default: ""

# The most this workflow may use; a caller can only grant less.
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  program:
    runs-on: ubuntu-latest
    env:
      ACTION: ${{ inputs.action }}
      PERIOD: ${{ inputs.period }}
    steps:
      - name: Check the inputs
        run: |
          [[ "$ACTION" =~ ^(issues|certify)$ ]] || { echo "::error::action must be issues or certify"; exit 1; }
          [[ -z "$PERIOD" || "$PERIOD" =~ ^[0-9]{4}-Q[1-4]$ ]] || { echo "::error::period must look like 2026-Q3"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: found
        run: |
          if [ -f program/controls.yaml ] || [ -f program/calendar.yaml ]; then echo "yes=true" >> "$GITHUB_OUTPUT"
          else echo "No program/ in this repository: nothing to do. See docs/PROGRAM.md." >> "$GITHUB_STEP_SUMMARY"; fi
      - if: steps.found.outputs.yes == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the GRC engine
        if: steps.found.outputs.yes == 'true'
        env:
          ENGINE: ${{ inputs.engine }}
          GRC_ENGINE_TOKEN: ${{ secrets.GRC_ENGINE_TOKEN }}
        run: |
          if [ "$ENGINE" = "local" ]; then
            pip install -q --require-hashes -r grc/resources/locks/engine.txt
            pip install -q --no-deps .
          else
            # requirements.txt pins the engine (git+https://github.com/<owner>/grc-readiness@engine-vX.Y.Z).
            # The engine repo is private: read it with GRC_ENGINE_TOKEN, then drop the credential again.
            if [ -n "$GRC_ENGINE_TOKEN" ]; then
              git config --global url."https://x-access-token:${GRC_ENGINE_TOKEN}@github.com/".insteadOf "https://github.com/"
            fi
            # The engine first, without its dependencies; then its dependencies from the engine's own hash-locked
            # file; then anything else the client's requirements.txt lists.
            grep -E '^grc-readiness' requirements.txt > "$RUNNER_TEMP/engine-pin.txt"
            pip install -q --no-deps -r "$RUNNER_TEMP/engine-pin.txt"
            if LOCK=$(python -m grc.locks engine 2>/dev/null); then
              pip install -q --require-hashes -r "$LOCK"
            else
              echo "::warning::This engine version has no lock files (added in 0.25.0), so its dependencies are not hash-checked. Merge the engine upgrade PR."
            fi
            pip install -q -r requirements.txt
            git config --global --unset-all url."https://x-access-token:${GRC_ENGINE_TOKEN}@github.com/".insteadOf || true
          fi
          python -c "import grc; print('GRC engine', grc.__version__)"
      - name: Obligation issues
        if: steps.found.outputs.yes == 'true' && env.ACTION == 'issues'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m grc program issues --apply | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Open owner certifications
        if: steps.found.outputs.yes == 'true' && env.ACTION == 'certify'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python -m grc program certify ${PERIOD:+--period "$PERIOD"} > created.txt
          [ -s created.txt ] || { echo "No new certifications (every owner already has one)." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          git config user.name "grc-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while read -r f; do
            period=$(basename "$(dirname "$f")"); owner_slug=$(basename "$f" .yaml)
            branch="certify/$period/$owner_slug"
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
              echo "- $branch already exists: left alone (the owner may be working on it)" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            owner=$(python -c "import sys,yaml; print(yaml.safe_load(open(sys.argv[1]))['owner'])" "$f")
            users=$(python -c "import sys; from grc import program as P; p=P.load_program('.'); print(','.join(p.github_users(sys.argv[1])))" "$owner")
            git checkout -q -B "$branch" "$GITHUB_SHA"
            git add "$f"
            git commit -q -m "Owner certification $period: $owner"
            git push -q -f origin "$branch"
            printf '%s\n' "**$owner**: please certify your controls for **$period**." "" \
              "Edit \`$f\` in this pull request: give each control a response (operating, exception, not_operating or not_applicable), add a note and a follow-up for anything that didn't operate, then set \`certified_by\` to your GitHub user and \`certified_on\` to today, and approve." "" \
              "Make the signing change yourself (editing the file on GitHub is easiest): CI checks that the commit setting certified_by is yours, and refuses a certification that leaves a control pending or skips one of your controls." > body.md
            gh pr create --base "$DEFAULT_BRANCH" --head "$branch" --title "Certify $period: $owner" --body-file body.md ${users:+--assignee "$users" --reviewer "$users"} \
              || gh pr create --base "$DEFAULT_BRANCH" --head "$branch" --title "Certify $period: $owner" --body-file body.md
            gh workflow run validate.yml --ref "$branch" || true
            git checkout -q "$GITHUB_SHA"
            echo "- opened certification for $owner ($period)" >> "$GITHUB_STEP_SUMMARY"
          done < created.txt
