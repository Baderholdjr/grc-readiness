name: Consultant workspace (reusable)

# Builds the Yata consultant workspace from workspace.yaml and deploys it to Cloudflare from main. See
# docs/WORKSPACE.md. The Worker's own secrets (GITHUB_CLIENT_SECRET, SESSION_KEY) are set on Cloudflare, never
# passed through GitHub; this workflow only needs the Cloudflare deploy token.
on:
  workflow_call:
    secrets:
      CLOUDFLARE_ACCOUNT_ID: {required: false}
      CLOUDFLARE_API_TOKEN: {required: false}
      GRC_ENGINE_TOKEN: {required: false}
    inputs:
      engine:
        type: string
        default: pinned

env:
  WRANGLER: wrangler@4.20.0

# Permissions come from the caller (the wrapper in the workspace repository).

jobs:
  workspace:
    runs-on: ubuntu-latest
    # The Cloudflare secrets live in this environment, which only main may deploy from (its deployment branch rule),
    # so a workflow edited on another branch can't reach them.
    environment: cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the GRC engine
        env:
          ENGINE: ${{ inputs.engine }}
          GRC_ENGINE_TOKEN: ${{ secrets.GRC_ENGINE_TOKEN }}
        run: |
          if [ "$ENGINE" = "local" ]; then
            pip install -q --require-hashes -r grc/resources/locks/engine.txt
            pip install -q --no-deps .
          else
            if [ -n "$GRC_ENGINE_TOKEN" ]; then
              export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="url.https://x-access-token:${GRC_ENGINE_TOKEN}@github.com/.insteadOf" GIT_CONFIG_VALUE_0="https://github.com/"
            fi
            # The engine first, without its dependencies; then its dependencies from the engine's own hash-locked
            # file; then anything else the client's requirements.txt lists.
            grep -E '^grc-readiness' requirements.txt > "$RUNNER_TEMP/engine-pin.txt"
            pip install -q --no-deps -r "$RUNNER_TEMP/engine-pin.txt"
            if LOCK=$(python -I -m grc.locks engine 2>/dev/null); then
              pip install -q --require-hashes -r "$LOCK"
            else
              if python -I -c "import grc,sys; sys.exit(0 if tuple(map(int, grc.__version__.split('.')[:2])) < (0, 25) else 1)"; then
                echo "::warning::This engine version has no lock files (added in 0.25.0), so its dependencies are not hash-checked. Merge the engine upgrade PR."
                pip install -q -r "$RUNNER_TEMP/engine-pin.txt"     # its dependencies, resolved the old way
              else
                echo "::error::The engine's lock file is missing; refusing to install unchecked dependencies."; exit 1
              fi
            fi
            unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 GRC_ENGINE_TOKEN   # not needed past here
            grep -vE '^grc-readiness' requirements.txt > "$RUNNER_TEMP/other-requirements.txt" || true
            pip install -q -r "$RUNNER_TEMP/other-requirements.txt"
          fi
          python -I -c "import grc; print('GRC engine', grc.__version__)"
      - name: Build the workspace
        shell: bash
        run: python -I -m grc workspace --config workspace.yaml --out _workspace | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Deploy to Cloudflare
        # main only: a run started by hand on another branch must not publish an unreviewed list of consultants
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Not deployed: set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (docs/WORKSPACE.md)." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          (cd _workspace && npx --yes "$WRANGLER" deploy | tee deploy.log)
          url=$(grep -Eo 'https://[a-z0-9.-]+\.workers\.dev' _workspace/deploy.log | head -1 || true)
          echo "Deployed the workspace: ${url:-see the Cloudflare dashboard}. Its sign-in callback is ${url:-<address>}/auth/callback" >> "$GITHUB_STEP_SUMMARY"
