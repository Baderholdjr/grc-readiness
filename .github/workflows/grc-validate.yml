name: Validate & build readiness reports (reusable)

# The CI gate for an engagement repo: blocks merges that would overstate readiness
# (e.g. "verified" without evidence), posts a readiness summary, and uploads the
# generated reports. Called by each client repo's validate.yml.
on:
  workflow_call:
    inputs:
      engine:
        type: string
        default: pinned

# The most this workflow may use; a caller can only grant less.
permissions:
  contents: read
  pull-requests: read

jobs:
  # A repository made from the template has no record until *New engagement* runs:
  # skip quietly instead of failing every scheduled run.
  record:
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.check.outputs.found }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        run: |
          if compgen -G "engagement/engagement.yaml" >/dev/null || compgen -G "engagement-*/engagement.yaml" >/dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No engagement record in this repository yet, so there is nothing to do. Start one with **Actions → New engagement**." >> "$GITHUB_STEP_SUMMARY"
          fi
  validate:
    needs: record
    if: needs.record.outputs.found == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the GRC engine
        env:
          ENGINE: ${{ inputs.engine }}
          GRC_ENGINE_TOKEN: ${{ secrets.GRC_ENGINE_TOKEN }}
        run: |
          if [ "$ENGINE" = "local" ]; then
            pip install -q --require-hashes -r grc/resources/locks/engine.txt
            pip install -q --no-deps .
          else
            # requirements.txt pins the engine (git+https://github.com/<owner>/grc-readiness@engine-vX.Y.Z).
            # The engine repo is private: read it with GRC_ENGINE_TOKEN, then drop the credential again.
            if [ -n "$GRC_ENGINE_TOKEN" ]; then
              git config --global url."https://x-access-token:${GRC_ENGINE_TOKEN}@github.com/".insteadOf "https://github.com/"
            fi
            # The engine first, without its dependencies; then its dependencies from the engine's own hash-locked
            # file; then anything else the client's requirements.txt lists.
            grep -E '^grc-readiness' requirements.txt > "$RUNNER_TEMP/engine-pin.txt"
            pip install -q --no-deps -r "$RUNNER_TEMP/engine-pin.txt"
            if LOCK=$(python -m grc.locks engine 2>/dev/null); then
              pip install -q --require-hashes -r "$LOCK"
            else
              echo "::warning::This engine version has no lock files (added in 0.25.0), so its dependencies are not hash-checked. Merge the engine upgrade PR."
            fi
            pip install -q -r requirements.txt
            git config --global --unset-all url."https://x-access-token:${GRC_ENGINE_TOKEN}@github.com/".insteadOf || true
          fi
          python -c "import grc; print('GRC engine', grc.__version__)"
      - name: Validate engagement (four-part evidence test, schemas, gaps)
        run: |
          # Every record in the repo: engagement/ plus engagement-*/ (one per extra framework).
          rc=0
          engs=$(python -m grc engagements) || exit 1
          for e in $engs; do
            [ "$e" = engagement ] || echo "### Record: $e" >> "$GITHUB_STEP_SUMMARY"
            python -m grc --engagement "$e" validate --format github --summary "$GITHUB_STEP_SUMMARY" || rc=1
          done
          # The program layer (program/: common controls, calendar, owner certifications), if there is one.
          if [ -d program ]; then
            echo "### Compliance program" >> "$GITHUB_STEP_SUMMARY"
            python -m grc program validate --format github --summary "$GITHUB_STEP_SUMMARY" || rc=1
          fi
          # Security questionnaires (questionnaires/: answers, the answer library), if there are any.
          if [ -d questionnaires ]; then
            python -m grc questionnaire validate --format github || rc=1
          fi
          exit $rc
      - name: Check who signed owner certifications
        if: github.event_name == 'pull_request' && hashFiles('program/certifications/**') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: python -m grc program signatures --pr "$PR" --format github
      - name: Build reports and brief
        run: |
          engs=$(python -m grc engagements) || exit 1
          for e in $engs; do
            if [ "$e" = engagement ]; then o=out; else o="out/$e"; fi
            python -m grc --engagement "$e" build --out "$o"
          done
          if [ -d program ]; then python -m grc program report --out out/program || echo "::warning::program reports not built"; fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: readiness-reports-${{ github.sha }}
          path: out/
          retention-days: 7
