name: Ingest client documents (reusable)

# Upload client documents to intake/ in a PR. This drafts engagement data from
# them (templates imported as-is; other documents drafted by Claude if enabled),
# commits the draft to the same PR, and comments a report for review.
# Every record reads its own folder: engagement/ <- intake/, engagement-27001/ <- intake-27001/, ...
# Called by thin wrappers in each repo; the triggers and permissions live there.
on:
  workflow_call:
    # Only these secrets reach this workflow (callers pass them by name, not `secrets: inherit`).
    secrets:
      ANTHROPIC_API_KEY: {required: false}
      GRC_ENGINE_TOKEN: {required: false}
    inputs:
      engine:
        description: "'pinned' = install the version in the caller's requirements.txt; 'local' = install from the checkout (engine repo only)"
        type: string
        default: pinned

# Permissions come from the caller (the wrapper in each repository), which sets the most this may use.
# A reusable workflow that asked for more than an older wrapper grants would fail to start, so none is asked here.

jobs:
  ingest:
    # Only same-repo branches (forks can't receive pushes or secrets).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          # Uploaded files are parsed below with the Anthropic key present: keep the write token off disk.
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the GRC engine
        env:
          ENGINE: ${{ inputs.engine }}
          GRC_ENGINE_TOKEN: ${{ secrets.GRC_ENGINE_TOKEN }}
        run: |
          if [ "$ENGINE" = "local" ]; then
            pip install -q --require-hashes -r grc/resources/locks/engine.txt
            pip install -q --no-deps .
          else
            # requirements.txt pins the engine (git+https://github.com/<owner>/grc-readiness@engine-vX.Y.Z).
            # The engine repo is private: read it with GRC_ENGINE_TOKEN, then drop the credential again.
            if [ -n "$GRC_ENGINE_TOKEN" ]; then
              export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="url.https://x-access-token:${GRC_ENGINE_TOKEN}@github.com/.insteadOf" GIT_CONFIG_VALUE_0="https://github.com/"
            fi
            # The engine first, without its dependencies; then its dependencies from the engine's own hash-locked
            # file; then anything else the client's requirements.txt lists.
            grep -E '^grc-readiness' requirements.txt > "$RUNNER_TEMP/engine-pin.txt"
            pip install -q --no-deps -r "$RUNNER_TEMP/engine-pin.txt"
            if LOCK=$(python -I -m grc.locks engine 2>/dev/null); then
              pip install -q --require-hashes -r "$LOCK"
            else
              if python -I -c "import grc,sys; sys.exit(0 if tuple(map(int, grc.__version__.split('.')[:2])) < (0, 25) else 1)"; then
                echo "::warning::This engine version has no lock files (added in 0.25.0), so its dependencies are not hash-checked. Merge the engine upgrade PR."
                pip install -q -r "$RUNNER_TEMP/engine-pin.txt"     # its dependencies, resolved the old way
              else
                echo "::error::The engine's lock file is missing; refusing to install unchecked dependencies."; exit 1
              fi
            fi
            unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 GRC_ENGINE_TOKEN   # not needed past here
            grep -vE '^grc-readiness' requirements.txt > "$RUNNER_TEMP/other-requirements.txt" || true
            pip install -q -r "$RUNNER_TEMP/other-requirements.txt"
          fi
          python -I -c "import grc; print('GRC engine', grc.__version__)"
      - name: Ingest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          engs=$(python -I -m grc engagements) || exit 1
          : > ingest-report.md
          # Engines from 0.20 read a document once for every record that has it (--all); older ones go record by record.
          if python -I -m grc ingest --help | grep -q -- "--all"; then
            python -I -m grc ingest --all --report-dir .
          else
            for e in $engs; do python -I -m grc --engagement "$e" ingest --report "report-$e.md"; done
          fi
          for e in $engs; do
            # only records whose folder had new or changed files get a section
            if ! grep -q "^No new or changed files" "report-$e.md"; then
              { [ "$e" = engagement ] || printf '## Record %s/\n\n' "$e"; cat "report-$e.md"; echo; } >> ingest-report.md
            fi
            rm -f "report-$e.md"
          done
          [ -s ingest-report.md ] || echo "No new or changed files in any intake folder." > ingest-report.md
      - name: Commit the draft to this PR
        id: commit
        env:
          PUSH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "grc-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- $(ls -d engagement engagement-* intake intake-* 2>/dev/null)
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -q -m "Ingest: draft engagement data from intake documents"
          # the token is used for this push only, never written to .git/config
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)" push origin "HEAD:refs/heads/$HEAD_REF"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Comment the report
        if: always() && hashFiles('ingest-report.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          head -c 60000 ingest-report.md > body.md
          gh pr comment "$PR_NUMBER" --body-file body.md
      - name: Validate the drafted commit
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: gh workflow run validate.yml --ref "$HEAD_REF"
