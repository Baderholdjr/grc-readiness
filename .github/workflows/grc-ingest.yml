name: Ingest client documents (reusable)

# Upload client documents to intake/ in a PR. This drafts engagement data from
# them (templates imported as-is; other documents drafted by Claude if enabled),
# commits the draft to the same PR, and comments a report for review.
# Every record reads its own folder: engagement/ <- intake/, engagement-27001/ <- intake-27001/, ...
# Called by thin wrappers in each repo; the triggers and permissions live there.
on:
  workflow_call:
    inputs:
      engine:
        description: "'pinned' = install the version in the caller's requirements.txt; 'local' = install from the checkout (engine repo only)"
        type: string
        default: pinned

jobs:
  ingest:
    # Only same-repo branches (forks can't receive pushes or secrets).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the GRC engine
        env:
          ENGINE: ${{ inputs.engine }}
          GRC_ENGINE_TOKEN: ${{ secrets.GRC_ENGINE_TOKEN }}
        run: |
          if [ "$ENGINE" = "local" ]; then
            pip install -q .
          else
            # requirements.txt pins the engine (git+https://github.com/<owner>/grc-readiness@engine-vX.Y.Z).
            # The engine repo is private: read it with GRC_ENGINE_TOKEN, then drop the credential again.
            if [ -n "$GRC_ENGINE_TOKEN" ]; then
              git config --global url."https://x-access-token:${GRC_ENGINE_TOKEN}@github.com/".insteadOf "https://github.com/"
            fi
            pip install -q -r requirements.txt
            git config --global --unset-all url."https://x-access-token:${GRC_ENGINE_TOKEN}@github.com/".insteadOf || true
          fi
          python -c "import grc; print('GRC engine', grc.__version__)"
      - name: Ingest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          engs=$(python -m grc engagements) || exit 1
          : > ingest-report.md
          for e in $engs; do
            python -m grc --engagement "$e" ingest --report "report-$e.md"
            # only records whose folder had new or changed files get a section
            if ! grep -q "^No new or changed files" "report-$e.md"; then
              { [ "$e" = engagement ] || printf '## Record %s/\n\n' "$e"; cat "report-$e.md"; echo; } >> ingest-report.md
            fi
            rm -f "report-$e.md"
          done
          [ -s ingest-report.md ] || echo "No new or changed files in any intake folder." > ingest-report.md
      - name: Commit the draft to this PR
        id: commit
        run: |
          git config user.name "grc-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- $(ls -d engagement engagement-* intake intake-* 2>/dev/null)
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -q -m "Ingest: draft engagement data from intake documents"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Comment the report
        if: always() && hashFiles('ingest-report.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          head -c 60000 ingest-report.md > body.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file body.md
      - name: Validate the drafted commit
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: gh workflow run validate.yml --ref "$HEAD_REF"
