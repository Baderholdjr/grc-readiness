name: ITGC test (reusable)

# Runs an IT general control test on a GitHub repository and opens a pull request with the workpaper
# (program/itgc/<id>/). The auditor completes the conclusion in that pull request (docs/ITGC.md).
#   test: change - change management for a period (merged PRs and direct pushes to the branch)
#   test: access - collaborators and invitations against program/itgc/access/<owner>__<repo>.yaml
# Reads other repositories with the GH_COLLECTOR_TOKEN secret (read-only), this one with GITHUB_TOKEN.
# Called by thin wrappers in each repo; the triggers and permissions live there.
on:
  workflow_call:
    # Only these secrets reach this workflow (callers pass them by name, not `secrets: inherit`).
    secrets:
      GH_COLLECTOR_TOKEN: {required: false}
      GRC_ENGINE_TOKEN: {required: false}
    inputs:
      engine:
        type: string
        default: pinned
      test:
        type: string
        required: true
      repo:
        type: string
        default: ""
      id:
        type: string
        required: true
      from:
        type: string
        default: ""
      to:
        type: string
        default: ""
      base:
        type: string
        default: main

# The most this workflow may use; a caller can only grant less.
permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  itgc:
    runs-on: ubuntu-latest
    env:
      TEST: ${{ inputs.test }}
      TARGET: ${{ inputs.repo }}
      TEST_ID: ${{ inputs.id }}
      FROM: ${{ inputs.from }}
      TO: ${{ inputs.to }}
      BASE: ${{ inputs.base }}
    steps:
      - name: Check the inputs
        run: |
          [[ "$TEST" =~ ^(change|access)$ ]] || { echo "::error::test must be change or access"; exit 1; }
          TARGET="${TARGET:-$GITHUB_REPOSITORY}"
          [[ "$TARGET" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]] || { echo "::error::repo must be owner/name"; exit 1; }
          [[ "$TEST_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,60}$ ]] || { echo "::error::id may contain letters, digits, . _ -"; exit 1; }
          [[ "$BASE" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::base must be a branch name"; exit 1; }
          if [ "$TEST" = change ]; then
            [[ "$FROM" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ && "$TO" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || {
              echo "::error::change needs from and to as YYYY-MM-DD"; exit 1; }
          fi
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"   # only after the checks
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the GRC engine
        env:
          ENGINE: ${{ inputs.engine }}
          GRC_ENGINE_TOKEN: ${{ secrets.GRC_ENGINE_TOKEN }}
        run: |
          if [ "$ENGINE" = "local" ]; then
            pip install -q --require-hashes -r grc/resources/locks/engine.txt
            pip install -q --no-deps .
          else
            # requirements.txt pins the engine (git+https://github.com/<owner>/grc-readiness@engine-vX.Y.Z).
            # The engine repo is private: read it with GRC_ENGINE_TOKEN, then drop the credential again.
            if [ -n "$GRC_ENGINE_TOKEN" ]; then
              export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="url.https://x-access-token:${GRC_ENGINE_TOKEN}@github.com/.insteadOf" GIT_CONFIG_VALUE_0="https://github.com/"
            fi
            # The engine first, without its dependencies; then its dependencies from the engine's own hash-locked
            # file; then anything else the client's requirements.txt lists.
            grep -E '^grc-readiness' requirements.txt > "$RUNNER_TEMP/engine-pin.txt"
            pip install -q --no-deps -r "$RUNNER_TEMP/engine-pin.txt"
            if LOCK=$(python -I -m grc.locks engine 2>/dev/null); then
              pip install -q --require-hashes -r "$LOCK"
            else
              if python -I -c "import grc,sys; sys.exit(0 if tuple(map(int, grc.__version__.split('.')[:2])) < (0, 25) else 1)"; then
                echo "::warning::This engine version has no lock files (added in 0.25.0), so its dependencies are not hash-checked. Merge the engine upgrade PR."
                pip install -q -r "$RUNNER_TEMP/engine-pin.txt"     # its dependencies, resolved the old way
              else
                echo "::error::The engine's lock file is missing; refusing to install unchecked dependencies."; exit 1
              fi
            fi
            unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 GRC_ENGINE_TOKEN   # not needed past here
            grep -vE '^grc-readiness' requirements.txt > "$RUNNER_TEMP/other-requirements.txt" || true
            pip install -q -r "$RUNNER_TEMP/other-requirements.txt"
          fi
          python -I -c "import grc; print('GRC engine', grc.__version__)"
      - name: Run the test
        env:
          GH_COLLECTOR_TOKEN: ${{ secrets.GH_COLLECTOR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$TARGET" = "$GITHUB_REPOSITORY" ] && [ -z "$GH_COLLECTOR_TOKEN" ]; then export GH_COLLECTOR_TOKEN="$GITHUB_TOKEN"; fi
          if [ "$TEST" = change ]; then
            python -I -m grc itgc change --repo "$TARGET" --id "$TEST_ID" --from "$FROM" --to "$TO" --base "$BASE" --report report.md
          else
            python -I -m grc itgc access --repo "$TARGET" --id "$TEST_ID" --report report.md
          fi
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open the workpaper pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "grc-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="itgc/$TEST_ID"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "::error::branch $branch already exists (a workpaper in progress). Use a new test id."; exit 1
          fi
          git checkout -q -B "$branch"
          git add "program/itgc/$TEST_ID"
          git commit -q -m "ITGC $TEST test $TEST_ID on $TARGET"
          git push -q -f origin "$branch"
          { echo "ITGC **$TEST** test on \`$TARGET\`. Complete the conclusion in \`program/itgc/$TEST_ID/workpaper.yaml\` before merging (docs/ITGC.md)."; echo; head -c 50000 report.md; } > body.md
          gh pr create --base "$DEFAULT_BRANCH" --head "$branch" --title "ITGC $TEST_ID ($TEST, $TARGET)" --body-file body.md || gh pr edit "$branch" --body-file body.md
          gh workflow run validate.yml --ref "$branch" || true
