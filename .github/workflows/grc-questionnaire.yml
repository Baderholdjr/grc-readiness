name: Security questionnaire (reusable)

# Answers security questionnaires (HECVAT 4) from the compliance program (docs/QUESTIONNAIRES.md).
#   import - read a workbook committed under questionnaires/inbox/ into questionnaires/<name>/ (pull request)
#   draft  - propose answers from the answer library, the company profile and the controls (pull request)
#   fill   - write the APPROVED answers into a copy of the workbook, or for a portal form (TX-RAMP) an answer
#            sheet to copy from (run artifact, kept 7 days);
#            with draft: true, proposed answers too, marked "[DRAFT - not approved]", for internal review
#   learn  - copy approved answers into questionnaires/library.yaml for the next questionnaire (pull request)
# Nothing here approves an answer: people do, in the pull request.
on:
  workflow_call:
    # Only these secrets reach this workflow (callers pass them by name, not `secrets: inherit`).
    secrets:
      GRC_ENGINE_TOKEN: {required: false}
    inputs:
      engine:
        type: string
        default: pinned
      action:
        type: string
        required: true
      name:
        type: string
        required: true
      definition:
        type: string
        default: hecvat-4
      workbook:
        type: string
        default: ""
      requester:
        type: string
        default: ""
      due:
        type: string
        default: ""
      draft:
        type: boolean
        default: false

# The most this workflow may use; a caller can only grant less.
permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  questionnaire:
    runs-on: ubuntu-latest
    env:
      ACTION: ${{ inputs.action }}
      QNAME: ${{ inputs.name }}
      WORKBOOK: ${{ inputs.workbook }}
      DEFINITION: ${{ inputs.definition }}
      REQUESTER: ${{ inputs.requester }}
      DUE: ${{ inputs.due }}
    steps:
      - name: Check the inputs
        run: |
          [[ "$ACTION" =~ ^(import|draft|fill|learn|report)$ ]] || { echo "::error::action must be import, draft, fill, learn or report"; exit 1; }
          [[ "$QNAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,60}$ && "$QNAME" != *..* && "$QNAME" != *. && "$QNAME" != *.lock ]] || {
            echo "::error::name may contain letters, digits, . _ - (no '..', not ending in . or .lock)"; exit 1; }
          if [ "$ACTION" = import ]; then
            [[ "$DEFINITION" =~ ^[a-z0-9-]{1,40}$ ]] || { echo "::error::definition must be e.g. hecvat-4 or txramp-aq-2"; exit 1; }
            # portal forms (TX-RAMP) have no workbook; workbooks must be uploaded to questionnaires/inbox/ first
            [ -z "$WORKBOOK" ] || [[ "$WORKBOOK" =~ ^questionnaires/inbox/[A-Za-z0-9._\ -]+\.xlsx$ ]] || {
              echo "::error::workbook must be an .xlsx under questionnaires/inbox/ (upload it there first)"; exit 1; }
            [ -z "$DUE" ] || [[ "$DUE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::due must be YYYY-MM-DD"; exit 1; }
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false     # a customer's workbook is parsed below; the token is used only to push
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the GRC engine
        env:
          ENGINE: ${{ inputs.engine }}
          GRC_ENGINE_TOKEN: ${{ secrets.GRC_ENGINE_TOKEN }}
        run: |
          if [ "$ENGINE" = "local" ]; then
            pip install -q --require-hashes -r grc/resources/locks/engine.txt
            pip install -q --no-deps .
          else
            if [ -n "$GRC_ENGINE_TOKEN" ]; then
              export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="url.https://x-access-token:${GRC_ENGINE_TOKEN}@github.com/.insteadOf" GIT_CONFIG_VALUE_0="https://github.com/"
            fi
            # The engine first, without its dependencies; then its dependencies from the engine's own hash-locked
            # file; then anything else the client's requirements.txt lists.
            grep -E '^grc-readiness' requirements.txt > "$RUNNER_TEMP/engine-pin.txt"
            pip install -q --no-deps -r "$RUNNER_TEMP/engine-pin.txt"
            if LOCK=$(python -I -m grc.locks engine 2>/dev/null); then
              pip install -q --require-hashes -r "$LOCK"
            else
              if python -I -c "import grc,sys; sys.exit(0 if tuple(map(int, grc.__version__.split('.')[:2])) < (0, 25) else 1)"; then
                echo "::warning::This engine version has no lock files (added in 0.25.0), so its dependencies are not hash-checked. Merge the engine upgrade PR."
                pip install -q -r "$RUNNER_TEMP/engine-pin.txt"     # its dependencies, resolved the old way
              else
                echo "::error::The engine's lock file is missing; refusing to install unchecked dependencies."; exit 1
              fi
            fi
            unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 GRC_ENGINE_TOKEN   # not needed past here
            grep -vE '^grc-readiness' requirements.txt > "$RUNNER_TEMP/other-requirements.txt" || true
            pip install -q -r "$RUNNER_TEMP/other-requirements.txt"
          fi
          python -I -c "import grc; print('GRC engine', grc.__version__)"
      - name: Run
        env:
          DRAFT: ${{ inputs.draft }}
        run: |
          case "$ACTION" in
            import)
              python -I -m grc questionnaire import --name "$QNAME" --definition "$DEFINITION" ${WORKBOOK:+--workbook "$WORKBOOK"} \
                --requester "$REQUESTER" ${DUE:+--due "$DUE"}
              if [ -n "$WORKBOOK" ]; then git rm -q --cached "$WORKBOOK" 2>/dev/null || true; rm -f "$WORKBOOK"; fi
              python -I -m grc questionnaire draft --name "$QNAME" ;;
            draft) python -I -m grc questionnaire draft --name "$QNAME" ;;
            learn) python -I -m grc questionnaire learn --name "$QNAME" ;;
            fill)
              # nothing leaves with an error in it: stop here if any answer fails validation
              python -I -m grc questionnaire validate --format github
              mkdir -p out
              if [ "$DRAFT" = true ]; then python -I -m grc questionnaire fill --name "$QNAME" --draft --out-dir out
              else python -I -m grc questionnaire fill --name "$QNAME" --out-dir out; fi ;;
          esac
          python -I -m grc questionnaire report --name "$QNAME" --out report.md --summary "$GITHUB_STEP_SUMMARY"
          python -I -m grc questionnaire validate --format github || true
      - name: Keep the filled workbook or answer sheet
        if: inputs.action == 'fill'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: questionnaire-${{ inputs.name }}${{ inputs.draft && '-DRAFT' || '' }}
          path: out/*
          retention-days: 7
      - name: Open a pull request
        if: inputs.action == 'import' || inputs.action == 'draft' || inputs.action == 'learn'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "grc-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="questionnaire/$QNAME-$ACTION-$GITHUB_RUN_NUMBER"
          git checkout -q -B "$branch"
          git add -A questionnaires
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -q -m "Questionnaire $QNAME: $ACTION"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)" push -q origin "$branch"
          { echo "Questionnaire **$QNAME**: $ACTION. Review the answers in \`questionnaires/$QNAME/answers.yaml\`; approve each one (status: approved, approved_by, approved_on) before it is sent (docs/QUESTIONNAIRES.md)."; echo; head -c 50000 report.md; } > body.md
          gh pr create --base "$DEFAULT_BRANCH" --head "$branch" --title "Questionnaire $QNAME: $ACTION" --body-file body.md
          gh workflow run validate.yml --ref "$branch" || true
