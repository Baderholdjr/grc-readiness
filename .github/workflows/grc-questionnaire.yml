name: Security questionnaire (reusable)

# Answers security questionnaires (HECVAT 4) from the compliance program (docs/QUESTIONNAIRES.md).
#   import - read a workbook committed under questionnaires/inbox/ into questionnaires/<name>/ (pull request)
#   draft  - propose answers from the answer library, the company profile and the controls (pull request)
#   fill   - write the APPROVED answers into a copy of the workbook (run artifact, kept 7 days);
#            with draft: true, proposed answers too, marked "[DRAFT - not approved]", for internal review
#   learn  - copy approved answers into questionnaires/library.yaml for the next questionnaire (pull request)
# Nothing here approves an answer: people do, in the pull request.
on:
  workflow_call:
    inputs:
      engine:
        type: string
        default: pinned
      action:
        type: string
        required: true
      name:
        type: string
        required: true
      workbook:
        type: string
        default: ""
      requester:
        type: string
        default: ""
      due:
        type: string
        default: ""
      draft:
        type: boolean
        default: false

jobs:
  questionnaire:
    runs-on: ubuntu-latest
    env:
      ACTION: ${{ inputs.action }}
      QNAME: ${{ inputs.name }}
      WORKBOOK: ${{ inputs.workbook }}
      REQUESTER: ${{ inputs.requester }}
      DUE: ${{ inputs.due }}
    steps:
      - name: Check the inputs
        run: |
          [[ "$ACTION" =~ ^(import|draft|fill|learn|report)$ ]] || { echo "::error::action must be import, draft, fill, learn or report"; exit 1; }
          [[ "$QNAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,60}$ ]] || { echo "::error::name may contain letters, digits, . _ -"; exit 1; }
          if [ "$ACTION" = import ]; then
            [[ "$WORKBOOK" =~ ^questionnaires/inbox/[A-Za-z0-9._\ -]+\.xlsx$ ]] || {
              echo "::error::workbook must be an .xlsx under questionnaires/inbox/ (upload it there first)"; exit 1; }
            [ -z "$DUE" ] || [[ "$DUE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::due must be YYYY-MM-DD"; exit 1; }
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the GRC engine
        env:
          ENGINE: ${{ inputs.engine }}
          GRC_ENGINE_TOKEN: ${{ secrets.GRC_ENGINE_TOKEN }}
        run: |
          if [ "$ENGINE" = "local" ]; then
            pip install -q .
          else
            if [ -n "$GRC_ENGINE_TOKEN" ]; then
              git config --global url."https://x-access-token:${GRC_ENGINE_TOKEN}@github.com/".insteadOf "https://github.com/"
            fi
            pip install -q -r requirements.txt
            git config --global --unset-all url."https://x-access-token:${GRC_ENGINE_TOKEN}@github.com/".insteadOf || true
          fi
          python -c "import grc; print('GRC engine', grc.__version__)"
      - name: Run
        env:
          DRAFT: ${{ inputs.draft }}
        run: |
          case "$ACTION" in
            import)
              python -m grc questionnaire import --name "$QNAME" --workbook "$WORKBOOK" --requester "$REQUESTER" ${DUE:+--due "$DUE"}
              git rm -q --cached "$WORKBOOK" 2>/dev/null || true; rm -f "$WORKBOOK"
              python -m grc questionnaire draft --name "$QNAME" ;;
            draft) python -m grc questionnaire draft --name "$QNAME" ;;
            learn) python -m grc questionnaire learn --name "$QNAME" ;;
            fill)
              if [ "$DRAFT" = true ]; then python -m grc questionnaire fill --name "$QNAME" --draft --out "out/$QNAME-DRAFT.xlsx"
              else python -m grc questionnaire fill --name "$QNAME" --out "out/$QNAME.xlsx"; fi ;;
          esac
          python -m grc questionnaire report --name "$QNAME" --out report.md --summary "$GITHUB_STEP_SUMMARY"
          python -m grc questionnaire validate --format github || true
      - name: Keep the filled workbook
        if: inputs.action == 'fill'
        uses: actions/upload-artifact@v6
        with:
          name: questionnaire-${{ inputs.name }}${{ inputs.draft && '-DRAFT' || '' }}
          path: out/*.xlsx
          retention-days: 7
      - name: Open a pull request
        if: inputs.action == 'import' || inputs.action == 'draft' || inputs.action == 'learn'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "grc-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="questionnaire/$QNAME-$ACTION-$GITHUB_RUN_NUMBER"
          git checkout -q -B "$branch"
          git add -A questionnaires
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -q -m "Questionnaire $QNAME: $ACTION"
          git push -q origin "$branch"
          { echo "Questionnaire **$QNAME**: $ACTION. Review the answers in \`questionnaires/$QNAME/answers.yaml\`; approve each one (status: approved, approved_by, approved_on) before it is sent (docs/QUESTIONNAIRES.md)."; echo; head -c 50000 report.md; } > body.md
          gh pr create --base "$DEFAULT_BRANCH" --head "$branch" --title "Questionnaire $QNAME: $ACTION" --body-file body.md
          gh workflow run validate.yml --ref "$branch" || true
