name: Client site (reusable)

# Builds the client site from the engagement record and, when it is set up, deploys it to
# Cloudflare (a Worker behind Cloudflare Access). See docs/CLIENT-SITE.md.
#   - Always: builds the site and uploads it as a workflow artifact (download it to preview).
#   - Deploys only when engagement.yaml has portal.enabled: true AND the repository has the
#     CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets.
#   - PORTAL_GITHUB_TOKEN (fine-grained, this repository only: Contents + Pull requests read/write)
#     is handed to the Worker so client answers can become pull requests. Without it the site is
#     read-only.
on:
  workflow_call:
    inputs:
      engine:
        type: string
        default: pinned

env:
  WRANGLER: wrangler@4.20.0

# The most this workflow may use; a caller can only grant less.
permissions:
  contents: read

jobs:
  # A repository made from the template has no record until *New engagement* runs:
  # skip quietly instead of failing every scheduled run.
  record:
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.check.outputs.found }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        run: |
          if compgen -G "engagement/engagement.yaml" >/dev/null || compgen -G "engagement-*/engagement.yaml" >/dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No engagement record in this repository yet, so there is nothing to do. Start one with **Actions → New engagement**." >> "$GITHUB_STEP_SUMMARY"
          fi
  site:
    needs: record
    if: needs.record.outputs.found == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the GRC engine
        env:
          ENGINE: ${{ inputs.engine }}
          GRC_ENGINE_TOKEN: ${{ secrets.GRC_ENGINE_TOKEN }}
        run: |
          if [ "$ENGINE" = "local" ]; then
            pip install -q --require-hashes -r grc/resources/locks/engine.txt
            pip install -q --no-deps .
          else
            if [ -n "$GRC_ENGINE_TOKEN" ]; then
              git config --global url."https://x-access-token:${GRC_ENGINE_TOKEN}@github.com/".insteadOf "https://github.com/"
            fi
            # The engine first, without its dependencies; then its dependencies from the engine's own hash-locked
            # file; then anything else the client's requirements.txt lists.
            grep -E '^grc-readiness' requirements.txt > "$RUNNER_TEMP/engine-pin.txt"
            pip install -q --no-deps -r "$RUNNER_TEMP/engine-pin.txt"
            if LOCK=$(python -m grc.locks engine 2>/dev/null); then
              pip install -q --require-hashes -r "$LOCK"
            else
              echo "::warning::This engine version has no lock files (added in 0.25.0), so its dependencies are not hash-checked. Merge the engine upgrade PR."
            fi
            pip install -q -r requirements.txt
            git config --global --unset-all url."https://x-access-token:${GRC_ENGINE_TOKEN}@github.com/".insteadOf || true
          fi
          python -c "import grc; print('GRC engine', grc.__version__)"
      - name: Build the client site
        shell: bash   # -o pipefail: a failed build fails the step, even through tee
        run: python -m grc portal --out _portal | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: client-site-${{ github.sha }}
          path: _portal/
          retention-days: 7
      - name: Decide whether to deploy
        id: cfg
        env:
          HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          enabled=$(python -c "import yaml; e=yaml.safe_load(open('engagement/engagement.yaml')) or {}; print(str(bool((e.get('portal') or {}).get('enabled'))).lower())")
          if [ "$enabled" != "true" ]; then
            echo "Client site not deployed: set portal.enabled: true in engagement.yaml (docs/CLIENT-SITE.md)." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_CF" != "true" ]; then
            echo "::warning title=Client site::portal.enabled is true but the CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are missing - not deployed."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to Cloudflare
        if: steps.cfg.outputs.deploy == 'true'
        shell: bash   # -o pipefail: a failed deploy fails the step, even through tee
        working-directory: _portal
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PORTAL_GITHUB_TOKEN: ${{ secrets.PORTAL_GITHUB_TOKEN }}
        run: |
          npx --yes "$WRANGLER" deploy | tee deploy.log
          if [ -n "$PORTAL_GITHUB_TOKEN" ]; then
            printf '%s' "$PORTAL_GITHUB_TOKEN" | npx --yes "$WRANGLER" secret put GITHUB_TOKEN >/dev/null
            echo "Answers enabled (GITHUB_TOKEN set on the Worker)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Client site::PORTAL_GITHUB_TOKEN is not set - the site is read-only (clients can't send answers)."
          fi
          url=$(grep -Eo 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          echo "Deployed: ${url:-see the Cloudflare dashboard}" >> "$GITHUB_STEP_SUMMARY"
