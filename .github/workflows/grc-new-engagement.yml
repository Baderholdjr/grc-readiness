name: New engagement (reusable)

# Start a new client from the GitHub website: Actions -> New engagement -> Run workflow.
# Opens a PR that replaces the current record (engagement/ and intake/) with a
# clean one for the new client. Review and merge it to begin.
# Called by thin wrappers in each repo; the triggers and permissions live there.
on:
  workflow_call:
    inputs:
      engagement:
        description: "Record folder: engagement (the main record) or engagement-<name> (another framework, e.g. engagement-27001)"
        type: string
        default: engagement
      framework:
        description: "Framework id: iso42001, iso27001 or soc2"
        type: string
        default: iso42001
      engine:
        description: "'pinned' = install the version in the caller's requirements.txt; 'local' = install from the checkout (engine repo only)"
        type: string
        default: pinned
      client:
        type: string
        required: true
      start:
        type: string
        required: true
      stage1:
        type: string
        required: true
      stage2:
        type: string
        required: true
      hours:
        type: string
        required: true
      lead:
        type: string
        required: false
      categories:
        description: "Optional categories in scope, comma-separated (SOC 2: availability,confidentiality,processing_integrity,privacy)"
        type: string
        required: false

jobs:
  new:
    runs-on: ubuntu-latest
    env:
      GRC_ENGAGEMENT: ${{ inputs.engagement }}
      FRAMEWORK: ${{ inputs.framework }}
      CATEGORIES: ${{ inputs.categories }}
    steps:
      - name: Check the record folder
        run: |
          [[ "$GRC_ENGAGEMENT" =~ ^engagement(-[a-z0-9]+)?$ ]] || {
            echo "::error::engagement must be 'engagement' or 'engagement-<name>' (lowercase letters and digits)"; exit 1; }
          [[ "$FRAMEWORK" =~ ^[a-z0-9]+$ ]] || { echo "::error::framework must be an id such as iso27001"; exit 1; }
          CATEGORIES="${CATEGORIES// /}"     # "availability, privacy" is fine
          [[ -z "$CATEGORIES" || "$CATEGORIES" =~ ^[a-z_]+(,[a-z_]+)*$ ]] || {
            echo "::error::categories must be a comma-separated list such as availability,confidentiality"; exit 1; }
          echo "CATEGORIES=$CATEGORIES" >> "$GITHUB_ENV"   # only after the check: nothing else can reach GITHUB_ENV
          # the main record uses intake/; another framework's record gets its own intake folder
          if [ "$GRC_ENGAGEMENT" = engagement ]; then echo "INTAKE=intake" >> "$GITHUB_ENV"
          else echo "INTAKE=intake${GRC_ENGAGEMENT#engagement}" >> "$GITHUB_ENV"; fi
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the GRC engine
        env:
          ENGINE: ${{ inputs.engine }}
          GRC_ENGINE_TOKEN: ${{ secrets.GRC_ENGINE_TOKEN }}
        run: |
          if [ "$ENGINE" = "local" ]; then
            pip install -q .
          else
            # requirements.txt pins the engine (git+https://github.com/<owner>/grc-readiness@engine-vX.Y.Z).
            # The engine repo is private: read it with GRC_ENGINE_TOKEN, then drop the credential again.
            if [ -n "$GRC_ENGINE_TOKEN" ]; then
              git config --global url."https://x-access-token:${GRC_ENGINE_TOKEN}@github.com/".insteadOf "https://github.com/"
            fi
            pip install -q -r requirements.txt
            git config --global --unset-all url."https://x-access-token:${GRC_ENGINE_TOKEN}@github.com/".insteadOf || true
          fi
          python -c "import grc; print('GRC engine', grc.__version__)"
      - name: Reset the record
        env:
          CLIENT: ${{ inputs.client }}
          START: ${{ inputs.start }}
          STAGE1: ${{ inputs.stage1 }}
          STAGE2: ${{ inputs.stage2 }}
          HOURS: ${{ inputs.hours }}
          LEAD: ${{ inputs.lead }}
        run: |
          python -m grc new-engagement --client "$CLIENT" --start "$START" --stage1 "$STAGE1" \
            --stage2 "$STAGE2" --hours "$HOURS" ${LEAD:+--lead "$LEAD"} --framework "$FRAMEWORK" \
            --intake "$INTAKE" ${CATEGORIES:+--categories "$CATEGORIES"} --confirm-reset
          python -m grc validate
      - name: Open the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLIENT: ${{ inputs.client }}
        run: |
          BRANCH="new-engagement/$(echo "$CLIENT" | tr -cs 'A-Za-z0-9' '-' | tr 'A-Z' 'a-z' | sed 's/^-//;s/-$//')${GRC_ENGAGEMENT#engagement}"
          git config user.name "grc-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A "$GRC_ENGAGEMENT" "$INTAKE"
          git commit -q -m "New engagement: $CLIENT"
          git push -f origin "$BRANCH"
          if [ "$GRC_ENGAGEMENT" = engagement ]; then
            WHAT="Replaces the current engagement record with a clean one for **$CLIENT**."
            WARN="Merging this deletes the previous engagement data from \`main\` (it remains in git history)."
          else
            WHAT="Adds (or resets) the **$FRAMEWORK** record \`$GRC_ENGAGEMENT/\` for **$CLIENT**, next to the main record."
            WARN="If \`$GRC_ENGAGEMENT/\` already existed, merging this replaces it (it remains in git history). The main record is not touched."
          fi
          printf '%s\n' "$WHAT" "" \
            "Next: edit \`$GRC_ENGAGEMENT/owners.yaml\`, then upload client documents to \`$INTAKE/\` and configure \`$GRC_ENGAGEMENT/collectors.yaml\`." \
            "" "$WARN" > body.md
          gh pr create --base main --head "$BRANCH" --title "New engagement: $CLIENT" --body-file body.md
          gh workflow run validate.yml --ref "$BRANCH"
