name: Hours (reusable)

# import: read every CSV in intake/timesheets/ (Toggl, Harvest, Clockify or generic). Re-importing is safe:
#         entries already in the timesheet are skipped. Set the repository variable HOURS_MATCH to keep
#         only rows whose client or project contains that text.
# log:    add one entry (who = the person running the workflow, unless given).
on:
  workflow_call:
    # Only these secrets reach this workflow (callers pass them by name, not `secrets: inherit`).
    secrets:
      GRC_ENGINE_TOKEN: {required: false}
    inputs:
      engine:
        type: string
        default: pinned
      action:
        type: string
        default: import
      hours:
        type: string
        default: ""
      activity:
        type: string
        default: ""
      date:
        type: string
        default: ""
      note:
        type: string
        default: ""
      refs:
        type: string
        default: ""
      person:
        type: string
        default: ""
      phase:
        type: string
        default: ""

# The most this workflow may use; a caller can only grant less.
permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  # A repository made from the template has no record until *New engagement* runs:
  # skip quietly instead of failing every scheduled run.
  record:
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.check.outputs.found }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        run: |
          if compgen -G "engagement/engagement.yaml" >/dev/null || compgen -G "engagement-*/engagement.yaml" >/dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No engagement record in this repository yet, so there is nothing to do. Start one with **Actions → New engagement**." >> "$GITHUB_STEP_SUMMARY"
          fi
  hours:
    needs: record
    if: needs.record.outputs.found == 'true'
    runs-on: ubuntu-latest
    env:
      BRANCH: hours/updates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Continue the open timesheet branch if there is one (never discard edits)
        env:
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git fetch -q origin "$BRANCH"
            git checkout -q -B "$BRANCH" FETCH_HEAD
            git config user.name "grc-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git merge -q --no-edit "origin/$BASE" || {
              echo "::error::$BRANCH conflicts with $BASE - resolve it (or merge/close its PR) and re-run."; exit 1; }
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the GRC engine
        env:
          ENGINE: ${{ inputs.engine }}
          GRC_ENGINE_TOKEN: ${{ secrets.GRC_ENGINE_TOKEN }}
        run: |
          if [ "$ENGINE" = "local" ]; then
            pip install -q --require-hashes -r grc/resources/locks/engine.txt
            pip install -q --no-deps .
          else
            # requirements.txt pins the engine (git+https://github.com/<owner>/grc-readiness@engine-vX.Y.Z).
            # The engine repo is private: read it with GRC_ENGINE_TOKEN, then drop the credential again.
            if [ -n "$GRC_ENGINE_TOKEN" ]; then
              export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="url.https://x-access-token:${GRC_ENGINE_TOKEN}@github.com/.insteadOf" GIT_CONFIG_VALUE_0="https://github.com/"
            fi
            # The engine first, without its dependencies; then its dependencies from the engine's own hash-locked
            # file; then anything else the client's requirements.txt lists.
            grep -E '^grc-readiness' requirements.txt > "$RUNNER_TEMP/engine-pin.txt"
            pip install -q --no-deps -r "$RUNNER_TEMP/engine-pin.txt"
            if LOCK=$(python -I -m grc.locks engine 2>/dev/null); then
              pip install -q --require-hashes -r "$LOCK"
            else
              if python -I -c "import grc,sys; sys.exit(0 if tuple(map(int, grc.__version__.split('.')[:2])) < (0, 25) else 1)"; then
                echo "::warning::This engine version has no lock files (added in 0.25.0), so its dependencies are not hash-checked. Merge the engine upgrade PR."
                pip install -q -r "$RUNNER_TEMP/engine-pin.txt"     # its dependencies, resolved the old way
              else
                echo "::error::The engine's lock file is missing; refusing to install unchecked dependencies."; exit 1
              fi
            fi
            unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 GRC_ENGINE_TOKEN   # not needed past here
            grep -vE '^grc-readiness' requirements.txt > "$RUNNER_TEMP/other-requirements.txt" || true
            pip install -q -r "$RUNNER_TEMP/other-requirements.txt"
          fi
          python -I -c "import grc; print('GRC engine', grc.__version__)"
      - name: Run
        env:
          ACTION: ${{ inputs.action }}
          HOURS: ${{ inputs.hours }}
          ACTIVITY: ${{ inputs.activity }}
          DATE: ${{ inputs.date }}
          NOTE: ${{ inputs.note }}
          REFS: ${{ inputs.refs }}
          PERSON: ${{ inputs.person || github.actor }}
          PHASE: ${{ inputs.phase }}
          MATCH: ${{ vars.HOURS_MATCH }}
        run: |
          if [ "$ACTION" = log ]; then
            [[ "$HOURS" =~ ^([0-9]+([.][0-9]+)?|[.][0-9]+)$ ]] || { echo "::error::hours must be a number"; exit 1; }
            python -I -m grc hours log --hours "$HOURS" --activity "$ACTIVITY" --person "$PERSON" \
              ${DATE:+--date "$DATE"} ${NOTE:+--note "$NOTE"} ${REFS:+--refs "$REFS"} ${PHASE:+--phase "$PHASE"} --report report.md
          else
            shopt -s nullglob
            files=(intake/timesheets/*.csv)
            if [ ${#files[@]} -eq 0 ]; then echo "No CSV files in intake/timesheets/."; exit 0; fi
            python -I -m grc hours import "${files[@]}" ${MATCH:+--match "$MATCH"} --report report.md
          fi
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          [ -f report.md ] || exit 0
          git config user.name "grc-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B "$BRANCH"
          git add engagement/hours.yaml
          if git diff --cached --quiet; then echo "No new hours."; exit 0; fi
          git commit -q -m "Timesheet update"
          git push origin "$BRANCH"
          { cat report.md; echo
            echo "Merging records these hours. The reports show burn by phase, activity and person, and a forecast."; } > body.md
          NUM=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -z "$NUM" ]; then
            gh pr create --base "$BASE" --head "$BRANCH" --title "Timesheet update" --body-file body.md || {
              echo "::error title=Could not open the PR::Enable Settings -> Actions -> General -> 'Allow GitHub Actions to create and approve pull requests'. The work was pushed to branch $BRANCH."
              exit 1; }
          else
            gh pr edit "$NUM" --body-file body.md
          fi
          gh workflow run validate.yml --ref "$BRANCH"
