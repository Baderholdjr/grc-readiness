name: Management review

# Actions -> Management review -> Run workflow.
#   new  + planned date (YYYY-MM-DD)  : schedule a review
#   pack + review id (MR-2027-01)     : generate its input pack before the meeting
on:
  workflow_dispatch:
    inputs:
      action:
        description: "new or pack"
        required: true
        type: choice
        options: [new, pack]
      target: {description: "new: planned date YYYY-MM-DD; pack: review id (MR-2027-01)", required: false, default: ""}
      engagement: {description: "Record folder: engagement (main) or engagement-27001 etc. for another framework", required: false, default: engagement}

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  review:
    uses: ./.github/workflows/grc-review.yml
    with:
      engine: local
      engagement: ${{ inputs.engagement }}
      action: ${{ inputs.action }}
      target: ${{ inputs.target }}
    secrets: inherit
