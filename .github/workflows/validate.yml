name: Validate & build readiness reports

# Every PR is a proposed change to the engagement record. This gate blocks
# merges that would overstate readiness (e.g. "verified" without evidence).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read   # who signed owner certifications (program/)

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -q --require-hashes -r grc/resources/locks/dev.txt
          pip install -q --no-deps .
      # Validate the engagement first: this is the check reviewers care about,
      # and it writes the readiness table to the run's Summary page.
      - name: Validate engagement (four-part evidence test, schemas, gaps)
        run: python -m grc validate --format github --summary "$GITHUB_STEP_SUMMARY"
      - name: Unit tests (engine, against tests/fixtures)
        if: success() || failure()
        run: pytest -q
      - name: Build reports and brief
        run: python -m grc build --out out
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: readiness-reports-${{ github.sha }}
          path: out/
          retention-days: 7
