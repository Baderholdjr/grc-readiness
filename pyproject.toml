[project]
name = "grc-readiness"
version = "0.1.0"
description = "GRC-as-code engine for certification readiness engagements"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.18", "python-docx>=1.1", "openpyxl>=3.1", "pypdf>=4.0"]

[project.optional-dependencies]
aws = ["boto3>=1.34"]

[project.scripts]
grc = "grc.cli:main"

[tool.setuptools]
packages = ["grc", "grc.collectors", "grc.ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
