[project]
name = "grc-readiness"
version = "0.8.0"
description = "GRC-as-code engine for certification readiness engagements"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.18", "python-docx>=1.1", "openpyxl>=3.1", "pypdf>=4.0", "reportlab>=4.0"]

[project.optional-dependencies]
aws = ["boto3>=1.34"]

[project.scripts]
grc = "grc.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["grc", "grc.collectors", "grc.ingest"]
include-package-data = false

[tool.setuptools.package-data]
grc = ["resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
