<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 200" width="930" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#9fb2bd"/></marker></defs><rect width="930" height="200" rx="10" fill="#ffffff"/><rect x="20" y="40" width="136" height="80" rx="6" fill="#dcecec" stroke="#2f6f73"/><text x="88.0" y="77.0" text-anchor="middle" font-size="14" font-weight="600" fill="#183B4E">Client person</text><text x="88.0" y="96.0" text-anchor="middle" font-size="12" fill="#5b6b75">answers a request</text><line x1="158" y1="80" x2="170" y2="80" stroke="#9fb2bd" stroke-width="1.6" marker-end="url(#a)"/><rect x="172" y="40" width="136" height="80" rx="6" fill="#f2f5f6" stroke="#9fb2bd"/><text x="240.0" y="77.0" text-anchor="middle" font-size="14" font-weight="600" fill="#183B4E">Cloudflare Access</text><text x="240.0" y="96.0" text-anchor="middle" font-size="12" fill="#5b6b75">checks the login</text><text x="240.0" y="112.0" text-anchor="middle" font-size="12" fill="#5b6b75">(email code)</text><line x1="310" y1="80" x2="322" y2="80" stroke="#9fb2bd" stroke-width="1.6" marker-end="url(#a)"/><rect x="324" y="40" width="136" height="80" rx="6" fill="#dcecec" stroke="#2f6f73"/><text x="392.0" y="77.0" text-anchor="middle" font-size="14" font-weight="600" fill="#183B4E">Worker</text><text x="392.0" y="96.0" text-anchor="middle" font-size="12" fill="#5b6b75">validates, writes</text><text x="392.0" y="112.0" text-anchor="middle" font-size="12" fill="#5b6b75">SUB-….yaml</text><line x1="462" y1="80" x2="474" y2="80" stroke="#9fb2bd" stroke-width="1.6" marker-end="url(#a)"/><rect x="476" y="40" width="136" height="80" rx="6" fill="#f6e8d6" stroke="#a5641a"/><text x="544.0" y="77.0" text-anchor="middle" font-size="14" font-weight="600" fill="#183B4E">Pull request</text><text x="544.0" y="96.0" text-anchor="middle" font-size="12" fill="#5b6b75">label</text><text x="544.0" y="112.0" text-anchor="middle" font-size="12" fill="#5b6b75">client-submission</text><line x1="614" y1="80" x2="626" y2="80" stroke="#9fb2bd" stroke-width="1.6" marker-end="url(#a)"/><rect x="628" y="40" width="136" height="80" rx="6" fill="#f6e8d6" stroke="#a5641a"/><text x="696.0" y="77.0" text-anchor="middle" font-size="14" font-weight="600" fill="#183B4E">Analyst</text><text x="696.0" y="96.0" text-anchor="middle" font-size="12" fill="#5b6b75">sets status, files</text><text x="696.0" y="112.0" text-anchor="middle" font-size="12" fill="#5b6b75">evidence, merges</text><line x1="766" y1="80" x2="778" y2="80" stroke="#9fb2bd" stroke-width="1.6" marker-end="url(#a)"/><rect x="780" y="40" width="136" height="80" rx="6" fill="#dcecec" stroke="#2f6f73"/><text x="848.0" y="77.0" text-anchor="middle" font-size="14" font-weight="600" fill="#183B4E">Client site</text><text x="848.0" y="96.0" text-anchor="middle" font-size="12" fill="#5b6b75">shows Accepted or</text><text x="848.0" y="112.0" text-anchor="middle" font-size="12" fill="#5b6b75">“We need a bit more”</text><path d="M842,122 L842,160 L88,160 L88,124" fill="none" stroke="#9fb2bd" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="465" y="180" text-anchor="middle" font-size="12" fill="#5b6b75">The site rebuilds after every merge, so the client sees the result. An answer never changes a control, gap or evidence status by itself.</text></svg>