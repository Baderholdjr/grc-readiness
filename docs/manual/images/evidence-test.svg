<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 290" width="930" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#9fb2bd"/></marker></defs><rect width="930" height="290" rx="10" fill="#ffffff"/><rect x="20" y="30" width="200" height="76" rx="6" fill="#dcecec" stroke="#2f6f73"/><text x="120.0" y="65.0" text-anchor="middle" font-size="14" font-weight="600" fill="#183B4E">Documented</text><text x="120.0" y="84.0" text-anchor="middle" font-size="12" fill="#5b6b75">approved policy or</text><text x="120.0" y="100.0" text-anchor="middle" font-size="12" fill="#5b6b75">procedure exists</text><line x1="222" y1="68" x2="246" y2="68" stroke="#9fb2bd" stroke-width="1.6" marker-end="url(#a)"/><rect x="248" y="30" width="200" height="76" rx="6" fill="#dcecec" stroke="#2f6f73"/><text x="348.0" y="65.0" text-anchor="middle" font-size="14" font-weight="600" fill="#183B4E">Implemented</text><text x="348.0" y="84.0" text-anchor="middle" font-size="12" fill="#5b6b75">the process is</text><text x="348.0" y="100.0" text-anchor="middle" font-size="12" fill="#5b6b75">really in use</text><line x1="450" y1="68" x2="474" y2="68" stroke="#9fb2bd" stroke-width="1.6" marker-end="url(#a)"/><rect x="476" y="30" width="200" height="76" rx="6" fill="#dcecec" stroke="#2f6f73"/><text x="576.0" y="65.0" text-anchor="middle" font-size="14" font-weight="600" fill="#183B4E">Evidenced</text><text x="576.0" y="84.0" text-anchor="middle" font-size="12" fill="#5b6b75">current records show</text><text x="576.0" y="100.0" text-anchor="middle" font-size="12" fill="#5b6b75">it operating</text><line x1="678" y1="68" x2="702" y2="68" stroke="#9fb2bd" stroke-width="1.6" marker-end="url(#a)"/><rect x="704" y="30" width="200" height="76" rx="6" fill="#dcecec" stroke="#2f6f73"/><text x="804.0" y="65.0" text-anchor="middle" font-size="14" font-weight="600" fill="#183B4E">Tested</text><text x="804.0" y="84.0" text-anchor="middle" font-size="12" fill="#5b6b75">a sample or interview</text><text x="804.0" y="100.0" text-anchor="middle" font-size="12" fill="#5b6b75">confirms it works</text><text x="20" y="140" font-size="13" font-weight="600" fill="#183B4E">Each leg moves through four statuses</text><rect x="20" y="152" width="200" height="70" rx="6" fill="#f2f5f6" stroke="#9fb2bd"/><text x="120.0" y="184.0" text-anchor="middle" font-size="14" font-weight="600" fill="#183B4E">not_started</text><text x="120.0" y="203.0" text-anchor="middle" font-size="12" fill="#5b6b75">nothing yet</text><line x1="222" y1="187" x2="246" y2="187" stroke="#9fb2bd" stroke-width="1.6" marker-end="url(#a)"/><rect x="248" y="152" width="200" height="70" rx="6" fill="#f6e8d6" stroke="#a5641a"/><text x="348.0" y="184.0" text-anchor="middle" font-size="14" font-weight="600" fill="#183B4E">claimed</text><text x="348.0" y="203.0" text-anchor="middle" font-size="12" fill="#5b6b75">the client says so;</text><text x="348.0" y="219.0" text-anchor="middle" font-size="12" fill="#5b6b75">a hypothesis</text><line x1="450" y1="187" x2="474" y2="187" stroke="#9fb2bd" stroke-width="1.6" marker-end="url(#a)"/><rect x="476" y="152" width="200" height="70" rx="6" fill="#f2f5f6" stroke="#9fb2bd"/><text x="576.0" y="184.0" text-anchor="middle" font-size="14" font-weight="600" fill="#183B4E">partial</text><text x="576.0" y="203.0" text-anchor="middle" font-size="12" fill="#5b6b75">some evidence,</text><text x="576.0" y="219.0" text-anchor="middle" font-size="12" fill="#5b6b75">not enough yet</text><line x1="678" y1="187" x2="702" y2="187" stroke="#9fb2bd" stroke-width="1.6" marker-end="url(#a)"/><rect x="704" y="152" width="200" height="70" rx="6" fill="#183B4E" stroke="#183B4E"/><text x="804.0" y="184.0" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">verified</text><text x="804.0" y="203.0" text-anchor="middle" font-size="12" fill="#c9d6dd">analyst confirmed</text><text x="804.0" y="219.0" text-anchor="middle" font-size="12" fill="#c9d6dd">on current evidence</text><text x="20" y="252" font-size="12" fill="#5b6b75">A requirement is Ready only when all four legs are verified. Evidence expires; a leg resting on expired or failing evidence stops counting.</text><text x="20" y="270" font-size="12" fill="#5b6b75">Automation can move a leg to claimed (ingest) or partial (collectors). Only a person, in a reviewed pull request, sets verified.</text></svg>