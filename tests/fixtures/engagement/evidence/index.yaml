# Evidence index: POINTERS to artifacts, not the artifacts themselves.
# Keep confidential evidence in the client's systems (GRC tool, document
# management) and record where it is, when it was collected, who approved it,
# and optionally its sha256 so an auditor can confirm it hasn't changed.
#
# type: document  -> designed control (policy, procedure, template). Needs approved_by to verify "Documented".
#       record/log/config/screenshot -> operating evidence ("Implemented", "Evidence exists").
#       test/sample/interview        -> independent testing ("Tested").
# valid_for_days: after collected + N days the item is EXPIRED and stops counting.

