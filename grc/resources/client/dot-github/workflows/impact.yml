name: AI impact assessment

# Actions -> AI impact assessment -> Run workflow: an inventory id (INV-001) or "all".
on:
  workflow_dispatch:
    inputs:
      system: {description: "AI system inventory id (e.g. INV-001) or all", required: true, default: all}

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  impact:
    uses: __ENGINE_REPO__/.github/workflows/grc-impact.yml@engine-v__ENGINE_MAJOR__
    with:
      engine: pinned
      system: ${{ inputs.system }}
    secrets: inherit
