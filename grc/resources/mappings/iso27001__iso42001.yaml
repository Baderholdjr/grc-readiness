# PROPOSED mappings between ISO/IEC 27001:2022 and ISO/IEC 42001:2023 (engine default).
#
# Nothing here counts until a person reviews it: copy this file to mappings/ at the root of the client
# repository, check each line against licensed copies of both standards and the client's actual processes,
# and fill reviewed_by and reviewed_on. Only reviewed `equivalent` mappings let one piece of evidence count
# for both records (cited as "<framework>:<id>", e.g. iso42001:DOC-DOCINFO). `related` mappings are pointers.
# Our own judgement; no text of either standard is reproduced.

