# PROPOSED mappings between Global CBPR / PRP and ISO/IEC 27001:2022 (engine default).
#
# Nothing here counts until a person reviews it: copy this file to mappings/ at the root of the client
# repository, check each line against both frameworks and the client's actual controls, and fill reviewed_by
# and reviewed_on. Only reviewed `equivalent` mappings let one piece of evidence count for both records (cited
# as "<framework>:<id>"). The rest are pointers. `subset`: the CBPR requirement (first framework) is narrower;
# `superset`: wider. Our own judgement; no standard's text is reproduced.
#
# None is `equivalent`: a CBPR requirement is about personal information and its owners; an ISO 27001 control is about information security. Evidence for one is a strong pointer for the other, never proof on its own.

