# PROPOSED mappings between the GDPR and SOC 2 (Trust Services Criteria) (engine default).
#
# Nothing here counts until a person reviews it: copy this file to mappings/ at the root of the client
# repository, check each line against both frameworks and the client's actual controls, and fill reviewed_by
# and reviewed_on. Only reviewed `equivalent` mappings let one piece of evidence count for both records (cited
# as "<framework>:<id>"). The rest are pointers. `subset`: the GDPR requirement (first framework) is narrower;
# `superset`: wider. Our own judgement; no standard's text is reproduced.
#
# None is `equivalent`: a GDPR obligation is about personal data and people's rights; a SOC 2 control is about
# the service's controls. Evidence for one is a strong pointer for the other, never proof on its own.

frameworks:
- gdpr
- soc2
mappings:
