# PROPOSED mappings between ISO/IEC 27001:2022 and SOC 2 (AICPA Trust Services Criteria) (engine default).
#
# Nothing here counts until a person reviews it: copy this file to mappings/ at the root of the client
# repository, check each line against ISO/IEC 27001 and the AICPA criteria and the client's actual controls,
# and fill reviewed_by and reviewed_on. Only reviewed `equivalent` mappings let one piece of evidence count
# for both records (cited as "<framework>:<id>", e.g. iso27001:EV-012). The rest are pointers.
# `subset`: the ISO 27001 requirement (first framework) is narrower than the SOC 2 criterion; `superset`: wider.
# Our own judgement; no text of either is reproduced. The AICPA publishes mappings of the criteria to
# other frameworks on aicpa-cima.com, which reviewers may find useful.

frameworks:
- iso27001
- soc2
mappings:
- iso27001: A.8.32
  soc2: CC8.1
  relationship: equivalent
  note: Both require changes to be authorized, tested, approved and recorded before release.
  reviewed_by: ''
  reviewed_on: null
- iso27001: A.8.7
  soc2: CC6.8
  relationship: subset
  note: ISO malware protection; CC6.8 also covers unauthorized software (ISO A.8.19).
  reviewed_by: ''
  reviewed_on: null
