# PROPOSED mappings between the HIPAA Security and Breach Notification Rules and SOC 2 (engine default).
#
# Nothing here counts until a person reviews it: copy this file to mappings/ at the root of the client
# repository, check each line against both frameworks and the client's actual controls, and fill reviewed_by
# and reviewed_on. Only reviewed `equivalent` mappings let one piece of evidence count for both records (cited
# as "<framework>:<id>"). The rest are pointers. `subset`: the HIPAA requirement (first framework) is narrower;
# `superset`: wider. Our own judgement; no standard's text is reproduced. NIST SP 800-66 Rev. 2 maps the
# Security Rule to NIST SP 800-53 and the Cybersecurity Framework, which reviewers may find useful.

