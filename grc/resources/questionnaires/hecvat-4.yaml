# HECVAT 4 (Higher Education Community Vendor Assessment Toolkit), published by EDUCAUSE.
#
# The engine does NOT ship the workbook or the question text: they are EDUCAUSE's. A client imports its own
# copy (`grc questionnaire import`), and the question text is read from that copy. This file holds only:
#   layout  - where the questions, answers and dropdowns are in the workbook
#   gates   - the "Start Here" questions that switch whole sections on or off
#   profile - general questions answered from questionnaires/profile.yaml (company facts)
#   questions - for each question id: our own short topic label, the kind of answer, and the framework
#               requirements whose controls are the evidence for answering it (our judgement, proposed:
#               the client's reviewer approves every answer before it leaves).
id: hecvat-4
title: HECVAT 4
publisher: EDUCAUSE
tested_versions: ["4.1.4"]
version_cell: {sheet: Auto Responses, cell: A36}
layout:
  answer_sheets: [START HERE, Organization, Product, Infrastructure, IT Accessibility, Case-Specific, AI, Privacy]
  id_column: A
  answer_column: C
  detail_column: D
  id_pattern: "^[A-Z]{4}-\\d{2}$"
  question_sheet: Questions
  question_columns: {id: A, text: B, guidance: O, compliant: U}
  date_cell: {sheet: START HERE, cell: C3}
gates:
  - {question: REQU-01, sheets: [Product, Infrastructure], label: "cloud-based product"}
  - {question: REQU-02, sheets: [IT Accessibility], label: "user interface"}
  - {question: REQU-03, prefixes: [CONS], label: "consulting services"}
  - {question: REQU-04, sheets: [AI], label: "AI features"}
  - {question: REQU-05, prefixes: [HIPA], label: "HIPAA data"}
  - {question: REQU-06, prefixes: [PCID], label: "payment card data"}
  - {question: REQU-07, prefixes: [OPEM], label: "on-premises components"}
  - {question: REQU-08, sheets: [Privacy], label: "personal or institutional data"}
# A gate answer the engine can propose from the program: Yes when the repository has a record for that
# framework. A person still approves it.
gate_hints:
  REQU-04: {record: iso42001, reason: "an ISO 42001 (AI management system) record is in this repository"}
  REQU-05: {record: hipaa, reason: "a HIPAA record is in this repository"}
