management_review:
  review_every_days: 365
  warn_before_stage1_days: 60
  inputs:
    - {id: previous_actions, title: "Status of actions from previous reviews"}
    - {id: changes, content: context_changes, title: "Significant changes, scope changes and new FedRAMP rules"}
    - {id: performance, content: performance, title: "Indicator measures, vulnerability timeframes met, reports delivered on time"}
    - {id: risks, content: risks_and_impacts, title: "Accepted vulnerabilities and SHOULD rules not followed"}
    - {id: suppliers, content: suppliers, title: "Third-party information resources and supply chain risk"}
    - {id: incidents, content: incidents, title: "Incidents and agency feedback"}
    - {id: resources, title: "Executive support and investment in security"}
    - {id: improvement, title: "Opportunities for improvement"}

hours:
  warn_at: 0.8
  forecast_weeks: 4
  max_per_person_day: 14
  phase_split: {validate: 0.15, governance: 0.2, implement: 0.3, test: 0.15, stage1: 0.15, stage2: 0.05}
  activities:
    - {id: project_management, title: "Project management and status reporting", keywords: [status, pm, planning, project management, weekly]}
    - {id: kickoff, title: "Kickoff and scoping", keywords: [kickoff, kick-off, scoping, scope, boundary, mas, inventory]}
    - {id: interviews, title: "Interviews and walkthroughs", keywords: [interview, walkthrough, workshop, meeting]}
    - {id: documentation, title: "Procedures and decision records", keywords: [policy, procedure, document, drafting, sdr, decision record]}
    - {id: automation, title: "Evidence automation", keywords: [automation, pipeline, collector, machine-readable, json, ksi]}
    - {id: evidence_review, title: "Evidence review and validation", keywords: [evidence, review, testing, sample, validation, request]}
    - {id: internal_audit, title: "Readiness review", keywords: [readiness review, internal audit, audit, workpaper]}
    - {id: management_review, title: "Leadership review", keywords: [management review, board, mr-]}
    - {id: remediation, title: "Remediation support", keywords: [remediation, gap, fix, corrective, vulnerability]}
    - {id: certification, title: "Independent assessment and certification", keywords: [assessment, assessor, 3pao, certification, package, fedramp]}
    - {id: other, title: "Other", keywords: []}
