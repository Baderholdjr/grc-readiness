# Framework playbook: reusable engagement content for FedRAMP 20x readiness.
# Engagement files may override any of these keys (see engagement/engagement.yaml).
#
# FedRAMP 20x certifies a cloud service offering against Key Security Indicators and FedRAMP's process rules,
# shown with machine-readable evidence and validated by a FedRAMP-recognized independent assessor. In the
# engagement record the two dates mean: dates.stage1 = the independent assessment; dates.stage2 = the
# FedRAMP certification decision (or the date the client means to apply, for a first package).
# Choose the class in scope.categories: class_a (pilot), class_b (Low), or class_b,class_c (Moderate).

title_suffix: FedRAMP 20x Readiness Brief
tldr_template: "Help {client} earn and keep a FedRAMP 20x certification: Key Security Indicators shown with automated evidence, FedRAMP's process rules in operation, and a certification package an assessor can validate."
usage_heading: Cloud Service Offering in Scope
requirements_heading: FedRAMP 20x Readiness Requirements

terms:
  goal: FedRAMP 20x certification
  audit_body: FedRAMP-recognized independent assessor
  focus: FedRAMP 20x readiness and continuous monitoring
  stage1: Independent assessment
  stage2: FedRAMP certification decision
  countdown: independent assessment is
  system: cloud service offering
  applicability_title: FedRAMP 20x Applicability Statement
  applicability_short: Applicability
  applicability_intro: "Every FedRAMP rule written as SHOULD and whether {client} follows it, with the reason and the resulting risk to customers when it doesn't; and the rules and indicators of other certification classes. Key Security Indicators and MUST rules for the class in scope are not optional and are not listed."
  # A list: the first id in the record's scope is used (Class A has only 7 of the indicators).
  internal_audit_ref: [KSI-SVC-EIS, FRC-CSO-MRA]
  corrective_ref: [KSI-SVC-EIS, FRC-CSO-MRA]
  review_ref: [KSI-PIY-RES, FRC-CSO-MRA]
  record_control_ref: KSI-CMT-LMC
  scope_ref: MAS-CSO-IIR
  objectives_ref: [KSI-PIY-RES, FRC-CSO-MRA]
  risk_ref: [KSI-SVC-EIS, FRC-CSO-MRA]
  review_required: "no"
  applicability_id_header: Rule

glossary:
  - term: FedRAMP 20x
    plain: "The US government's newer way to certify cloud services for federal agencies: the provider shows its security with automated, machine-readable evidence instead of long written plans."
    tech: "FedRAMP Consolidated Rules for 2026 (CR26), github.com/FedRAMP/rules. Required from 1 January 2027; Rev5 remains the path for Class D (High)."
  - term: Certification class
    plain: "How much is required. Class A is the pilot class; Class B is for Low-impact services; Class C is for Moderate-impact services and adds to Class B."
    tech: "Classes A to C are on the 20x path; Class D (High) is Rev5 only."
  - term: Key Security Indicator (KSI)
    plain: "A security outcome the provider must show, such as least-privilege access or tested recovery, with measures that show it is met, automated where practical."
    tech: "KSI-* ids, grouped in 10 themes, each mapped by FedRAMP to NIST SP 800-53 controls."
  - term: Persistently
    plain: "Done steadily over time, on a known cycle, with the status always known. Most indicators and rules ask for this."
    tech: "FRD definition. The cycle is documented and its evidence kept."
  - term: Minimum Assessment Scope (MAS)
    plain: "The boundary of the offering: everything that is assessed and certified. Anything outside it is a third-party resource."
    tech: "MAS-CSO-* rules."
  - term: Potential Agency Impact N-rating (PAIN)
    plain: "A rating from N1 to N5 of how badly a vulnerability or incident could affect the agencies using the service. It sets reporting and fix deadlines."
    tech: "VER-EVA-EPA, IEC-CSO-EFI; incidents default to N5 when not rated (IEC-CSO-DPR)."
  - term: Trust center
    plain: "The secure place where the provider shares its certification data with agencies and FedRAMP, for people and machines to read."
    tech: "CDS-* rules."
  - term: Ongoing Certification Report and Quarterly Review
    plain: "Regular reports to agency customers on the offering's security, and (Class C) a live meeting every three months to go through them."
    tech: "CCM-OCR-*, CCM-QTR-*."
  - term: Significant change
    plain: "A change likely to substantively affect the offering's security. It must be evaluated, and agencies told before and after."
    tech: "NIST SP 800-37 Rev. 2 definition; SCN-* rules."
  - term: Accepted vulnerability
    plain: "A vulnerability the provider won't fully fix, or hasn't fixed within FedRAMP's longest allowed time. It is reported as such."
    tech: "FRD definition; VER-RPT-AVI, VER-TFR-MAV."

evidence_test:
  - key: documented
    label: Documented
    question: Is there an explanation of how the indicator or rule is met (the measures, their objectives and their cycle)?
  - key: implemented
    label: Implemented
    question: Is it in place across the whole Minimum Assessment Scope?
  - key: evidenced
    label: Evidence exists
    question: Does {client} produce machine-readable evidence that it operates, automated where practical, on the stated cycle?
  - key: tested
    label: Tested
    question: Has it been verified and validated the way a FedRAMP-recognized assessor would (sampling documented)?

gap_callout: Treat client statements as hypotheses until machine-readable evidence shows the indicator or rule is explained, in place across the Minimum Assessment Scope, operating on its cycle, and validated.

working_rule: If an indicator or rule is described but you cannot trace it to an owner, a measure with a cycle, and evidence, treat it as unresolved and escalate it to the engagement lead.

readiness_criteria:
  - The Minimum Assessment Scope lists every information resource, information flow and third-party resource.
  - Every Key Security Indicator for the class has measures with a stated cycle and machine-readable evidence, automated where practical.
  - Vulnerabilities are detected, rated (PAIN) and remediated within FedRAMP's timeframes, and reported each month.
  - Incidents are evaluated for FedRAMP reportability and reported within the timeframes for their rating.
  - Significant changes are evaluated and notified; the FedRAMP security inbox is monitored.
  - The certification package is complete, current and shared through a trust center (Class B and C).

phases:
  - id: validate
    objective: "Class & scope"
    deliverables:
      - Kickoff and owner alignment
      - "Choose the certification class (A pilot, B Low, C Moderate) and confirm the 20x path suits the offering and its agency customers"
      - "Minimum Assessment Scope: information resources, flows, third-party resources"
      - Validate gap-analysis claims and evidence
  - id: governance
    objective: "Measures & procedures"
    deliverables:
      - "Measures and cycles for each Key Security Indicator, and how each is automated"
      - Vulnerability, incident, change and communication procedures written to FedRAMP's rules and timeframes
      - Security decision records for SHOULD rules not followed
  - id: implement
    objective: "Automate & evidence"
    deliverables:
      - "Machine-readable evidence pipeline for indicators and rules"
      - Trust center, availability reporting and security inbox in operation (Class B and C)
      - Monthly vulnerability reporting and Ongoing Certification Reports started
  - id: test
    objective: "Test"
    deliverables:
      - Validate each indicator's measures and each rule against its evidence
      - Test an incident report and a significant change notification end to end
      - Internal readiness review and corrective actions
  - id: stage1
    objective: "Independent assessment"
    deliverables:
      - Support the FedRAMP-recognized assessor's verification and validation
      - Assemble the certification package with the assessment results
  - id: stage2
    objective: "Certification"
    deliverables:
      - Apply for FedRAMP certification and answer FedRAMP's questions
      - Hand over continuous monitoring (reports, quarterly reviews, annual assessment)

needs:
  - Maintain the control matrix, scope inventory, evidence index, gap register, owner, due date, and status.
  - Review submitted evidence against the four-part evidence test across the Minimum Assessment Scope.
  - Draft and revise procedures and security decision records for lead review - do not invent measures or results.
  - Track recurring obligations (monthly vulnerability reports, Ongoing Certification Reports, quarterly reviews, annual assessment).
  - Flag decisions that need a senior official (SHOULD rules not followed, accepted risks) and questions for FedRAMP.

default_guardrails:
  - "{client} owns its offering, its measures and its evidence; our team structures, reviews, tests, and challenges."
  - We are not the independent assessor and do not certify. FedRAMP makes the certification decision.
  - No federal customer data, secrets or vulnerability details beyond what the work needs in this repository. Evidence is pointed to where it lives.
  - Escalate unsupported claims, unclear scope and SHOULD rules not followed to the engagement lead.

default_risks:
  - Measures that exist on paper but have no automated, machine-readable evidence on a known cycle.
  - A Minimum Assessment Scope that leaves out supporting services or third-party resources.
  - Vulnerability and incident timeframes missed because ratings (PAIN) aren't assigned promptly.
  - Rules that change between consolidated releases; the catalog must be regenerated from FedRAMP's dataset.

impact_assessment:
  required_for_kinds: []

# Policy and procedure library (`grc docs new`). Every requirement is covered by exactly one document. A document
# is needed when any requirement it covers is in scope, so a Class A record skips documents it has no requirement in.
documents:
  review_every_days: 365
  library:
    - {id: DOC-FR-PACKAGE, title: "FedRAMP Certification Package Plan", kind: plan, template: package.md,
       satisfies: [FRC-CSO-FCP, FRC-CSO-PKG, FRC-CSO-JSN, FRC-CSO-MRA, FRC-CSO-POP, FRC-CLA-ASF, FRC-CLA-EAM, FRC-CLA-MFR, FRC-CLA-RFR,
                   FRC-APP-MLF, FRC-APP-AFC, FRC-APP-FCP, FRC-APP-FIA, FRC-APP-NTP, FRC-CSX-VVK, FRC-CSX-VVR, FRC-CSX-MAS,
                   CPO-CSO-OVR, CPO-CSO-MTD, CPO-CSO-OSA, CPO-CSX-CPM, SDR-CSO-FRR, SDR-CSO-MTD, SDR-CSX-KSI, SDR-CSX-KMT,
                   IVV-CSO-FIA, IVV-CSO-SEI, IVV-CSO-SEE, IVV-CSO-ICP, IVV-CSO-DUS, IVV-CSO-STE, IVV-CSX-AIA],
       sections: [Purpose, Certification class and path, The certification package, Security decision records, Independent assessment, Automated validation, Applying and maintaining, Review]}
    - {id: DOC-FR-SCOPE, title: "Minimum Assessment Scope", kind: record, template: scope.md,
       satisfies: [MAS-CSO-IIR, MAS-CSO-FLO, MAS-CSO-TPR, MAS-CSO-MDI],
       sections: [Purpose, Information resources, Information flows and security categories, Third-party information resources, Metadata, Review]}
    - {id: DOC-FR-COMMS, title: "FedRAMP Communications Procedure", kind: procedure, template: communications.md,
       satisfies: [AFC-CSO-INB, AFC-CSO-NOC, AFC-CSO-TFG, AFC-CSO-RCV, AFC-CSO-CRA, AFC-CSO-EMR, AFC-CSO-IMA, AFC-CSO-ACK],
       sections: [Purpose, FedRAMP security inbox, Receiving messages, Emergency and important messages, Required actions, Review]}
    - {id: DOC-FR-TRUST, title: "Trust Center and Certification Data Sharing Procedure", kind: procedure, template: trust-center.md,
       satisfies: [CDS-CSO-PUB, CDS-CSO-SVC, CDS-CSO-FID, CDS-CSO-FRC, CDS-CSO-AVR, CDS-CSO-UTC, CDS-CSO-CBF, CDS-CSO-RIS, CDS-CSO-IRP,
                   CDS-CSO-HAD, CDS-TRC-USH, CDS-TRC-PAC, CDS-TRC-AAI, CDS-TRC-ACL, CDS-TRC-HMR, CDS-TRC-SSM, CDS-UTC-AAD, CDS-UTC-AGA],
