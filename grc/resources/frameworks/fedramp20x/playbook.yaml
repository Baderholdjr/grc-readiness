       satisfies: [CCM-OCR-AVL, CCM-OCR-NRD, CCM-OCR-FBM, CCM-OCR-AFS, CCM-OCR-LSI, CCM-OCR-SOR, CCM-QTR-MTG, CCM-QTR-REG, CCM-QTR-NRD,
                   CCM-QTR-NID, CCM-QTR-SAR, CCM-QTR-ACT, CCM-QTR-RTR, CCM-QTR-RTP],
       sections: [Purpose, Ongoing Certification Reports, Agency feedback, Quarterly Reviews, Sensitive information, Review]}
