requirements:
- id: AFC-CSO-INB
  kind: rule
  category: core
  group: AFC
  title: Maintain a FedRAMP Security Inbox
  intent: Providers MUST establish and maintain an email address to receive messages from FedRAMP; this inbox is a FedRAMP Security
    Inbox (FSI).
  evidence_examples:
  - Email address to receive messages from FedRAMP
  nist80053:
  - SI-5
- id: AFC-CSO-NOC
  kind: rule
  category: class_b
  group: AFC
  title: Notification of Changes
  intent: Providers MUST immediately notify FedRAMP of any changes to the email address for their FedRAMP Security Inbox.
  evidence_examples:
  - Process, manual or automated, to notify FedRAMP of changes in the FedRAMP Security Inbox
- id: AFC-CSO-TFG
  kind: rule
  category: class_b
  group: AFC
  title: Trust @fedramp.gov and @gsa.gov
  intent: Providers MUST treat any email originating from an @fedramp.gov or @gsa.gov email address as if it was sent from FedRAMP by
    default; if such a message is confirmed to originate from someone other than FedRAMP then the FedRAMP Security Inbox rules no longer
    apply.
  evidence_examples:
  - Configuration settings for FSI mailbox
  - Automated validation to check FSI mailbox configuration
- id: AFC-CSO-RCV
  kind: rule
  category: core
  group: AFC
  title: Receive Email Without Disruption
  intent: 'Providers MUST receive and react to email messages from FedRAMP without disruption and without requiring additional actions
    from FedRAMP. Note: This requirement is intended to prevent cloud service providers from requiring FedRAMP to complete a CAPTCHA,
    log into a customer portal, or otherwise take service-specific actions that might prevent the security team from receiving the message.'
  evidence_examples:
  - Explanation of how the rule is followed, or an explanation of the reason and resulting risk to customers for not following the rule.
  - Verification that the implementation is appropriate for the rule, or that the reason for not implementing is accepted by a senior
    official.
  - Validation that the implementation is in place and working as intended, or that the reason for not implementing is accepted by a
    senior official.
  - Independent verification.
  - Independent validation.
- id: AFC-CSO-CRA
  kind: rule
  category: core
  group: AFC
  title: Complete Required Actions
  intent: 'Providers MUST complete the required actions in Emergency or Emergency Test designated messages sent by FedRAMP within the
    timeframe included in the message. Note: Timeframes may vary by FedRAMP Certification class.'
  evidence_examples:
  - Explanation of how the rule is followed, or an explanation of the reason and resulting risk to customers for not following the rule.
  - Verification that the implementation is appropriate for the rule, or that the reason for not implementing is accepted by a senior
    official.
  - Validation that the implementation is in place and working as intended, or that the reason for not implementing is accepted by a
    senior official.
  - Independent verification.
  - Independent validation.
- id: AFC-CSO-EMR
  kind: rule
  category: class_b
  group: AFC
  title: Emergency Message Routing
  intent: 'Providers MUST route Emergency designated messages sent by FedRAMP to a senior security official for their awareness. Note:
    Senior security officials are determined by the provider.'
  evidence_examples:
  - Configuration settings for FSI mailbox
  - Automated validation to check FSI mailbox configuration
- id: AFC-CSO-IMA
  kind: recommendation
  category: class_b
  group: AFC
  title: Important Message Actions
  intent: 'Providers SHOULD complete the required actions in Important designated messages sent by FedRAMP within the timeframe specified
    in the message. Note: Timeframes may vary by FedRAMP Certification class.'
  evidence_examples:
  - Explanation of how the rule is followed, or an explanation of the reason and resulting risk to customers for not following the rule.
  - Verification that the implementation is appropriate for the rule, or that the reason for not implementing is accepted by a senior
    official.
  - Validation that the implementation is in place and working as intended, or that the reason for not implementing is accepted by a
    senior official.
  - Independent verification.
  - Independent validation.
- id: AFC-CSO-ACK
  kind: recommendation
  category: class_b
  group: AFC
  title: Acknowledge Receipt
  intent: Providers SHOULD promptly and automatically acknowledge the receipt of messages received from FedRAMP in their FedRAMP Security
    Inbox.
  evidence_examples:
  - Explanation of how the rule is followed, or an explanation of the reason and resulting risk to customers for not following the rule.
  - Verification that the implementation is appropriate for the rule, or that the reason for not implementing is accepted by a senior
    official.
  - Validation that the implementation is in place and working as intended, or that the reason for not implementing is accepted by a
    senior official.
  - Independent verification.
  - Independent validation.
- id: CCM-OCR-AVL
  kind: rule
  category: core
  group: CCM
  title: Report Availability
  intent: 'Providers MUST supply an Ongoing Certification Report to all necessary parties every 3 months, covering the entire period
    since the previous summary, in a consistent format that is human readable; this report MUST include high-level summaries of at least
    the following information (if applicable): Changes to FedRAMP Certification Data; Planned changes to FedRAMP Certification Data
    during at least the next 3 months; Accepted vulnerabilities; Transformative changes; Updated recommendations or best practices for
    security, configuration, usage, or similar aspects of the cloud service offering; A list of all agencies that are directly using
    the product; FedRAMP Reportable Incidents or an attestation that no such incidents occurred; Lessons learned and changes planned
    or made as a result of FedRAMP Reportable Incidents (if such occurred).'
  evidence_examples:
  - Most recent Ongoing Certification Report. If the report is not available, the provider MUST provide a sample report that includes
    all required information.
  - How the report will be delivered
  - 'In FedRAMP''s format: FedRAMP Ongoing Certification Report (CCM-OCR-AVL) (https://fedramp.gov/schemas/fedramp-ongoing-certification-report-schema-2026-06-24.json)'
  nist80053:
  - CA-7
- id: CCM-OCR-NRD
  kind: rule
  category: core
  group: CCM
  title: Next Report Date
  intent: Providers MUST supply the target date for their next Ongoing Certification Report with other public FedRAMP Certification
    Data.
  evidence_examples:
  - Explanation of how the rule is followed, or an explanation of the reason and resulting risk to customers for not following the rule.
  - Verification that the implementation is appropriate for the rule, or that the reason for not implementing is accepted by a senior
    official.
  - Validation that the implementation is in place and working as intended, or that the reason for not implementing is accepted by a
    senior official.
  - Independent verification.
  - Independent validation.
- id: CCM-OCR-FBM
  kind: rule
  category: class_b
  group: CCM
  title: Feedback Mechanism
  intent: 'Providers MUST supply an asynchronous mechanism for all necessary parties to provide feedback or ask questions about each
    Ongoing Certification Report. Note: This could be email by default but providers are encouraged to consider something more interactive
    as appropriate.'
  evidence_examples:
  - How to access the feedback mechanism.
- id: CCM-OCR-AFS
  kind: rule
  category: class_b
  group: CCM
  title: Anonymized Feedback Summary
  intent: 'Providers MUST supply an anonymized and desensitized summary of the feedback, questions, and answers about each Ongoing Certification
    Report as an addendum to the Ongoing Certification Report OR in the next Ongoing Certification Report. Note: This is intended to
    encourage sharing of information and decrease the burden on the cloud service provider - providing this summary will reduce duplicate
    questions from agencies and ensure FedRAMP has access to this information. It is generally in the provider''s interest to update
    this addendum frequently throughout the quarter.'
  evidence_examples:
  - How the summary will be delivered
- id: CCM-OCR-LSI
  kind: rule
  category: class_b
  group: CCM
  title: Limit Sensitive Information
  intent: Providers MUST NOT irresponsibly disclose sensitive information in an Ongoing Certification Report that would likely have
    an adverse effect on the cloud service offering.
  evidence_examples:
  - Explanation of how the rule is followed, or an explanation of the reason and resulting risk to customers for not following the rule.
  - Verification that the implementation is appropriate for the rule, or that the reason for not implementing is accepted by a senior
    official.
  - Validation that the implementation is in place and working as intended, or that the reason for not implementing is accepted by a
    senior official.
  - Independent verification.
  - Independent validation.
- id: CCM-OCR-SOR
  kind: recommendation
  category: class_b
  group: CCM
  title: Spread Out Reports
  intent: 'Providers SHOULD establish a regular 3 month cycle for Ongoing Certification Reports that is spread out from the beginning,
    middle, or end of each quarter. Note: This recommendation is intended to discourage hundreds of cloud service providers from releasing
    their Ongoing Certification Reports during the first or last week of each quarter because that is the easiest way for a single provider
    to track this deliverable; the result would overwhelm agencies with many cloud services. Widely used cloud service providers are
    encouraged to work with their customers to identify ideal timeframes for this cycle.'
  evidence_examples:
  - Explanation of how the rule is followed, or an explanation of the reason and resulting risk to customers for not following the rule.
  - Verification that the implementation is appropriate for the rule, or that the reason for not implementing is accepted by a senior
    official.
  - Validation that the implementation is in place and working as intended, or that the reason for not implementing is accepted by a
    senior official.
  - Independent verification.
  - Independent validation.
- id: CCM-QTR-MTG
  kind: rule
  mandatory_in:
  - class_c
  kind_otherwise: recommendation
  category: class_b
  group: CCM
  title: Quarterly Review Meeting
  intent: 'Class B: Providers SHOULD host a synchronous Quarterly Review every 3 months, open to all necessary parties, to review aspects
    of the most recent Ongoing Certification Reports that the provider determines are of the most relevance to agencies. Class C: Providers
    MUST host a synchronous Quarterly Review every 3 months, open to all necessary parties, to review aspects of the most recent Ongoing
    Certification Reports that the provider determines are of the most relevance to agencies.'
  evidence_examples:
  - Selected ordinal recurrence for the Ongoing Certification Report cycle if applicable OR explanation for why Ongoing Certification
    Reports are not being delivered.
  - Selected ordinal recurrence for the Ongoing Certification Report cycle.
  nist80053:
  - CA-7
- id: CCM-QTR-REG
  kind: rule
  category: class_b
  group: CCM
  title: Meeting Registration Info
  intent: Providers MUST supply either a registration link or a downloadable calendar file with meeting information for Quarterly Reviews
    to all necessary parties.
  evidence_examples:
  - URL to the registration page or calendar file.
- id: CCM-QTR-NRD
  kind: rule
  category: class_b
  group: CCM
  title: Next Review Date
  intent: Providers MUST publicly supply the target date for their next Quarterly Review with other public FedRAMP Certification Data.
  evidence_examples:
  - Explanation of how the rule is followed, or an explanation of the reason and resulting risk to customers for not following the rule.
  - Verification that the implementation is appropriate for the rule, or that the reason for not implementing is accepted by a senior
    official.
  - Validation that the implementation is in place and working as intended, or that the reason for not implementing is accepted by a
    senior official.
  - Independent verification.
  - Independent validation.
- id: CCM-QTR-NID
  kind: rule
  category: class_b
  group: CCM
  title: No Irresponsible Disclosure
  intent: Providers MUST NOT irresponsibly disclose sensitive information in a Quarterly Review that would likely have an adverse effect
    on the cloud service offering.
  evidence_examples:
  - Explanation of how the rule is followed, or an explanation of the reason and resulting risk to customers for not following the rule.
  - Verification that the implementation is appropriate for the rule, or that the reason for not implementing is accepted by a senior
    official.
  - Validation that the implementation is in place and working as intended, or that the reason for not implementing is accepted by a
    senior official.
  - Independent verification.
  - Independent validation.
- id: CCM-QTR-SAR
  kind: recommendation
  category: class_b
  group: CCM
  title: Schedule Around Reports
  intent: Providers SHOULD regularly schedule Quarterly Reviews to occur at least 3 business days after releasing an Ongoing Certification
    Report AND within 10 business days of such release.
  evidence_examples:
  - Explanation of how the rule is followed, or an explanation of the reason and resulting risk to customers for not following the rule.
  - Verification that the implementation is appropriate for the rule, or that the reason for not implementing is accepted by a senior
    official.
  - Validation that the implementation is in place and working as intended, or that the reason for not implementing is accepted by a
    senior official.
  - Independent verification.
  - Independent validation.
- id: CCM-QTR-ACT
  kind: recommendation
  category: class_b
  group: CCM
  title: Additional Content
  intent: Providers SHOULD supply additional information in Quarterly Reviews that the provider determines is of interest, use, or otherwise
    relevant to agencies.
  evidence_examples:
  - Explanation of how the rule is followed, or an explanation of the reason and resulting risk to customers for not following the rule.
  - Verification that the implementation is appropriate for the rule, or that the reason for not implementing is accepted by a senior
    official.
  - Validation that the implementation is in place and working as intended, or that the reason for not implementing is accepted by a
    senior official.
  - Independent verification.
  - Independent validation.
  nist80053:
  - CA-7
- id: CCM-QTR-RTR
  kind: recommendation
  category: class_b
  group: CCM
  title: Record/Transcribe Reviews
  intent: Providers SHOULD record or transcribe Quarterly Reviews and supply them to all necessary parties.
  evidence_examples:
  - Explanation of how the rule is followed, or an explanation of the reason and resulting risk to customers for not following the rule.
  - Verification that the implementation is appropriate for the rule, or that the reason for not implementing is accepted by a senior
    official.
  - Validation that the implementation is in place and working as intended, or that the reason for not implementing is accepted by a
    senior official.
  - Independent verification.
  - Independent validation.
- id: CCM-QTR-RTP
  kind: recommendation
  category: class_b
  group: CCM
  title: Restrict Third Parties
  intent: 'Providers SHOULD NOT invite third parties to attend Quarterly Reviews intended for agencies unless they have specific relevance.
    Note: This is because agencies are less likely to actively participate in meetings with third parties; the cloud service provider''s
    independent assessor should be considered relevant by default.'
  evidence_examples:
  - Explanation of how the rule is followed, or an explanation of the reason and resulting risk to customers for not following the rule.
  - Verification that the implementation is appropriate for the rule, or that the reason for not implementing is accepted by a senior
    official.
  - Validation that the implementation is in place and working as intended, or that the reason for not implementing is accepted by a
    senior official.
  - Independent verification.
  - Independent validation.
- id: CDS-CSO-PUB
  kind: rule
  category: core
  group: CDS
  title: Public Information
  intent: 'Providers MUST publicly share up-to-date information about the cloud service offering in both human-readable and JSON formats,
    including at least the following information that is available and applicable: FedRAMP ID; Service Model; Deployment Model; Business
    Category; UEI Number; Sales Contact Information; Security Contact Information; Product Website Link; Link to Product Logo (must
    be a valid image link, properly named, that will display in a browser without processing - transparent PNG preferred); Overall Service
    Description; Detailed list of specific services and their security categories (see CDS-CSO-SVC (Public Service List) (Service List));
    Link to Secure Configuration Guidance; Overview of documentation supplied by the provider for the cloud service offering; Link to
    Trust Center landing page that includes instructions on accessing information in the trust center; Next Ongoing Certification Report
    date (see CCM-OCR-NRD (Next Report Date)); Current FedRAMP Recognized independent assessment service.'
  evidence_examples:
  - URL to the human-readable data.
  - URL to the machine-readable data.
  - 'In FedRAMP''s format: FedRAMP Certification Package Overview (FRC-CSO-PKG) (https://fedramp.gov/schemas/fedramp-certification-package-overview-schema-2026-06-24.json)'
- id: CDS-CSO-SVC
  kind: rule
  category: class_b
  group: CDS
  title: Public Service List
  intent: Providers MUST publicly share a detailed list of specific services and their security categories that are included in the
    cloud service offering using clear feature or service names that align with standard public marketing materials; this list MUST
    be complete enough for a potential customer to determine which services are and are not included in the FedRAMP Minimum Assessment
    Scope without requesting access to underlying FedRAMP Certification Data.
  evidence_examples:
  - URL to the human-readable data.
  - URL to the machine-readable data (if applicable).
  - 'In FedRAMP''s format: FedRAMP Certification Package Overview (FRC-CSO-PKG) (https://fedramp.gov/schemas/fedramp-certification-package-overview-schema-2026-06-24.json)'
- id: CDS-CSO-FID
  kind: rule
  category: class_b
  group: CDS
  title: Always Include FedRAMP ID
  intent: Providers MUST always include the FedRAMP ID of the related cloud service offering in all FedRAMP Certification Data once
    assigned, including all reports, notifications, and other communication that results from FedRAMP rules.
  evidence_examples:
  - Explanation of how the rule is followed, or an explanation of the reason and resulting risk to customers for not following the rule.
  - Verification that the implementation is appropriate for the rule, or that the reason for not implementing is accepted by a senior
    official.
  - Validation that the implementation is in place and working as intended, or that the reason for not implementing is accepted by a
    senior official.
  - Independent verification.
  - Independent validation.
- id: CDS-CSO-FRC
  kind: rule
  category: class_b
  group: CDS
  title: FedRAMP Certification Reports
  intent: 'Providers MUST include FedRAMP Certification Reports with their FedRAMP Certification Data without inappropriate modifications,
    and make such reports available within 2 weeks of receiving the materials from FedRAMP. Note: FedRAMP provides Certification Reports
    for all cloud service offerings following the Program Certification path as part of the initial and ongoing FedRAMP Certification
    process, and may provide Certification Reports for cloud service offerings following the Agency Certification path.'
  evidence_examples:
  - Explanation of how the rule is followed, or an explanation of the reason and resulting risk to customers for not following the rule.
  - Verification that the implementation is appropriate for the rule, or that the reason for not implementing is accepted by a senior
    official.
  - Validation that the implementation is in place and working as intended, or that the reason for not implementing is accepted by a
    senior official.
  - Independent verification.
  - Independent validation.
- id: CDS-CSO-AVR
  kind: rule
  mandatory_in:
  - class_b
  kind_otherwise: recommendation
  category: core
  group: CDS
  title: Availability Reporting
  intent: 'Class A: Providers SHOULD maintain a web service, available to all necessary parties, that indicates current and historical
    availability of core services within the cloud service offering over at least the past 30 days, including availability incidents,
    in both human-readable and machine-readable formats; this service SHOULD be available even if the primary cloud service offering
    is unavailable. Note: This service may be separate from the trust center. Classes B and C: Providers MUST maintain a web service,
    available to all necessary parties, that indicates current and historical availability of core services within the cloud service
    offering over at least the past 30 days, including availability incidents, in both human-readable and machine-readable formats;
    this service MUST be available even if the primary cloud service offering is unavailable. Note: This service may be separate from
    the trust center.'
  evidence_examples:
  - Explanation of how the rule is followed, or an explanation of the reason and resulting risk to customers for not following the rule.
  - Verification that the implementation is appropriate for the rule, or that the reason for not implementing is accepted by a senior
    official.
  - Validation that the implementation is in place and working as intended, or that the reason for not implementing is accepted by a
    senior official.
  - Independent verification.
  - Independent validation.
- id: CDS-CSO-UTC
  kind: rule
  category: core
  group: CDS
  title: Use Trust Centers
  intent: 'Providers MUST use a FedRAMP-compatible trust center to store and share FedRAMP Certification Data with all necessary parties.
    Note: Rules for FedRAMP-Compatible Trust Centers are explained in the Certification Data Sharing Rules under the FedRAMP-Compatible
    Trust Centers section (id: CDS-TRC).'
  evidence_examples:
  - Explanation of how the rule is followed, or an explanation of the reason and resulting risk to customers for not following the rule.
  - Verification that the implementation is appropriate for the rule, or that the reason for not implementing is accepted by a senior
    official.
  - Validation that the implementation is in place and working as intended, or that the reason for not implementing is accepted by a
    senior official.
  - Independent verification.
  - Independent validation.
  - 'In FedRAMP''s format: FedRAMP Certification Package Overview (FRC-CSO-PKG) (https://fedramp.gov/schemas/fedramp-certification-package-overview-schema-2026-06-24.json)'
- id: CDS-CSO-CBF
  kind: rule
  category: class_b
  group: CDS
  title: Consistency Between Formats
  intent: Providers MUST use automation to ensure information remains consistent between human-readable and machine-readable formats
    when FedRAMP Certification Data is provided in both formats.
  evidence_examples:
  - Explanation of how the rule is followed, or an explanation of the reason and resulting risk to customers for not following the rule.
  - Verification that the implementation is appropriate for the rule, or that the reason for not implementing is accepted by a senior
    official.
  - Validation that the implementation is in place and working as intended, or that the reason for not implementing is accepted by a
    senior official.
  - Independent verification.
  - Independent validation.
- id: CDS-CSO-RIS
  kind: rule
  category: class_b
  group: CDS
  title: Responsible Information Sharing
  intent: 'Providers MUST provide sufficient information in FedRAMP Certification Data to support agency authorization decisions but
    SHOULD NOT include sensitive information that would likely enable a threat actor to gain unauthorized access, cause harm, disrupt
    operations, or otherwise have a negative adverse impact on the cloud service offering. Note: This is not a license to exclude accurate
    risk information, but specifics that would likely lead to compromise should be abstracted. A breach of confidentiality with FedRAMP
    Certification Data should be anticipated by a secure cloud service provider.'
  evidence_examples:
  - Explanation of how the rule is followed, or an explanation of the reason and resulting risk to customers for not following the rule.
  - Verification that the implementation is appropriate for the rule, or that the reason for not implementing is accepted by a senior
    official.
  - Validation that the implementation is in place and working as intended, or that the reason for not implementing is accepted by a
    senior official.
  - Independent verification.
  - Independent validation.
- id: CDS-CSO-IRP
  kind: rule
  category: class_b
  group: CDS
  title: Include Relevant Policies
  intent: 'Providers MUST supply all relevant policies and procedures in the FedRAMP Certification Data, including a human-readable
    and machine-readable reference that explains at least the following about each included policy and procedure: Name of policy or
    procedure; Name of file, document, web page, etc; Brief summary of policy or procedure; Word count of document; Current version;
    Date of last update; Related FedRAMP Practices (if applicable).'
  evidence_examples:
  - Explanation of how to access this information.
- id: CDS-CSO-HAD
  kind: rule
  category: class_b
  group: CDS
  title: Historical FedRAMP Certification Data
  intent: 'Providers MUST supply snapshots of FedRAMP Certification Data aligned to Ongoing Certification Reports to all necessary parties;
    these snapshots MUST be available for the duration of FedRAMP Certification. Note: Historical snapshots do not need to be reconstructed
    for periods before the provider''s first Ongoing Certification Report, but should be maintained for all subsequent Ongoing Certification
    Reports.'
  evidence_examples:
  - Explanation of how to access this information.
- id: CDS-TRC-USH
  kind: rule
  category: class_b
  group: CDS
