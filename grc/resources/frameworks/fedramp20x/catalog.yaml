- id: VER-EVA-GRV
  kind: recommendation
  category: class_b
  group: VER
  title: Group Vulnerabilities
  intent: Providers SHOULD evaluate detected vulnerabilities, considering the context of the cloud service offering, to identify logical
    groupings of affected information resources that may improve the efficiency and effectiveness of vulnerability response by consolidating
    further activity; FedRAMP Vulnerability Detection and Response rules are then applied to these consolidated groupings of vulnerabilities
    instead of each individual detected instance.
  evidence_examples:
  - Explanation of how the rule is followed, or an explanation of the reason and resulting risk to customers for not following the rule.
  - Verification that the implementation is appropriate for the rule, or that the reason for not implementing is accepted by a senior
    official.
