  - Verification that the implementation is appropriate for the rule, or that the reason for not implementing is accepted by a senior
    official.
  - Validation that the implementation is in place and working as intended, or that the reason for not implementing is accepted by a
    senior official.
  - Independent verification.
  - Independent validation.
- id: IEC-CSO-EFR
  kind: rule
  category: core
  group: IEC
  title: Evaluate FedRAMP Reportability
  intent: Providers MUST promptly evaluate incidents to determine if they affect confidentiality or integrity of federal customer data
    or are likely to affect confidentiality or integrity of federal customer data; such incidents are FedRAMP Reportable Incidents and
    must be reported following the FedRAMP Incident Evaluation and Communication rules.
  evidence_examples:
  - An incident log showing an example of one or more incidents being evaluated including the reason for the determination. The log
    can be from real incidents, simulated incidents, or a combination of sources.
  nist80053:
  - AU-5(2)
  - IR-4(11)
- id: IEC-CSO-DPR
  kind: rule
  category: class_b
  group: IEC
  title: Default PAIN Rating
  intent: Providers MUST treat FedRAMP Reportable Incidents as if they have a Potential Agency Impact N-rating (PAIN) of 5 UNLESS they
    promptly estimate the PAIN rating following the rule in IEC-CSO-EFI (Estimate Federal Impact).
  evidence_examples:
  - Explanation of how the rule is followed, or an explanation of the reason and resulting risk to customers for not following the rule.
  - Verification that the implementation is appropriate for the rule, or that the reason for not implementing is accepted by a senior
    official.
  - Validation that the implementation is in place and working as intended, or that the reason for not implementing is accepted by a
    senior official.
  - Independent verification.
  - Independent validation.
- id: IEC-CSO-IIR
  kind: rule
  mandatory_in:
  - class_b
  kind_otherwise: recommendation
  category: core
  group: IEC
  title: Initial Incident Report
  intent: 'Class A: Providers SHOULD responsibly notify all affected parties after identifying FedRAMP Reportable Incidents by providing
    an Initial Incident Report with as much of the following information that is available at the time of reporting and/or the current
    relevant status for each item: Contact information for the federal incident response coordinator; Provider''s internally assigned
    tracking identifier; Description of the incident; Timeline of the incident, including start time, time and source of detection,
    time of completed FedRAMP Reportable Incident evaluation, and other major incident milestones determined by the provider; Historically
    and currently estimated Potential Agency Impact N-rating (PAIN) of the incident, including an explanation of the evaluation following
    the requirements in IEC-CSO-EFI (Estimate Federal Impact) (if applicable); Functional impact to federal agency customers (include
    impact to confidentiality and/or integrity and the impacted federal customer data types); Estimated recovery plan, milestones, and
    timelines; List of likely affected customer agencies. Timeframes by Potential Agency Impact rating: N1: 1 business day; N2: 1 business
    day; N3: 6 hours; N4: 6 hours; N5: 6 hours. Class B: Providers MUST responsibly notify all affected parties after identifying FedRAMP
    Reportable Incidents by providing an Initial Incident Report with as much of the following information that is available at the
    time of reporting and/or the current relevant status for each item: Contact information for the federal incident response coordinator;
    Provider''s internally assigned tracking identifier; Description of the incident; Timeline of the incident, including start time,
    time and source of detection, time of completed FedRAMP Reportable Incident evaluation, and other major incident milestones determined
    by the provider; Historically and currently estimated Potential Agency Impact N-rating (PAIN) of the incident, including an explanation
    of the evaluation following the requirements in IEC-CSO-EFI (Estimate Federal Impact) (if applicable); Functional impact to federal
    agency customers (include impact to confidentiality and/or integrity and the impacted federal customer data types); Estimated recovery
    plan, milestones, and timelines; List of likely affected customer agencies. Timeframes by Potential Agency Impact rating: N1: 1
    business day; N2: 1 business day; N3: 6 hours; N4: 6 hours; N5: 6 hours. Class C: Providers MUST responsibly notify all affected
    parties after identifying FedRAMP Reportable Incidents by providing an Initial Incident Report with as much of the following information
    that is available at the time of reporting and/or the current relevant status for each item: Contact information for the federal
    incident response coordinator; Provider''s internally assigned tracking identifier; Description of the incident; Timeline of the
    incident, including start time, time and source of detection, time of completed FedRAMP Reportable Incident evaluation, and other
    major incident milestones determined by the provider; Historically and currently estimated Potential Agency Impact N-rating (PAIN)
    of the incident, including an explanation of the evaluation following the requirements in IEC-CSO-EFI (Estimate Federal Impact)
    (if applicable); Functional impact to federal agency customers (include impact to confidentiality and/or integrity and the impacted
    federal customer data types); Estimated recovery plan, milestones, and timelines; List of likely affected customer agencies. Timeframes
    by Potential Agency Impact rating: N1: 1 business day; N2: 24 hours; N3: 1 hour; N4: 1 hour; N5: 1 hour.'
  evidence_examples:
  - An Initial Incident Report for one or more incidents. The report can be from real incidents, simulated incidents, or a combination
    of sources.
  - 'In FedRAMP''s format: FedRAMP Incident Report (IEC-CSO-IIR / IEC-CSO-OIR / IEC-CSO-FIR) (https://fedramp.gov/schemas/fedramp-incident-report-schema-2026-06-24.json)'
  nist80053:
  - AU-5(2)
  - IR-5
- id: IEC-CSO-OIR
  kind: rule
  mandatory_in:
  - class_b
  kind_otherwise: recommendation
  category: core
  group: IEC
  title: Ongoing Incident Reports
  intent: 'Class A: Providers SHOULD responsibly notify all affected parties of ongoing activity as new information becomes available
    during incident response for FedRAMP Reportable Incidents, including updates (or lack of updates) to all previously reported information
    and as much of the following additional information that is available and/or the current relevant status for each item: Observed
    incident activity; Indicators of compromise; Related Common Vulnerabilities and Exposures (CVE) identifier (if applicable); Root
    cause; Response and recovery activities. Timeframe at every Potential Agency Impact rating: 1 business day. Class B: Providers MUST
    responsibly notify all affected parties of ongoing activity as new information becomes available during incident response for FedRAMP
    Reportable Incidents, including updates (or lack of updates) to all previously reported information and as much of the following
    additional information that is available and/or the current relevant status for each item: Observed incident activity; Indicators
    of compromise; Related Common Vulnerabilities and Exposures (CVE) identifier, if applicable; Root cause; Response and recovery activities.
    Timeframe at every Potential Agency Impact rating: 1 business day. Class C: Providers MUST responsibly notify all affected parties
    of ongoing activity as new information becomes available during incident response for FedRAMP Reportable Incidents, including updates
    (or lack of updates) to all previously reported information and as much of the following additional information that is available
    and/or the current relevant status for each item: Observed incident activity; Indicators of compromise; Related Common Vulnerabilities
    and Exposures (CVE) identifier, if applicable; Root cause; Response and recovery activities. Timeframes by Potential Agency Impact
    rating: N1: 1 business day; N2: 24 hours; N3: 6 hours; N4: 6 hours; N5: 6 hours.'
  evidence_examples:
  - An Ongoing Incident Report for one or more incidents. The report can be from real incidents, simulated incidents, or a combination
    of sources.
  - 'In FedRAMP''s format: FedRAMP Incident Report (IEC-CSO-IIR / IEC-CSO-OIR / IEC-CSO-FIR) (https://fedramp.gov/schemas/fedramp-incident-report-schema-2026-06-24.json)'
  nist80053:
  - IR-5
- id: IEC-CSO-FIR
  kind: rule
  category: core
  group: IEC
  title: Final Incident Report
  intent: 'Classes A and B: Providers MUST responsibly notify all affected parties by providing a Final Incident Report once the incident
    has been resolved and recovery is complete, including final updates to all previously reported information. Timeframe at every Potential
    Agency Impact rating: 3 business days. Class C: Providers MUST responsibly notify all affected parties by providing a Final Incident
    Report once the incident has been resolved and recovery is complete, including final updates to all previously reported information.
    Timeframes by Potential Agency Impact rating: N1: 1 business day; N2: 1 business day; N3: 6 hours; N4: 6 hours; N5: 6 hours.'
  evidence_examples:
  - An Final Incident Report for one or more incidents. The report can be from real incidents, simulated incidents, or a combination
    of sources.
  - 'In FedRAMP''s format: FedRAMP Incident Report (IEC-CSO-IIR / IEC-CSO-OIR / IEC-CSO-FIR) (https://fedramp.gov/schemas/fedramp-incident-report-schema-2026-06-24.json)'
  nist80053:
  - IR-5
- id: IEC-CSO-EFI
  kind: recommendation
  category: class_b
  group: IEC
  title: Estimate Federal Impact
  intent: 'Providers SHOULD promptly estimate the likely adverse impact of an incident on agency customers to assign a Potential Agency
    Impact N-rating; this step is called Incident Rating. N1 for a likely minimal customer effect on 1 or more agencies; N2 for a likely
    narrow customer effect on 1 or more agencies; N3 for a likely disruptive customer effect on 1 agency; N4 for a likely debilitating
    customer effect on 1 agency or a likely disruptive customer effect on more than 1 agency; N5 for a likely debilitating customer
    effect on more than 1 agency. Note: All incidents must be assigned a default PAIN-5 as required by IEC-CSO-DPR (Default PAIN Rating)
    if this step is not completed.'
  evidence_examples:
  - An incident log showing an example of one or more incidents being evaluated including the reason for the determination. The log
    can be from real incidents, simulated incidents, or a combination of sources.
  - 'In FedRAMP''s format: FedRAMP Incident Report (IEC-CSO-IIR / IEC-CSO-OIR / IEC-CSO-FIR) (https://fedramp.gov/schemas/fedramp-incident-report-schema-2026-06-24.json)'
- id: IEC-CSO-AIR
  kind: recommendation
  category: class_b
  group: IEC
  title: Automated Incident Reporting
  intent: Providers SHOULD use automation to minimize human intervention in the process of reporting FedRAMP Reportable Incidents to
    all affected parties.
  evidence_examples:
  - Explanation of how the rule is followed, or an explanation of the reason and resulting risk to customers for not following the rule.
  - Verification that the implementation is appropriate for the rule, or that the reason for not implementing is accepted by a senior
    official.
  - Validation that the implementation is in place and working as intended, or that the reason for not implementing is accepted by a
    senior official.
  - Independent verification.
  - Independent validation.
- id: IVV-CSO-FIA
  kind: rule
  category: class_b
  group: IVV
  title: FedRAMP Independent Assessments
  intent: Providers MUST persistently complete an independent verification and validation assessment of all applicable FedRAMP rules
    with a FedRAMP Recognized independent assessment service OR FedRAMP at least once per year; this is a FedRAMP independent assessment.
  evidence_examples:
  - Explanation of how the rule is followed, or an explanation of the reason and resulting risk to customers for not following the rule.
  - Verification that the implementation is appropriate for the rule, or that the reason for not implementing is accepted by a senior
    official.
  - Validation that the implementation is in place and working as intended, or that the reason for not implementing is accepted by a
    senior official.
  - Independent verification.
  - Independent validation.
  nist80053:
  - CA-2
  - CA-2(1)
  - CA-2(2)
  - CA-7(1)
  - CA-7(4)
- id: IVV-CSO-SEI
  kind: rule
  category: class_b
  group: IVV
  title: Supply Evidence of Implementation
  intent: 'Providers MUST supply evidence to all necessary assessors of the implementation of the measures that have been documented
    to meet FedRAMP Practices; this evidence is the result of verification. Note: For example, if the documentation says that firewall
    rules are used to block traffic then the cloud service provider would verify that firewall rules are in place to block traffic and
    supply that evidence to assessors (preferably by allowing them to see how firewall configurations are deployed from a source of
    truth).'
  evidence_examples:
  - Explanation of how the rule is followed, or an explanation of the reason and resulting risk to customers for not following the rule.
  - Verification that the implementation is appropriate for the rule, or that the reason for not implementing is accepted by a senior
    official.
  - Validation that the implementation is in place and working as intended, or that the reason for not implementing is accepted by a
    senior official.
  - Independent verification.
  - Independent validation.
- id: IVV-CSO-SEE
  kind: rule
  category: class_b
  group: IVV
  title: Supply Evidence of Effectiveness
  intent: 'Providers MUST supply evidence to all necessary assessors of the effectiveness of the measures that have been implemented
    to meet FedRAMP Practices; this evidence is the result of validation. Note: For example, after verifying that firewalls are configured
    to block traffic following IVV-CSO-SEI (Supply Evidence of Implementation), the provider would validate that traffic is actually
    being blocked and supply evidence of that validation to assessors (such as by allowing them to see metrics on the traffic that is
    blocked vs not).'
  evidence_examples:
  - Explanation of how the rule is followed, or an explanation of the reason and resulting risk to customers for not following the rule.
  - Verification that the implementation is appropriate for the rule, or that the reason for not implementing is accepted by a senior
    official.
  - Validation that the implementation is in place and working as intended, or that the reason for not implementing is accepted by a
    senior official.
  - Independent verification.
  - Independent validation.
- id: IVV-CSO-ICP
  kind: rule
  category: class_b
  group: IVV
  title: Inclusion in Certification Package
  intent: Providers MUST supply the results of FedRAMP independent assessments in their FedRAMP Certification Package without inappropriate
    modification.
  evidence_examples:
  - Explanation of how the rule is followed, or an explanation of the reason and resulting risk to customers for not following the rule.
  - Verification that the implementation is appropriate for the rule, or that the reason for not implementing is accepted by a senior
    official.
  - Validation that the implementation is in place and working as intended, or that the reason for not implementing is accepted by a
    senior official.
  - Independent verification.
  - Independent validation.
- id: IVV-CSO-DUS
  kind: rule
  category: class_b
  group: IVV
  title: Document Use of Representative Samples
  intent: Providers MUST document and explain the use of representative samples during verification and validation when using representative
    samples as allowed by IVV-CSO-USR (Use Representative Samples).
  evidence_examples:
  - Explanation of how the rule is followed, or an explanation of the reason and resulting risk to customers for not following the rule.
  - Verification that the implementation is appropriate for the rule, or that the reason for not implementing is accepted by a senior
    official.
  - Validation that the implementation is in place and working as intended, or that the reason for not implementing is accepted by a
    senior official.
  - Independent verification.
  - Independent validation.
- id: IVV-CSO-STE
  kind: recommendation
  category: class_b
  group: IVV
  title: Supply Technical Explanations
  intent: Providers SHOULD supply all necessary assessors with technical explanations, demonstrations, and other relevant supporting
    information about the technical capabilities they employ to address FedRAMP rules; this SHOULD be supplied as necessary to ensure
    the assessor can effectively complete verification and validation.
  evidence_examples:
  - Explanation of how the rule is followed, or an explanation of the reason and resulting risk to customers for not following the rule.
  - Verification that the implementation is appropriate for the rule, or that the reason for not implementing is accepted by a senior
    official.
  - Validation that the implementation is in place and working as intended, or that the reason for not implementing is accepted by a
    senior official.
  - Independent verification.
  - Independent validation.
- id: IVV-CSX-AIA
  kind: rule
  category: core
  group: IVV
  title: Annual Independent Assessments for 20x
  intent: 'Class A: Providers with 20x Class A Certifications MUST meet the expectations of their underlying alternative security framework
    as part of their persistent independent verification and validation assessment. Class B: Providers with 20x Class B Certifications
    MUST include all Key Security Indicators in a FedRAMP independent assessment at least once per year. Class C: Providers with 20x
    Class C Certifications MUST include all Key Security Indicators in a FedRAMP independent assessment at least once per year.'
  evidence_examples:
  - Explanation of how the rule is followed, or an explanation of the reason and resulting risk to customers for not following the rule.
  - Verification that the implementation is appropriate for the rule, or that the reason for not implementing is accepted by a senior
    official.
  - Validation that the implementation is in place and working as intended, or that the reason for not implementing is accepted by a
    senior official.
  - Independent verification.
  - Independent validation.
- id: MAS-CSO-IIR
  kind: rule
  category: core
  group: MAS
  title: Identify Information Resources
  intent: Providers MUST identify a set of information resources to assess for FedRAMP Certification that includes all information resources
    that are likely to handle federal customer data or likely to impact the confidentiality, integrity, or availability of federal customer
    data handled by the cloud service offering; this set of information resources is the cloud service offering.
  evidence_examples:
  - A machine readable output containing all required data of the components of the cloud service offering that are likely to handle
    federal customer data or likely to impact the confidentiality, integrity, or availability of federal customer data handled by the
    cloud service offering.
  - A human readable explanation of how the machine readable output is derived.
  - The code for the automated process used to generate the machine readable output.
  nist80053:
  - CM-8(4)
  - RA-3
  - SI-4(19)
- id: MAS-CSO-FLO
  kind: rule
  category: class_b
  group: MAS
  title: Information Flows and Security Categories
  intent: 'Providers MUST clearly identify, document, and explain information flows and security categories for ALL information resources
    or sets of information resources in the cloud service offering. Note: Information resources (including third-party information resources)
    MAY vary by security category as appropriate to the type of information handled by or impacted by the information resource.'
  evidence_examples:
  - A machine readable output containing all required data of the permitted connections between components of the cloud service offering
    that are likely to handle federal customer data or likely to impact the confidentiality, integrity, or availability of federal customer
    data handled by the cloud service offering.
  - A human readable explanation of how the machine readable output is derived.
  - The code for the automated process used to generate the machine readable output.
  nist80053:
  - AC-4
  - CM-12
  - CM-12(1)
  - RA-3
  - SI-4(19)
- id: MAS-CSO-TPR
  kind: rule
  category: class_b
  group: MAS
  title: Third-Party Information Resources
  intent: 'Providers MUST address the potential impact to federal customer data from third-party information resources used by the cloud
    service offering, ONLY IF MAS-CSO-IIR (Identify Information Resources) APPLIES, by documenting the following information about each
    applicable third-party information resource: General usage and configuration; Explanation or justification for use; Mitigation measures
    in place to reduce the potential impact to federal customer data; Compensating controls in place to reduce the potential impact
    to federal customer data.'
  evidence_examples:
  - A machine readable output containing all required data of the third-party information resources of the cloud service offering that
    are likely to handle federal customer data or likely to impact the confidentiality, integrity, or availability of federal customer
    data handled by the cloud service offering.
  - A human readable explanation of how the machine readable output is derived.
  - The code for the automated process used to generate the machine readable output.
  - 'In FedRAMP''s format: FedRAMP Certification Package Overview (FRC-CSO-PKG) (https://fedramp.gov/schemas/fedramp-certification-package-overview-schema-2026-06-24.json)'
  nist80053:
  - RA-3
- id: MAS-CSO-MDI
  kind: rule
  category: class_b
  group: MAS
  title: Metadata Inclusion
  intent: Providers MUST include metadata (including metadata about federal customer data) in the Minimum Assessment Scope ONLY IF MAS-CSO-IIR
    (Identify Information Resources) APPLIES.
  evidence_examples:
  - A machine readable output containing all required data of the metadata collected or maintained by the cloud service offering that
    are likely to handle federal customer data or likely to impact the confidentiality, integrity, or availability of federal customer
    data handled by the cloud service offering.
  - A human readable explanation of how the machine readable output is derived.
  - The code for the automated process used to generate the machine readable output.
- id: SCG-CSO-RSC
  kind: rule
  category: class_b
  group: SCG
  title: Recommended Secure Configuration
  intent: 'Providers MUST create, maintain, and make available recommendations for securely configuring their cloud services (the Secure
    Configuration Guide) that includes at least the following information: Required: Instructions on how to securely access, configure,
    operate, and decommission top-level administrative accounts that control enterprise access to the entire cloud service offering;
    Required: Explanations of security-related settings that can be operated only by top-level administrative accounts and their security
    implications; Recommended: Explanations of security-related settings that can be operated only by privileged accounts and their
    security implications.'
  evidence_examples:
  - URL to the human-readable data.
  - URL to the machine-readable data.
  - 'In FedRAMP''s format: FedRAMP Certification Package Overview (FRC-CSO-PKG) (https://fedramp.gov/schemas/fedramp-certification-package-overview-schema-2026-06-24.json)'
  nist80053:
  - CM-7
- id: SCG-CSO-AUP
  kind: rule
  category: class_b
  group: SCG
  title: Use Instructions
  intent: 'Providers MUST include instructions in the FedRAMP Certification Package that explain how to obtain and use the Secure Configuration
    Guide. Note: These instructions may appear in a variety of ways; it is up to the provider to do so in the most appropriate and effective
    ways for their specific customer needs.'
  evidence_examples:
  - URL or explanation of how to request these materials.
  - Explanation of how the provider decides whether or not to share these materials or other related policies.
- id: SCG-CSO-PUB
  kind: recommendation
  category: class_b
  group: SCG
  title: Public Secure Configuration Guidance
  intent: Providers SHOULD make the Secure Configuration Guide available publicly.
  evidence_examples:
  - Explanation of how to access this information
  - Or explanation why this functionality is not available
- id: SCG-CSO-SDF
  kind: recommendation
  category: class_b
  group: SCG
  title: Secure Defaults
  intent: Providers SHOULD set all settings to their recommended secure defaults for top-level administrative accounts and privileged
    accounts when initially provisioned.
  evidence_examples:
  - Explanation of how to access this information
  - Or explanation why this functionality is not available
- id: SCG-ENH-CMP
  kind: recommendation
  category: class_b
  group: SCG
  title: Comparison Capability
  intent: Providers SHOULD offer the capability to compare all current settings for top-level administrative accounts and privileged
    accounts to the recommended secure defaults.
  evidence_examples:
  - Explanation of how to access this information
  - Or explanation why this functionality is not available
- id: SCG-ENH-EXP
  kind: recommendation
  category: class_b
  group: SCG
  title: Export Capability
  intent: Providers SHOULD offer the capability to export all security settings in a machine-readable format.
  evidence_examples:
  - Explanation of how to access this information
  - Or explanation why this functionality is not available
- id: SCG-ENH-API
  kind: recommendation
  category: class_b
  group: SCG
  title: API Capability
  intent: Providers SHOULD offer the capability to view and adjust security settings via an API or similar capability.
  evidence_examples:
  - Explanation of how to access this information
  - Or explanation why this functionality is not available
- id: SCG-ENH-MRG
  kind: recommendation
  category: class_b
  group: SCG
  title: Machine-Readable Guidance
  intent: Providers SHOULD also provide the Secure Configuration Guide in a machine-readable format that can be used by customers or
    third-party tools to compare against current settings.
  evidence_examples:
  - Explanation of how to access this information
  - Or explanation why this functionality is not available
- id: SCG-ENH-VRH
  kind: recommendation
  category: class_b
  group: SCG
  title: Versioning and Release History
  intent: Providers SHOULD provide versioning and a release history for recommended secure default settings for top-level administrative
    accounts and privileged accounts as they are adjusted over time.
  evidence_examples:
  - Explanation of how to access this information
  - Or explanation why this functionality is not available
- id: SCN-CSO-EVA
  kind: rule
  category: class_b
  group: SCN
  title: Evaluate Changes
  intent: Providers MUST evaluate all potential significant changes to determine the type of significant change and follow the appropriate
    Significant Change Notification rules. Is it a significant change? --> Continue evaluation and follow the Significant Change Notification
    rules; If it is, is it an FedRAMP Certification class change? --> This requires a new assessment and cannot be done under the Significant
    Change Notification rules; If it is not, is it a routine recurring change? --> Follow the Routine Recurring Change rules (SCN-RTR
    Routine Recurring Changes); If it is not, is it a transformative change? --> Follow the Transformative Change rules (SCN-TRF Transformative
    Changes); If it is not, then it is an adaptive change --> Follow the Adaptive Change rules (SCN-ADP Adaptive Changes).
  evidence_examples:
  - Evidence of significant change evaluation including a description fo the change, the determined type, and an explanation for the
    decision. At least one example must be provided for each type of change. Real examples are prefered but the provider may use fictitious
    examples as long as the example provides evidence of the decision making process.
  - 'In FedRAMP''s format: FedRAMP Significant Change Notification (SCN-CSO-INF) (https://fedramp.gov/schemas/fedramp-significant-change-notifications-schema-2026-06-24.json)'
  nist80053:
  - CM-4
- id: SCN-CSO-MAR
  kind: rule
  category: class_b
  group: SCN
  title: Maintain Audit Records
  intent: 'Providers MUST maintain auditable records of the significant change evaluation activities required by SCN-CSO-EVA (Evaluate
    Changes) and make them available to FedRAMP as requested. Note: These audit records must be available to FedRAMP on request; these
    records do not need to be included in the FedRAMP Certification Package by default and do not need to be emailed to FedRAMP continuously.'
  evidence_examples:
  - Explanation of how FedRAMP can obtain this information.
- id: SCN-CSO-INF
  kind: rule
  category: class_b
  group: SCN
  title: Required Information
  intent: 'Providers MUST include at least the following information in Significant Change Notifications: Service Offering FedRAMP ID;
    Assessor Name (if applicable); Related Vulnerability (if applicable); Significant Change type and explanation of categorization;
    Short description of change; Reason for change; Summary of customer impact, including changes to services and customer configuration
    responsibilities; Plan and timeline for the change, including for the verification, assessment, and/or validation of impacted Key
    Security Indicators or Rev5 Controls; Copy of the business or security impact analysis; Name and title of approver. Note: Structure
    of the information may vary depending on how the provider tracks this internally.'
  evidence_examples:
  - A recent Significant Change Notification or sample Significant Change Notification
  - 'In FedRAMP''s format: FedRAMP Significant Change Notification (SCN-CSO-INF) (https://fedramp.gov/schemas/fedramp-significant-change-notifications-schema-2026-06-24.json)'
- id: SCN-CSO-HIS
  kind: rule
  category: class_b
  group: SCN
  title: Historical Notifications
  intent: Providers MUST keep 12 months of historical Significant Change Notifications available with their FedRAMP Certification Data.
  evidence_examples:
  - Explanation of how FedRAMP can obtain this information.
- id: SCN-CSO-HRM
  kind: rule
  category: class_b
  group: SCN
  title: Human and Machine-Readable Notifications
  intent: Providers MUST make ALL Significant Change Notifications and related audit records available in human-readable and JSON formats.
  evidence_examples:
  - URL or explanation of how to request these materials.
  - Explanation of how the provider decides whether or not to share these materials or other related policies.
  - 'In FedRAMP''s format: FedRAMP Significant Change Notifications Schema (https://fedramp.gov/schemas/fedramp-significant-change-notifications-schema-2026-06-24.json)'
- id: SCN-ADP-NTF
  kind: rule
  category: class_b
  group: SCN
  title: Notification Requirements
  intent: 'Providers MUST notify all necessary parties within 10 business days after finishing adaptive changes, also including the
    following information: Summary of any new risks identified and/or vulnerabilities resulting from the change (if applicable).'
  evidence_examples:
  - At least the most recent SCN notification including the date it was sent and the date the change was applied. Additional examples
    may be provided. If no SCN notifications have been sent then this artifact is not required.
