  intent: 'Providers MUST supply a Security Decision Record, in both human-readable and JSON formats, that includes at least all of
    the following information for each applicable FedRAMP rule: Explanation of how the rule is followed, or an explanation of the reason
    and resulting risk to customers for not following the rule; Verification that the implementation is appropriate for the rule, or
    that the reason for not implementing is accepted by a senior official; Validation that the implementation is in place and working
    as intended, or that the reason for not implementing is accepted by a senior official; Independent verification; Independent validation;
    Any responses or clarifications to the comments in the independent verification or validation; Rule-specific artifacts (if applicable).'
  evidence_examples:
