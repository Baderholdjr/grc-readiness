- id: VDR-TFR-PVR
  kind: recommendation
  category: core
  group: VDR
  title: Mitigation and Remediation Expectations
  intent: 'Classes A and B: Providers SHOULD partially mitigate vulnerabilities, fully mitigate vulnerabilities, or remediate vulnerabilities
    to a lower potential agency impact within the timeframes from evaluation below, factoring for the current Potential Agency Impact
    N-rating as defined in VER-EVA-EPA (Estimate Potential Agency Impact), internet reachability, and likely exploitability. Timeframes
    by Potential Agency Impact rating: N2: 96 days (internet-reachable and likely exploitable), 160 days (not internet-reachable, likely
    exploitable), 192 days (not likely exploitable); N3: 32 days (internet-reachable and likely exploitable), 64 days (not internet-reachable,
    likely exploitable), 192 days (not likely exploitable); N4: 8 days (internet-reachable and likely exploitable), 32 days (not internet-reachable,
    likely exploitable), 64 days (not likely exploitable); N5: 4 days (internet-reachable and likely exploitable), 8 days (not internet-reachable,
    likely exploitable), 32 days (not likely exploitable). Class C: Providers SHOULD partially mitigate vulnerabilities, fully mitigate
    vulnerabilities, or remediate vulnerabilities to a lower Potential Agency Impact N-rating within the timeframes from evaluation
    below, factoring for the current Potential Agency Impact N-rating as defined in VER-EVA-EPA (Estimate Potential Agency Impact),
    internet reachability, and likely exploitability. Timeframes by Potential Agency Impact rating: N2: 48 days (internet-reachable
    and likely exploitable), 128 days (not internet-reachable, likely exploitable), 192 days (not likely exploitable); N3: 16 days (internet-reachable
    and likely exploitable), 32 days (not internet-reachable, likely exploitable), 128 days (not likely exploitable); N4: 4 days (internet-reachable
    and likely exploitable), 8 days (not internet-reachable, likely exploitable), 64 days (not likely exploitable); N5: 2 days (internet-reachable
    and likely exploitable), 4 days (not internet-reachable, likely exploitable), 16 days (not likely exploitable).'
  evidence_examples:
