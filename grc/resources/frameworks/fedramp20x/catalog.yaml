- id: VER-RPT-VDT
  kind: rule
  category: class_b
  group: VER
  title: Vulnerability Details
  intent: 'Providers MUST include the following information (if applicable) on detected vulnerabilities when reporting on vulnerability
    detection and response activity, UNLESS it is an accepted vulnerability: Provider''s internally assigned tracking identifier; Time
    and source of the detection; Time of completed evaluation; Is it an internet-reachable vulnerability or not?; Is it a likely exploitable
    vulnerability or not?; Historically and currently estimated Potential Agency Impact N-rating of exploitation; Time and Potential
    Agency Impact N-rating of each completed and evaluated reduction in Potential Agency Impact N-rating; Estimated time and target
    Potential Agency Impact N-rating of next reduction in Potential Agency Impact N-rating; Is it currently or is it likely to become
    an overdue vulnerability or not? If so, explain; Any supplementary information the provider responsibly determines will help federal
    agencies assess or mitigate the risk to their federal customer data within the cloud service offering resulting from the vulnerability;
    Final disposition of the vulnerability.'
  evidence_examples:
  - A recent vulnerability report or a sample vulnerability report
  - 'In FedRAMP''s format: FedRAMP Vulnerability Detail Report (VER-RPT-VDT) (https://fedramp.gov/schemas/fedramp-vulnerability-detail-report-schema-2026-06-24.json)'
  nist80053:
