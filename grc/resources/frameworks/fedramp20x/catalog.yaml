  - Independent validation.
- id: VER-TFR-MRH
  kind: recommendation
  category: class_b
  group: VER
  title: Historical Activity
  intent: 'Class B: Providers SHOULD make all recent historical vulnerability detection and response activity available in JSON format
    for automated retrieval by all necessary parties (e.g. using an API service or similar); this information SHOULD be updated persistently,
    at least once every month. Class C: Providers SHOULD make all recent historical vulnerability detection and response activity available
    in JSON format for automated retrieval by all necessary parties (e.g. using an API service or similar); this information SHOULD
    be updated persistently, at least once every 14 days.'
  evidence_examples:
  - URL and access instructions for historical vulnerability detection and response activity in machine readable format
  - Or an explanation of why machine readable content is not being provided
  - 'In FedRAMP''s format: FedRAMP Historical Vulnerability Evaluation and Reporting Activity (VER-TFR-MRH) (https://fedramp.gov/schemas/fedramp-historical-ver-activity-schema-2026-06-24.json)'
- id: VER-TFR-EVU
  kind: recommendation
  category: core
  group: VER
  title: Evaluate Vulnerabilities Quickly
  intent: 'Class A: Providers SHOULD evaluate ALL vulnerabilities as required by VER-EVA (Evaluation) within 14 days of detection. Class
    B: Providers SHOULD evaluate ALL vulnerabilities as required by VER-EVA (Evaluation) within 7 days of detection. Class C: Providers
    SHOULD evaluate ALL vulnerabilities as required by VER-EVA (Evaluation) within 5 days of detection.'
  evidence_examples:
