- id: VER-EVA-EPA
  kind: rule
  category: class_b
  group: VER
  title: Estimate Potential Agency Impact
  intent: 'Providers MUST evaluate detected vulnerabilities, considering the context of the cloud service offering, to estimate the
    likely potential agency impact of exploitation on government customers AND assign one of the following Potential Agency Impact N-ratings
    (PAIN): N0: Exploitation is extremely unlikely to have any adverse effects on agencies that use the cloud service offering; N1:
    Exploitation could be expected to have minimal customer effects on one or more agencies that use the cloud service offering; N2:
    Exploitation could be expected to have narrow customer effects on one or more agencies that use the cloud service offering; N3:
    Exploitation could be expected to have a disruptive customer effect on one agency that uses the cloud service offering; N4: Exploitation
    could be expected to have a debilitating customer effect on one agency that uses the cloud service offering OR a disruptive customer
    effect on more than one federal agency that uses the cloud service offering; N5: Exploitation could be expected to have a debilitating
    customer effect on more than one agency that uses the cloud service offering.'
  evidence_examples:
  - Explanation of how the rule is followed, or an explanation of the reason and resulting risk to customers for not following the rule.
