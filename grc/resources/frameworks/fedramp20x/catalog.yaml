  category: class_b
  group: SDR
  title: Key Security Indicator Metrics
  intent: 'Class B: Providers with 20x Class B Certifications SHOULD also include historical metrics in their Security Decision Record,
    supplying at least the following information for each applicable Key Security Indicator: Summary of each metric over the past 30
    days; Summary of metric up to the past year (where available). Note: For initial FedRAMP Certification, providers will need to have
    mechanisms in place and agree to meet this requirement in the event the cloud service has not been operating with related metrics
    available for the required period prior to applying for initial certification. Class C: Providers with 20x Class C Certifications
    MUST also include historical metrics in their Security Decision Record, supplying at least the following information for each applicable
    Key Security Indicator: Summary of each metric over the past 30 days; Summary of metric up to the past year (where available); All
    daily metric data (including status of persistent validation) up to the past year (where available). Note: For initial FedRAMP Certification,
    providers will need to have mechanisms in place and agree to meet this requirement in the event the cloud service has not been operating
