  kind: rule
  category: class_b
  group: VER
  title: Accepted Vulnerability Info
  intent: 'Providers MUST include the following information on accepted vulnerabilities when reporting on vulnerability detection and
    response activity: Provider''s internally assigned tracking identifier; Time and source of the detection; Time of completed evaluation;
    Is it an internet-reachable vulnerability or not?; Is it a likely exploitable vulnerability or not?; Currently estimated Potential
    Agency Impact N-rating; Explanation of why this is an accepted vulnerability; Any supplementary information the provider determines
    will responsibly help federal agencies assess or mitigate the risk to their federal customer data within the cloud service offering
    resulting from the accepted vulnerability.'
  evidence_examples:
