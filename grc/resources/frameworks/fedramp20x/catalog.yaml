# FedRAMP 20x requirement catalog, generated by tools/fedramp20x.py from the FedRAMP Consolidated Rules for 2026
# (https://github.com/FedRAMP/rules, version 2026.11.02.01, updated 2026-11-02). Do not edit by hand: regenerate.
# It holds the Key Security Indicators (KSI-*) and the process rules that affect providers on the 20x path.
# FedRAMP's text is a US Government work; each `intent` is FedRAMP's own statement (bold markers removed, listed
# items and timeframes run in). Defined terms (persistently, information resource, likely, ...) have the meanings
# in the dataset's FRD definitions.
#
# kind: indicator      -> a Key Security Indicator: shown with measures, automated where practical.
#       rule           -> a MUST / MUST NOT rule for the class.
#       recommendation -> a SHOULD / SHOULD NOT rule for the class: may be marked not applicable, with the reason
#                         and the resulting risk to customers.
# FedRAMP also accepts an explanation of why a rule or indicator is not met, with the risk to customers, when a
# senior official accepts it. Record that as an accepted risk in the gap register; don't exclude the item.
#
# category: core = every 20x class (A, B and C). Choose the certification class in scope.categories:
#   Class A -> class_a  (FedRAMP's lists FRC-CLA-MFR and FRC-CLA-RFR decide what Class A addresses)
#   Class B -> class_b
#   Class C -> class_b and class_c   (class_c adds to class_b)
# Class D is not covered: FedRAMP has not yet set all of its 20x specifics.
# mandatory_in: a rule that is a MUST only for some classes and a SHOULD for a lower one is a recommendation
#   unless one of these categories is chosen. `nist80053` lists FedRAMP's own control mappings.

framework:
  id: fedramp20x
  name: FedRAMP 20x (FedRAMP Consolidated Rules for 2026)
  short_name: FedRAMP 20x
  management_system: Security program for the cloud service offering
  source: https://github.com/FedRAMP/rules
  version: 2026.11.02.01
kinds:
  indicator:
    label: Key Security Indicator
    short: KSI
    mandatory: true
  rule:
    label: FedRAMP rule (MUST)
    short: Rule
    mandatory: true
  recommendation:
    label: FedRAMP rule (SHOULD)
    short: Should
    mandatory: false
choose_at_least_one:
- class_a
- class_b
categories:
- id: core
  title: Every 20x class
  short: All classes
  required: true
- id: class_a
  title: Class A only
  short: Class A
  excludes:
