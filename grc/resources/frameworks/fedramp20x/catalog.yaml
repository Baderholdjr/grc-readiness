- id: SCN-TRF-NIP
  kind: rule
  category: class_b
  group: SCN
  title: Notification of Initial Plans
  intent: Providers MUST notify all necessary parties of initial plans for transformative changes at least 30 business days before starting
    transformative changes, including a summary of any likely security impacts or changes in risk.
  evidence_examples:
  - At least the most recent initial SCN notification for a transformative change including the date it was sent and the date the change
    was applied. Additional examples may be provided. If no transformative SCN notifications have been sent then this artifact is not
    required.
- id: SCN-TRF-NFP
  kind: rule
  category: class_b
  group: SCN
  title: Notification of Final Plans
  intent: Providers MUST notify all necessary parties of final plans for transformative changes at least 10 business days before starting
    transformative changes, including updates to all previously sent information.
  evidence_examples:
  - At least the most recent final SCN notification for a transformative change including the date it was sent and the date the change
    was applied. Additional examples may be provided. If no transformative SCN notifications have been sent then this artifact is not
    required.
- id: SCN-TRF-NAF
  kind: rule
  category: class_b
  group: SCN
  title: Notification After Finishing
  intent: Providers MUST notify all necessary parties within 5 business days after finishing transformative changes, including updates
    to all previously sent information.
  evidence_examples:
  - At least the most recent post deployment SCN notification for a transformative change including the date it was sent and the date
    the change was applied. Additional examples may be provided. If no transformative SCN notifications have been sent then this artifact
    is not required.
- id: SCN-TRF-NAV
  kind: rule
  category: class_b
  group: SCN
  title: Notification After Verification
  intent: 'Providers MUST notify all necessary parties within 5 business days after completing the verification, assessment, and/or
    validation of transformative changes, also including the following information: Updates to all previously sent information; Summary
    of any new risks identified and/or vulnerabilities resulting from the change (if applicable); Copy of the security assessment report
    (if applicable).'
  evidence_examples:
  - At least the most recent after verification SCN notification for a transformative change including the date it was sent and the
    date the change was applied. Additional examples may be provided. If no transformative SCN notifications have been sent then this
    artifact is not required.
- id: SCN-TRF-UPD
  kind: rule
  category: class_b
  group: SCN
  title: Update Documentation
  intent: 'Providers MUST publish updated service documentation and other materials to reflect transformative changes within 30 business
    days after finishing transformative changes. Note: This requirement is focused on service documentation like user guides, information
    listed in the marketplace, and other such materials; it does not require updating the system security plan or FedRAMP Certification
    Package.'
  evidence_examples:
  - Date of the most recent transformative change and the date of the corresponding documentation update. If no documentation updates
    were required as the result of this change, explain how this was determined.
- id: SCN-TRF-TPR
  kind: recommendation
  category: class_b
  group: SCN
  title: Third-Party Review
  intent: 'Providers SHOULD engage a third-party assessor to review the scope and impact of the planned change before starting transformative
    changes if human validation is necessary; such reviews SHOULD be limited to security decisions that require human validation. Note:
    Activities that match the transformative significant change type are rare for a cloud service offering, adjusted for the size, scale,
    and complexity of the service. Small cloud service offerings may go years without transformative changes, while hyperscale providers
    may release multiple transformative changes per year.'
  evidence_examples:
  - Third Party assesment report OR explanation why a third party assessor was not engaged
