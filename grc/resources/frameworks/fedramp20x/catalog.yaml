- id: VER-RPT-NID
  kind: rule
  category: class_b
  group: VER
  title: Responsible Disclosure
  intent: 'Providers MUST NOT irresponsibly disclose specific sensitive information about vulnerabilities that would likely lead to
    exploitation, but MUST disclose sufficient information for informed risk-based decision-making to all necessary parties. Note: This
    requirement will be superseded in the event of formal action related to an investigation or corrective action plan.'
  evidence_examples:
