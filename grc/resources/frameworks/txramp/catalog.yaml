# TX-RAMP requirement catalog: the TX-RAMP Security Controls Baselines 2.0 (Texas Department of Information
# Resources), Level 1 and Level 2.
#
# Each control is a NIST SP 800-53 Rev. 5 control; its title and `intent` are NIST's (a US Government work,
# with organization-defined values left as [Assignment: ...]). TX-RAMP sets many of those values (its
# "TX-RAMP Parameters"); they are in the client's copy of the TX-RAMP Security Plan workbook, which
# `grc questionnaire import` reads, and are not reproduced here.
#
# category: core = Level 1 (117 controls, always in scope). level_2 = the 106 controls Level 2 adds: choose it
#   for confidential or regulated data in moderate or high impact systems (`--categories level_2`).
# A control the cloud service provider doesn't implement (fully inherited, or the customer's) can be marked
# not applicable with a justification that names who is responsible: DIR asks for that narrative.

framework:
  id: txramp
  name: Texas Risk and Authorization Management Program (TX-RAMP) Security Controls Baselines 2.0
  short_name: TX-RAMP
  management_system: Security program for the TX-RAMP scoped cloud service
  source: https://dir.texas.gov/information-security/texas-risk-and-authorization-management-program-tx-ramp
kinds:
  control:
    label: Security control
    short: Control
    mandatory: false
categories:
- id: core
  title: Level 1 baseline
  short: Level 1
  required: true
- id: level_2
  title: Level 2 additions (confidential or regulated data)
  short: Level 2
groups:
- id: AC
  title: AC Access Control
- id: AT
  title: AT Awareness and Training
- id: AU
  title: AU Audit and Accountability
- id: CA
  title: CA Security Assessment and Authorization
- id: CM
  title: CM Configuration Management
- id: CP
  title: CP Contingency Planning
- id: IA
  title: IA Identification and Authentication
- id: IR
  title: IR Incident Response
- id: MA
  title: MA Maintenance
- id: MP
  title: MP Media Protection
- id: PE
  title: PE Physical and Environmental Security
- id: PL
  title: PL Planning
- id: PS
  title: PS Personnel Security
- id: RA
  title: RA Risk Assessment
- id: SA
  title: SA System and Services Acquisition
- id: SC
  title: SC System and Communications Protection
- id: SI
  title: SI System and Information Integrity
requirements:
- id: AC-1
  kind: control
  category: core
  group: AC
  title: Policy and Procedures
  intent: 'a. Develop, document, and disseminate to [Assignment: organization-defined personnel or roles]: 1. [Selection (one or more):
    organization-level; mission/business process-level; system-level] access control policy that: (a) Addresses purpose, scope, roles,
    responsibilities, management commitment, coordination among organizational entities, and compliance; and (b) Is consistent with
    applicable laws, executive orders, directives, regulations, policies, standards, and guidelines; and 2. Procedures to facilitate
    the implementation of the access control policy and the associated access controls; b. Designate an [Assignment: official] to manage
    the development, documentation, and dissemination of the access control policy and procedures; and c. Review and update the current
    access control: 1. Policy [Assignment: frequency] and following [Assignment: events] ; and 2. Procedures [Assignment: frequency]
    and following [Assignment: events].'
  evidence_examples: &id001
  - Account list with owners and approvals
  - Quarterly access review sign-off
  - IdP session and lockout settings
- id: AC-2
  kind: control
  category: core
  group: AC
  title: Account Management
  intent: 'a. Define and document the types of accounts allowed and specifically prohibited for use within the system; b. Assign account
    managers; c. Require [Assignment: prerequisites and criteria] for group and role membership; d. Specify: 1. Authorized users of
    the system; 2. Group and role membership; and 3. Access authorizations (i.e., privileges) and [Assignment: attributes (as required)]
    for each account; e. Require approvals by [Assignment: personnel or roles] for requests to create accounts; f. Create, enable, modify,
    disable, and remove accounts in accordance with [Assignment: policy, procedures, prerequisites, and criteria]; g. Monitor the use
    of accounts; h. Notify account managers and [Assignment: personnel or roles] within: 1. [Assignment: time period] when accounts
    are no longer required; 2. [Assignment: time period] when users are terminated or transferred; and 3. [Assignment: time period]
    when system usage or need-to-know changes for an individual; i. Authorize access to the system based on: 1. A valid access authorization;
    2. Intended system usage; and 3. [Assignment: attributes (as required)]; j. Review accounts for compliance with account management
    requirements [Assignment: frequency]; k. Establish and implement a process for changing shared or group account authenticators (if
    deployed) when individuals are removed from the group; and l. Align account management processes with personnel termination and
    transfer processes.'
  evidence_examples: *id001
- id: AC-2(3)
  kind: control
  category: level_2
  group: AC
  title: 'Account Management: Disable Accounts'
  intent: 'Disable accounts within [Assignment: time period] when the accounts: (a) Have expired; (b) Are no longer associated with
    a user or individual; (c) Are in violation of organizational policy; or (d) Have been inactive for [Assignment: time period].'
  evidence_examples: *id001
- id: AC-2(5)
  kind: control
  category: level_2
  group: AC
  title: 'Account Management: Inactivity Logout'
  intent: 'Require that users log out when [Assignment: time period of expected inactivity or description of when to log out].'
  evidence_examples: *id001
- id: AC-2(7)
  kind: control
  category: level_2
  group: AC
  title: 'Account Management: Privileged User Accounts'
  intent: '(a) Establish and administer privileged user accounts in accordance with [Selection: a role-based access scheme; an attribute-based
    access scheme]; (b) Monitor privileged role or attribute assignments; (c) Monitor changes to roles or attributes; and (d) Revoke
    access when privileged role or attribute assignments are no longer appropriate.'
  evidence_examples: *id001
- id: AC-2(9)
  kind: control
  category: level_2
  group: AC
  title: 'Account Management: Restrictions on Use of Shared and Group Accounts'
  intent: 'Only permit the use of shared and group accounts that meet [Assignment: conditions].'
  evidence_examples: *id001
- id: AC-2(12)
  kind: control
  category: level_2
  group: AC
  title: 'Account Management: Account Monitoring for Atypical Usage'
  intent: '(a) Monitor system accounts for [Assignment: atypical usage] ; and (b) Report atypical usage of system accounts to [Assignment:
    personnel or roles].'
  evidence_examples: *id001
- id: AC-3
  kind: control
  category: core
  group: AC
  title: Access Enforcement
  intent: Enforce approved authorizations for logical access to information and system resources in accordance with applicable access
    control policies.
  evidence_examples: *id001
- id: AC-4
  kind: control
  category: level_2
  group: AC
  title: Information Flow Enforcement
  intent: 'Enforce approved authorizations for controlling the flow of information within the system and between connected systems based
    on [Assignment: information flow control policies].'
  evidence_examples: *id001
- id: AC-5
  kind: control
  category: level_2
  group: AC
  title: Separation of Duties
  intent: 'a. Identify and document [Assignment: duties of individuals] ; and b. Define system access authorizations to support separation
    of duties.'
  evidence_examples: *id001
- id: AC-6
  kind: control
  category: level_2
  group: AC
  title: Least Privilege
  intent: Employ the principle of least privilege, allowing only authorized accesses for users (or processes acting on behalf of users)
    that are necessary to accomplish assigned organizational tasks.
  evidence_examples: *id001
- id: AC-6(1)
  kind: control
  category: level_2
  group: AC
  title: 'Least Privilege: Authorize Access to Security Functions'
  intent: 'Authorize access for [Assignment: individuals and roles] to: (a) [Assignment: organization-defined security functions (deployed
    in hardware, software, and firmware)] ; and (b) [Assignment: security-relevant information].'
  evidence_examples: *id001
- id: AC-6(2)
  kind: control
  category: level_2
  group: AC
  title: 'Least Privilege: Non-privileged Access for Nonsecurity Functions'
  intent: 'Require that users of system accounts (or roles) with access to [Assignment: security functions or security-relevant information]
    use non-privileged accounts or roles, when accessing nonsecurity functions.'
  evidence_examples: *id001
- id: AC-6(5)
  kind: control
  category: level_2
  group: AC
  title: 'Least Privilege: Privileged Accounts'
  intent: 'Restrict privileged accounts on the system to [Assignment: personnel or roles].'
  evidence_examples: *id001
- id: AC-6(7)
  kind: control
  category: level_2
  group: AC
  title: 'Least Privilege: Review of User Privileges'
  intent: '(a) Review [Assignment: frequency] the privileges assigned to [Assignment: roles and classes] to validate the need for such
    privileges; and (b) Reassign or remove privileges, if necessary, to correctly reflect organizational mission and business needs.'
  evidence_examples: *id001
- id: AC-6(9)
  kind: control
  category: level_2
  group: AC
  title: 'Least Privilege: Log Use of Privileged Functions'
  intent: Log the execution of privileged functions.
  evidence_examples: *id001
- id: AC-6(10)
  kind: control
  category: level_2
  group: AC
  title: 'Least Privilege: Prohibit Non-privileged Users from Executing Privileged Functions'
  intent: Prevent non-privileged users from executing privileged functions.
  evidence_examples: *id001
- id: AC-7
  kind: control
  category: core
  group: AC
  title: Unsuccessful Logon Attempts
  intent: 'a. Enforce a limit of [Assignment: number] consecutive invalid logon attempts by a user during a [Assignment: time period]
    ; and b. Automatically [Selection (one or more): lock the account or node for [Assignment: time period] ; lock the account or node
    until released by an administrator; delay next logon prompt per [Assignment: delay algorithm] ; notify system administrator; take
    other [Assignment: action] ] when the maximum number of unsuccessful attempts is exceeded.'
  evidence_examples: *id001
- id: AC-11
  kind: control
  category: level_2
  group: AC
  title: Device Lock
  intent: 'a. Prevent further access to the system by [Selection (one or more): initiating a device lock after [Assignment: time period]
    of inactivity; requiring the user to initiate a device lock before leaving the system unattended] ; and b. Retain the device lock
    until the user reestablishes access using established identification and authentication procedures.'
  evidence_examples: *id001
- id: AC-12
  kind: control
  category: level_2
  group: AC
  title: Session Termination
  intent: 'Automatically terminate a user session after [Assignment: conditions or trigger events].'
  evidence_examples: *id001
- id: AC-14
  kind: control
  category: core
  group: AC
  title: Permitted Actions Without Identification or Authentication
  intent: 'a. Identify [Assignment: user actions] that can be performed on the system without identification or authentication consistent
    with organizational mission and business functions; and b. Document and provide supporting rationale in the security plan for the
    system, user actions not requiring identification or authentication.'
  evidence_examples: *id001
- id: AC-17
  kind: control
  category: core
  group: AC
  title: Remote Access
  intent: a. Establish and document usage restrictions, configuration/connection requirements, and implementation guidance for each
    type of remote access allowed; and b. Authorize each type of remote access to the system prior to allowing such connections.
  evidence_examples: *id001
- id: AC-17(1)
  kind: control
  category: level_2
  group: AC
  title: 'Remote Access: Monitoring and Control'
  intent: Employ automated mechanisms to monitor and control remote access methods.
  evidence_examples: *id001
- id: AC-17(2)
  kind: control
  category: level_2
  group: AC
  title: 'Remote Access: Protection of Confidentiality and Integrity Using Encryption'
  intent: Implement cryptographic mechanisms to protect the confidentiality and integrity of remote access sessions.
  evidence_examples: *id001
- id: AC-17(3)
  kind: control
  category: level_2
  group: AC
  title: 'Remote Access: Managed Access Control Points'
  intent: Route remote accesses through authorized and managed network access control points.
  evidence_examples: *id001
- id: AC-17(4)
  kind: control
  category: level_2
  group: AC
  title: 'Remote Access: Privileged Commands and Access'
  intent: '(a) Authorize the execution of privileged commands and access to security-relevant information via remote access only in
    a format that provides assessable evidence and for the following needs: [Assignment: organization-defined needs] ; and (b) Document
    the rationale for remote access in the security plan for the system.'
  evidence_examples: *id001
- id: AC-17(9)
  kind: control
  category: level_2
  group: AC
  title: 'Remote Access: Disconnect or Disable Access'
  intent: 'Provide the capability to disconnect or disable remote access to the system within [Assignment: time period].'
  evidence_examples: *id001
- id: AC-18
  kind: control
  category: core
  group: AC
  title: Wireless Access
  intent: a. Establish configuration requirements, connection requirements, and implementation guidance for each type of wireless access;
    and b. Authorize each type of wireless access to the system prior to allowing such connections.
  evidence_examples: *id001
- id: AC-19
  kind: control
  category: core
  group: AC
  title: Access Control for Mobile Devices
  intent: a. Establish configuration requirements, connection requirements, and implementation guidance for organization-controlled
    mobile devices, to include when such devices are outside of controlled areas; and b. Authorize the connection of mobile devices
    to organizational systems.
  evidence_examples: *id001
- id: AC-19(5)
  kind: control
  category: level_2
  group: AC
  title: 'Access Control for Mobile Devices: Full Device or Container-based Encryption'
  intent: 'Employ [Selection: full-device encryption; container-based encryption] to protect the confidentiality and integrity of information
    on [Assignment: mobile devices].'
  evidence_examples: *id001
- id: AC-20
  kind: control
  category: core
  group: AC
  title: Use of External Systems
  intent: 'a. [Selection (one or more): establish [Assignment: terms and conditions] ; identify [Assignment: controls asserted] ] ,
    consistent with the trust relationships established with other organizations owning, operating, and/or maintaining external systems,
    allowing authorized individuals to: 1. Access the system from external systems; and 2. Process, store, or transmit organization-controlled
    information using external systems; or b. Prohibit the use of [Assignment: prohibited types of external systems].'
  evidence_examples: *id001
- id: AC-20(1)
  kind: control
  category: level_2
  group: AC
  title: 'Use of External Systems: Limits on Authorized Use'
  intent: 'Permit authorized individuals to use an external system to access the system or to process, store, or transmit organization-controlled
    information only after: (a) Verification of the implementation of controls on the external system as specified in the organization’s
    security and privacy policies and security and privacy plans; or (b) Retention of approved system connection or processing agreements
    with the organizational entity hosting the external system.'
  evidence_examples: *id001
- id: AC-22
  kind: control
  category: level_2
  group: AC
  title: Publicly Accessible Content
  intent: 'a. Designate individuals authorized to make information publicly accessible; b. Train authorized individuals to ensure that
    publicly accessible information does not contain nonpublic information; c. Review the proposed content of information prior to posting
    onto the publicly accessible system to ensure that nonpublic information is not included; and d. Review the content on the publicly
    accessible system for nonpublic information [Assignment: frequency] and remove such information, if discovered.'
  evidence_examples: *id001
- id: AT-1
  kind: control
  category: core
  group: AT
  title: Policy and Procedures
  intent: 'a. Develop, document, and disseminate to [Assignment: organization-defined personnel or roles]: 1. [Selection (one or more):
    organization-level; mission/business process-level; system-level] awareness and training policy that: (a) Addresses purpose, scope,
    roles, responsibilities, management commitment, coordination among organizational entities, and compliance; and (b) Is consistent
    with applicable laws, executive orders, directives, regulations, policies, standards, and guidelines; and 2. Procedures to facilitate
    the implementation of the awareness and training policy and the associated awareness and training controls; b. Designate an [Assignment:
    official] to manage the development, documentation, and dissemination of the awareness and training policy and procedures; and c.
    Review and update the current awareness and training: 1. Policy [Assignment: frequency] and following [Assignment: events] ; and
    2. Procedures [Assignment: frequency] and following [Assignment: events].'
  evidence_examples: &id002
  - Training completion report
  - Role-based training records
  - Phishing exercise results
- id: AT-2
  kind: control
  category: core
  group: AT
  title: Literacy Training and Awareness
  intent: 'a. Provide security and privacy literacy training to system users (including managers, senior executives, and contractors):
    1. As part of initial training for new users and [Assignment: organization-defined frequency] thereafter; and 2. When required by
    system changes or following [Assignment: organization-defined events]; b. Employ the following techniques to increase the security
    and privacy awareness of system users [Assignment: awareness techniques]; c. Update literacy training and awareness content [Assignment:
    frequency] and following [Assignment: events] ; and d. Incorporate lessons learned from internal or external security incidents
    or breaches into literacy training and awareness techniques.'
  evidence_examples: *id002
- id: AT-2(2)
  kind: control
  category: level_2
  group: AT
  title: 'Literacy Training and Awareness: Insider Threat'
  intent: Provide literacy training on recognizing and reporting potential indicators of insider threat.
  evidence_examples: *id002
- id: AT-2(3)
  kind: control
  category: level_2
  group: AT
  title: 'Literacy Training and Awareness: Social Engineering and Mining'
  intent: Provide literacy training on recognizing and reporting potential and actual instances of social engineering and social mining.
  evidence_examples: *id002
- id: AT-3
  kind: control
  category: core
  group: AT
  title: Role-based Training
  intent: 'a. Provide role-based security and privacy training to personnel with the following roles and responsibilities: [Assignment:
    organization-defined roles and responsibilities]: 1. Before authorizing access to the system, information, or performing assigned
    duties, and [Assignment: frequency] thereafter; and 2. When required by system changes; b. Update role-based training content [Assignment:
    frequency] and following [Assignment: events] ; and c. Incorporate lessons learned from internal or external security incidents
    or breaches into role-based training.'
  evidence_examples: *id002
- id: AT-4
  kind: control
  category: core
  group: AT
  title: Training Records
  intent: 'a. Document and monitor information security and privacy training activities, including security and privacy awareness training
    and specific role-based security and privacy training; and b. Retain individual training records for [Assignment: time period].'
  evidence_examples: *id002
- id: AU-1
  kind: control
  category: core
  group: AU
  title: Policy and Procedures
  intent: 'a. Develop, document, and disseminate to [Assignment: organization-defined personnel or roles]: 1. [Selection (one or more):
    organization-level; mission/business process-level; system-level] audit and accountability policy that: (a) Addresses purpose, scope,
    roles, responsibilities, management commitment, coordination among organizational entities, and compliance; and (b) Is consistent
    with applicable laws, executive orders, directives, regulations, policies, standards, and guidelines; and 2. Procedures to facilitate
    the implementation of the audit and accountability policy and the associated audit and accountability controls; b. Designate an
    [Assignment: official] to manage the development, documentation, and dissemination of the audit and accountability policy and procedures;
    and c. Review and update the current audit and accountability: 1. Policy [Assignment: frequency] and following [Assignment: events]
    ; and 2. Procedures [Assignment: frequency] and following [Assignment: events].'
  evidence_examples: &id003
  - Logging configuration and event list
  - SIEM retention settings
  - Log review records
- id: AU-2
  kind: control
  category: core
  group: AU
  title: Event Logging
  intent: 'a. Identify the types of events that the system is capable of logging in support of the audit function: [Assignment: event
    types]; b. Coordinate the event logging function with other organizational entities requiring audit-related information to guide
    and inform the selection criteria for events to be logged; c. Specify the following event types for logging within the system: [Assignment:
    organization-defined event types (subset of the event types defined in [AU-2a.](#au-2_smt.a)) along with the frequency of (or situation
    requiring) logging for each identified event type]; d. Provide a rationale for why the event types selected for logging are deemed
    to be adequate to support after-the-fact investigations of incidents; and e. Review and update the event types selected for logging
    [Assignment: frequency].'
  evidence_examples: *id003
- id: AU-3
  kind: control
  category: core
  group: AU
  title: Content of Audit Records
  intent: 'Ensure that audit records contain information that establishes the following: a. What type of event occurred; b. When the
    event occurred; c. Where the event occurred; d. Source of the event; e. Outcome of the event; and f. Identity of any individuals,
    subjects, or objects/entities associated with the event.'
  evidence_examples: *id003
- id: AU-3(1)
  kind: control
  category: level_2
  group: AU
  title: 'Content of Audit Records: Additional Audit Information'
  intent: 'Generate audit records containing the following additional information: [Assignment: additional information].'
  evidence_examples: *id003
- id: AU-4
  kind: control
  category: core
  group: AU
  title: Audit Log Storage Capacity
  intent: 'Allocate audit log storage capacity to accommodate [Assignment: audit log retention requirements].'
  evidence_examples: *id003
- id: AU-5
  kind: control
  category: core
  group: AU
  title: Response to Audit Logging Process Failures
  intent: 'a. Alert [Assignment: personnel or roles] within [Assignment: time period] in the event of an audit logging process failure;
    and b. Take the following additional actions: [Assignment: additional actions].'
  evidence_examples: *id003
- id: AU-6
  kind: control
  category: core
  group: AU
  title: Audit Record Review, Analysis, and Reporting
  intent: 'a. Review and analyze system audit records [Assignment: frequency] for indications of [Assignment: inappropriate or unusual
    activity] and the potential impact of the inappropriate or unusual activity; b. Report findings to [Assignment: personnel or roles]
    ; and c. Adjust the level of audit record review, analysis, and reporting within the system when there is a change in risk based
    on law enforcement information, intelligence information, or other credible sources of information.'
  evidence_examples: *id003
- id: AU-8
  kind: control
  category: core
  group: AU
  title: Time Stamps
  intent: 'a. Use internal system clocks to generate time stamps for audit records; and b. Record time stamps for audit records that
    meet [Assignment: granularity of time measurement] and that use Coordinated Universal Time, have a fixed local time offset from
    Coordinated Universal Time, or that include the local time offset as part of the time stamp.'
  evidence_examples: *id003
- id: AU-9
  kind: control
  category: core
  group: AU
  title: Protection of Audit Information
  intent: 'a. Protect audit information and audit logging tools from unauthorized access, modification, and deletion; and b. Alert [Assignment:
    personnel or roles] upon detection of unauthorized access, modification, or deletion of audit information.'
  evidence_examples: *id003
- id: AU-11
  kind: control
  category: core
  group: AU
  title: Audit Record Retention
  intent: 'Retain audit records for [Assignment: time period] to provide support for after-the-fact investigations of incidents and
    to meet regulatory and organizational information retention requirements.'
  evidence_examples: *id003
- id: AU-12
  kind: control
  category: core
  group: AU
  title: Audit Record Generation
  intent: 'a. Provide audit record generation capability for the event types the system is capable of auditing as defined in [AU-2a](#au-2_smt.a)
    on [Assignment: system components]; b. Allow [Assignment: personnel or roles] to select the event types that are to be logged by
    specific components of the system; and c. Generate audit records for the event types defined in [AU-2c](#au-2_smt.c) that include
    the audit record content defined in [AU-3](#au-3).'
  evidence_examples: *id003
- id: CA-1
  kind: control
  category: core
  group: CA
  title: Policy and Procedures
  intent: 'a. Develop, document, and disseminate to [Assignment: organization-defined personnel or roles]: 1. [Selection (one or more):
    organization-level; mission/business process-level; system-level] assessment, authorization, and monitoring policy that: (a) Addresses
    purpose, scope, roles, responsibilities, management commitment, coordination among organizational entities, and compliance; and
    (b) Is consistent with applicable laws, executive orders, directives, regulations, policies, standards, and guidelines; and 2. Procedures
    to facilitate the implementation of the assessment, authorization, and monitoring policy and the associated assessment, authorization,
    and monitoring controls; b. Designate an [Assignment: official] to manage the development, documentation, and dissemination of the
    assessment, authorization, and monitoring policy and procedures; and c. Review and update the current assessment, authorization,
    and monitoring: 1. Policy [Assignment: frequency] and following [Assignment: events] ; and 2. Procedures [Assignment: frequency]
    and following [Assignment: events].'
  evidence_examples: &id004
  - Assessment plan and report
  - POA&M with dates
  - Continuous monitoring reports
  - Interconnection agreements
- id: CA-2
  kind: control
  category: core
  group: CA
  title: Control Assessments
  intent: 'a. Select the appropriate assessor or assessment team for the type of assessment to be conducted; b. Develop a control assessment
    plan that describes the scope of the assessment including: 1. Controls and control enhancements under assessment; 2. Assessment
    procedures to be used to determine control effectiveness; and 3. Assessment environment, assessment team, and assessment roles and
    responsibilities; c. Ensure the control assessment plan is reviewed and approved by the authorizing official or designated representative
    prior to conducting the assessment; d. Assess the controls in the system and its environment of operation [Assignment: assessment
    frequency] to determine the extent to which the controls are implemented correctly, operating as intended, and producing the desired
    outcome with respect to meeting established security and privacy requirements; e. Produce a control assessment report that document
    the results of the assessment; and f. Provide the results of the control assessment to [Assignment: individuals or roles].'
  evidence_examples: *id004
- id: CA-3
  kind: control
  category: core
  group: CA
  title: Information Exchange
  intent: 'a. Approve and manage the exchange of information between the system and other systems using [Selection (one or more): interconnection
    security agreements; information exchange security agreements; memoranda of understanding or agreement; service level agreements;
    user agreements; non-disclosure agreements; [Assignment: type of agreement] ]; b. Document, as part of each exchange agreement,
    the interface characteristics, security and privacy requirements, controls, and responsibilities for each system, and the impact
    level of the information communicated; and c. Review and update the agreements [Assignment: frequency].'
  evidence_examples: *id004
- id: CA-5
  kind: control
  category: core
  group: CA
  title: Plan of Action and Milestones
  intent: 'a. Develop a plan of action and milestones for the system to document the planned remediation actions of the organization
    to correct weaknesses or deficiencies noted during the assessment of the controls and to reduce or eliminate known vulnerabilities
    in the system; and b. Update existing plan of action and milestones [Assignment: frequency] based on the findings from control assessments,
    independent audits or reviews, and continuous monitoring activities.'
  evidence_examples: *id004
- id: CA-6
  kind: control
  category: core
  group: CA
  title: Authorization
  intent: 'a. Assign a senior official as the authorizing official for the system; b. Assign a senior official as the authorizing official
    for common controls available for inheritance by organizational systems; c. Ensure that the authorizing official for the system,
    before commencing operations: 1. Accepts the use of common controls inherited by the system; and 2. Authorizes the system to operate;
