# Framework playbook: reusable engagement content for TX-RAMP readiness.
# Engagement files may override any of these keys (see engagement/engagement.yaml).
#
# TX-RAMP certification is granted by the Texas Department of Information Resources (DIR) after it reviews the
# vendor's Assessment Questionnaire (answered in DIR's SPECTRIM portal) and the attached TX-RAMP Security
# Plan workbook, boundary diagram and data flow diagram. In the engagement record the two dates mean:
# dates.stage1 = the day the assessment is submitted to DIR; dates.stage2 = the certification decision the
# client is working towards (or the agency contract date that needs it).

title_suffix: TX-RAMP Readiness Brief
tldr_template: "Help {client} earn TX-RAMP certification for its cloud service, so Texas state agencies and public universities can buy it."
usage_heading: Cloud Service, Boundary and Data in Scope
requirements_heading: TX-RAMP Readiness Requirements

terms:
  goal: TX-RAMP certification
  audit_body: Texas DIR (TX-RAMP)
  focus: TX-RAMP readiness and certification
  stage1: Assessment submission
  stage2: Certification decision
  countdown: assessment submission
  system: TX-RAMP scoped system
  applicability_title: TX-RAMP Control Applicability
  applicability_short: Applicability
  applicability_intro: "Every TX-RAMP control in the chosen level, with whether {client} implements it. A control marked not applicable names who is responsible for it instead (the customer, or a provider it is inherited from), which DIR asks for in the Security Plan."
  internal_audit_ref: CA-2
  corrective_ref: CA-5
  review_ref: CA-7
  record_control_ref: AU-11
  scope_ref: PL-2
  objectives_ref: PL-2
  risk_ref: RA-3
  review_required: "no"
  applicability_id_header: Control

glossary:
  - term: TX-RAMP
    plain: "Texas's security certification for cloud services sold to state agencies, public universities and community colleges. Without it, they can't buy the service."
    tech: "Texas Government Code 2054.0593; run by the Department of Information Resources (DIR)."
  - term: Level 1 and Level 2
    plain: "Level 1 is for public or low-risk information. Level 2 is for confidential or regulated data and asks for about twice as many controls."
    tech: "TX-RAMP Security Controls Baselines 2.0: 117 controls at Level 1, 223 at Level 2, all from NIST SP 800-53 Rev. 5."
  - term: Security Plan workbook
    plain: "DIR's spreadsheet listing every control in your level. For each one you say whether it is in place, who is responsible and how it works."
    tech: "TX-RAMP Security Plan workbook: Implementation Status, Implementation Responsibility, Implementation Details."
  - term: Authorization boundary
    plain: "The line around everything that makes up the cloud service, drawn on a diagram: servers, databases, networks, and the outside services they connect to."
    tech: "Authorization boundary diagram (ABD), a required attachment."
  - term: POA&M
    plain: "A plan of action and milestones: the list of controls not fully in place yet, with the fix and the date."
    tech: "NIST SP 800-53 CA-5; DIR accepts the FedRAMP template."
  - term: Inherited control
    plain: "A control your hosting provider runs for you (for example the data center's physical security) and that you rely on."
    tech: "Implementation Responsibility: Inherited."

evidence_test:
  - key: documented
    label: Documented
    question: Is the control described in an approved policy or procedure and in the Security Plan?
  - key: implemented
    label: Implemented
    question: Is the control in place across the whole authorization boundary, at the TX-RAMP parameter values?
  - key: evidenced
    label: Evidence exists
    question: Can {client} produce records showing the control operated?
  - key: tested
    label: Tested
    question: Does a test, done the way an assessor would, show the control works?

gap_callout: Treat client statements as hypotheses until evidence shows the control is documented, in place across the boundary at the TX-RAMP parameter values, leaves records, and passes a test.

working_rule: If a control is described but you cannot trace it to an owner, a requirement, and records, treat it as unresolved and escalate it to the engagement lead.

readiness_criteria:
  - The authorization boundary and data flows are drawn, labelled and match the system inventory.
  - Every control in the chosen level is implemented, inherited with a named provider, or on the POA&M with a date.
  - Policies and procedures exist for every control family, are approved, and are reviewed at the TX-RAMP interval.
  - The Security Plan workbook has a status, a responsibility and details for every control in the level.
  - Vulnerability scanning, an independent assessment and continuous monitoring are running, with records.
  - The Assessment Questionnaire is answered and every required document is attached.

phases:
  - id: validate
    objective: "Scope & boundary"
    deliverables:
      - Kickoff and owner alignment; confirm the target level with the agency sponsor
      - Draw the authorization boundary and data flow diagrams
      - Inventory components, external services and inherited controls
      - Validate gap-analysis claims and evidence
  - id: governance
    objective: "Policies & plan"
    deliverables:
      - Approve the 17 family policies and procedures
      - Record TX-RAMP parameter values for every control
      - Start the POA&M
  - id: implement
    objective: "Implement & evidence"
    deliverables:
      - Close control gaps (MFA, logging, encryption, scanning, baselines)
      - Collect evidence and turn on evidence collection
      - Run the first access review, restore test and incident exercise
  - id: test
    objective: "Assess"
    deliverables:
      - Test every control in the level against its evidence
      - Complete the Security Plan workbook
      - Update the POA&M with findings
  - id: stage1
    objective: "Submit to DIR"
    deliverables:
      - Answer the Assessment Questionnaire in SPECTRIM
      - Attach the Security Plan, boundary diagram and data flow diagram
      - Answer DIR's follow-up questions
  - id: stage2
    objective: "Certification"
    deliverables:
      - Receive the certification decision
      - Hand over continuous monitoring and the renewal date

needs:
  - Maintain the control matrix, system inventory, evidence index, POA&M, owner, due date, and status.
  - Review submitted evidence against the four-part evidence test across the whole boundary.
  - Draft and revise policies, procedures and Security Plan details for lead review - do not invent operating practices.
  - Track recurring controls (scans, access reviews, training, contingency tests, assessments).
  - Name the responsible party for every inherited or customer control.

default_guardrails:
  - "{client} owns its controls and evidence; our team structures, reviews, tests, and challenges."
  - DIR decides certification. We prepare the submission; we don't speak for DIR or the agency.
  - No customer data in this repository or in our working files. Evidence is pointed to where it lives.
  - Escalate unsupported claims in the Security Plan and questions about the target level to the engagement lead.

default_risks:
  - Security Plan details that restate the control text instead of saying how it is done.
  - Inherited controls with no named provider or no provider attestation.
  - A boundary diagram that leaves out external services or the development environment.
  - TX-RAMP parameter values not met (for example review intervals or account disable times).

impact_assessment:
  required_for_kinds: []

# Policy and procedure library (`grc docs new`): one policy and procedures document per control family, which
# is how DIR's guide expects the "-1" policy controls to be met. Each family document supports every control
# in the family; documents for Level 2 controls are drafted only when level_2 is in scope.
documents:
  review_every_days: 365
  library:
    - {id: "DOC-TXR-AC", title: "Access Control Policy and Procedures", kind: "policy", template: "access.md", satisfies: ["AC-1", "AC-2", "AC-2(3)", "AC-2(5)", "AC-2(7)", "AC-2(9)", "AC-2(12)", "AC-3", "AC-4", "AC-5", "AC-6", "AC-6(1)", "AC-6(2)", "AC-6(5)", "AC-6(7)", "AC-6(9)", "AC-6(10)", "AC-7", "AC-11", "AC-12", "AC-14", "AC-17", "AC-17(1)", "AC-17(2)", "AC-17(3)", "AC-17(4)", "AC-17(9)", "AC-18", "AC-19", "AC-19(5)", "AC-20", "AC-20(1)", "AC-22"], sections: ["Purpose", "Policy", "Account management", "Least privilege and separation of duties", "Sign-in protection", "Remote, wireless and mobile access", "Information flow and publicly accessible content", "Access reviews", "Review"]}
    - {id: "DOC-TXR-AT", title: "Security Awareness and Training Policy and Procedures", kind: "policy", template: "awareness.md", satisfies: ["AT-1", "AT-2", "AT-2(2)", "AT-2(3)", "AT-3", "AT-4"], sections: ["Purpose", "Policy", "Awareness training", "Role-based training", "Records", "Review"]}
    - {id: "DOC-TXR-AU", title: "Audit Logging and Accountability Policy and Procedures", kind: "policy", template: "audit.md", satisfies: ["AU-1", "AU-2", "AU-3", "AU-3(1)", "AU-4", "AU-5", "AU-6", "AU-8", "AU-9", "AU-11", "AU-12"], sections: ["Purpose", "Policy", "Events logged", "Storage and protection", "Review and reporting", "Review"]}
    - {id: "DOC-TXR-CA", title: "Security Assessment, Authorization and Continuous Monitoring Policy and Procedures", kind: "policy", template: "assessment.md", satisfies: ["CA-1", "CA-2", "CA-3", "CA-5", "CA-6", "CA-7", "CA-7(4)", "CA-8", "CA-9"], sections: ["Purpose", "Policy", "Control assessments", "Plan of action and milestones (POA&M)", "Authorization", "Continuous monitoring", "Interconnections", "Review"]}
    - {id: "DOC-TXR-CM", title: "Configuration Management Policy and Procedures", kind: "policy", template: "configuration.md", satisfies: ["CM-1", "CM-2", "CM-2(3)", "CM-3", "CM-3(2)", "CM-3(4)", "CM-4", "CM-4(2)", "CM-5", "CM-5(5)", "CM-6", "CM-7", "CM-7(1)", "CM-7(2)", "CM-7(5)", "CM-8", "CM-8(1)", "CM-9", "CM-10", "CM-11", "CM-12"], sections: ["Purpose", "Policy", "Baseline configuration", "Change control", "Secure settings and least functionality", "Inventory", "Review"]}
