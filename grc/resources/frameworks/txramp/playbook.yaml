    - {id: "DOC-TXR-RA", title: "Risk Assessment and Vulnerability Management Policy and Procedures", kind: "policy", template: "risk.md", satisfies: ["RA-1", "RA-2", "RA-3", "RA-5", "RA-5(2)", "RA-5(3)", "RA-5(5)", "RA-7"], sections: ["Purpose", "Policy", "Security categorisation", "Risk assessment", "Vulnerability scanning", "Responding to risk", "Review"]}
    - {id: "DOC-TXR-SA", title: "System and Services Acquisition Policy and Procedures", kind: "policy", template: "acquisition.md", satisfies: ["SA-1", "SA-3", "SA-4", "SA-4(1)", "SA-4(2)", "SA-4(9)", "SA-5", "SA-8", "SA-9", "SA-9(2)", "SA-9(5)", "SA-10", "SA-10(1)", "SA-11", "SA-15", "SA-22"], sections: ["Purpose", "Policy", "Resources and life cycle", "Acquisitions", "Secure development", "Unsupported components", "Review"]}
    - {id: "DOC-TXR-SC", title: "System and Communications Protection Policy and Procedures", kind: "policy", template: "communications.md", satisfies: ["SC-1", "SC-2", "SC-4", "SC-5", "SC-7", "SC-7(3)", "SC-7(4)", "SC-7(5)", "SC-8", "SC-8(1)", "SC-10", "SC-12", "SC-13", "SC-15", "SC-17", "SC-18", "SC-20", "SC-21", "SC-22", "SC-23", "SC-28", "SC-28(1)", "SC-39"], sections: ["Purpose", "Policy", "Boundary protection", "Encryption", "Separation and availability", "Sessions and name resolution", "Review"]}
    - {id: "DOC-TXR-SI", title: "System and Information Integrity Policy and Procedures", kind: "policy", template: "integrity.md", satisfies: ["SI-1", "SI-2", "SI-3", "SI-4", "SI-4(4)", "SI-5", "SI-7", "SI-7(1)", "SI-7(7)", "SI-10", "SI-11", "SI-12", "SI-16"], sections: ["Purpose", "Policy", "Flaw remediation", "Malicious code protection", "System monitoring and alerts", "Information integrity", "Review"]}

# TX-RAMP doesn't require a management review; continuous monitoring (CA-7) is its closest equivalent.
management_review:
  review_every_days: 365
  warn_before_stage1_days: 60
  inputs:
    - {id: previous_actions, title: "Status of actions from previous reviews"}
    - {id: environment_changes, content: context_changes, title: "Changes to the system, its boundary, providers or agency customers"}
    - {id: control_performance, content: performance, title: "Control performance: assessments, scans, continuous monitoring and the POA&M"}
    - {id: risks, content: risks_and_impacts, title: "Results of the risk assessment and its treatment"}
    - {id: providers, content: suppliers, title: "Providers and inherited controls"}
    - {id: incidents, content: incidents, title: "Security incidents"}
    - {id: resources, title: "Adequacy of resources for the security program"}
    - {id: improvement, title: "Opportunities for improvement"}

hours:
  warn_at: 0.8
  forecast_weeks: 4
  max_per_person_day: 14
  phase_split: {validate: 0.15, governance: 0.2, implement: 0.3, test: 0.18, stage1: 0.12, stage2: 0.05}
  activities:
    - {id: project_management, title: "Project management and status reporting", keywords: [status, pm, planning, project management, weekly]}
    - {id: kickoff, title: "Kickoff and boundary", keywords: [kickoff, kick-off, scoping, scope, boundary, diagram, inventory, data flow]}
    - {id: interviews, title: "Interviews and walkthroughs", keywords: [interview, walkthrough, workshop, meeting]}
    - {id: documentation, title: "Policies, procedures and the Security Plan", keywords: [policy, procedure, document, drafting, security plan, ssp]}
    - {id: risk_impact, title: "Risk assessment and providers", keywords: [risk, vendor, provider, inherited, assessment]}
    - {id: evidence_review, title: "Evidence review and testing", keywords: [evidence, review, testing, collector, sample]}
    - {id: internal_audit, title: "Control assessment", keywords: [assessment, internal audit, audit, workpaper, poam]}
    - {id: management_review, title: "Leadership review", keywords: [management review, board, mr-]}
    - {id: remediation, title: "Remediation support", keywords: [remediation, gap, fix, corrective]}
    - {id: certification, title: "DIR submission and certification", keywords: [dir, spectrim, submission, certification, questionnaire]}
    - {id: other, title: "Other", keywords: []}
