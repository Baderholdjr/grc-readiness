    - {id: "DOC-TXR-IA", title: "Identification and Authentication Policy and Procedures", kind: "policy", template: "identity.md", satisfies: ["IA-1", "IA-2", "IA-2(1)", "IA-2(8)", "IA-3", "IA-4", "IA-4(4)", "IA-5", "IA-5(1)", "IA-5(2)", "IA-5(6)", "IA-5(7)", "IA-6", "IA-7", "IA-8", "IA-11"], sections: ["Purpose", "Policy", "Users", "Devices and services", "Authenticators", "External users", "Review"]}
