    - {id: "DOC-TXR-MA", title: "System Maintenance Policy and Procedures", kind: "policy", template: "maintenance.md", satisfies: ["MA-1", "MA-2", "MA-3", "MA-3(1)", "MA-3(2)", "MA-3(3)", "MA-4", "MA-5", "MA-6"], sections: ["Purpose", "Policy", "Controlled maintenance", "Tools and remote maintenance", "Maintenance personnel", "Timely maintenance", "Review"]}
