# Framework playbook: reusable engagement content for ISO/IEC 42001 readiness.
# Engagement files may override any of these keys (see engagement/engagement.yaml).

title_suffix: ISO 42001 Project Brief
tldr_template: "Help {client} turn an existing set of AI practices and technical controls into a complete, auditable AI management system (AIMS)."

# The four-part evidence test. Every control file records a status for each leg.
evidence_test:
  - key: documented
    label: Documented
    question: Is the requirement formally defined?
  - key: implemented
    label: Implemented
    question: Is the process actually in use?
  - key: evidenced
    label: Evidence exists
    question: Can {client} produce records showing execution?
  - key: tested
    label: Tested
    question: Does sampling/interview evidence support consistent operation?

gap_callout: Treat client readiness statements as hypotheses until evidence shows the control is documented, implemented, evidenced, and operating.

working_rule: If a control is described but you cannot trace it to an owner, current artifact, and operating evidence, treat it as unresolved and escalate it to the engagement lead.

# Section 7 of the brief: what "ready for certification" means.
readiness_criteria:
  - AIMS scope, governance, objectives, policies, roles, and responsibilities are approved and understood.
  - AI inventory, risks, impact assessments, supplier controls, lifecycle controls, and training are current and evidenced.
  - Required processes have operated long enough to produce credible records for auditor sampling.
  - Internal audit has tested the AIMS; findings have owners and corrective actions.
  - Management review has considered AIMS performance, risks, audit results, changes, resources, and improvement actions.
  - Stage 1 findings are closed or controlled before Stage 2; process owners can explain what they do and show evidence.

# Default phases. Engagements set the month for each; deliverables can be overridden.
phases:
  - id: validate
    objective: "Validate & establish"
    deliverables:
      - Kickoff and owner alignment
      - Validate gap-analysis claims and evidence
      - Finalize AIMS/certification scope
      - Build clause/control matrix and remediation tracker
      - Confirm certification-body milestones
  - id: governance
    objective: Build governance
    deliverables:
      - Approve AIMS/AI policy
      - Formalize roles, objectives, risk and impact methodology
      - Define AI data classification and supplier requirements
      - Codify lifecycle and human-oversight requirements
  - id: implement
    objective: "Implement & evidence"
    deliverables:
      - Complete initial AI impact assessments
      - Run AI supplier reviews and address contract gaps
      - Launch AI-specific training
      - Operationalize governance cadence and collect evidence
      - Close implementation findings
  - id: test
    objective: Test the AIMS
    deliverables:
      - Perform ISO 42001 internal audit
      - Verify inventory, risk register and impact assessments
      - Complete corrective actions
      - Conduct formal management review
      - Prepare certification evidence package
  - id: stage1
    objective: Stage 1
    deliverables:
      - Run readiness/mock audit
      - Close internal-audit findings
      - Evidence cleanup and owner preparation
      - Support Stage 1 audit
      - Triage Stage 1 findings
  - id: stage2
    objective: "Stage 2 & closure"
    deliverables:
      - Close Stage 1 findings
      - Prepare process owners for interviews
      - Support Stage 2 audit
      - Respond to findings and corrective actions
      - Certification-body closure / issuance contingency

needs:
  - Maintain the clause/control mapping, evidence index, remediation tracker, owner, due date, and status.
  - Review submitted evidence against the four-part evidence test; flag unsupported or ambiguous readiness claims.
  - Draft and revise policies, procedures, templates, and workpapers for lead review - do not invent operating practices.
  - Support AI impact assessments and supplier reviews by gathering evidence, pre-populating factual sections, and tracking actions.
  - Prepare test samples, record objective evidence, and document exceptions for the internal audit.
  - Organize Stage 1/Stage 2 evidence so an auditor can trace each requirement to a current, approved artifact or record.

default_guardrails:
  - "{client} owns implementation and evidence production; our team structures, reviews, tests, and challenges."
  - Prefer durable, auditable processes over one-time documents created solely for certification.
  - Escalate scope changes, major control redesign, legal/contract questions, or unsupported high-risk claims to the engagement lead.

default_risks:
  - Overstated readiness or evidence that reflects design rather than operation.
  - Late implementation that leaves too little operating history before Stage 2.
  - Slow SME responses, policy approvals, vendor reviews, or contract decisions.
  - Internal-audit or management-review slippage.

# AI system impact assessment methodology (6.1.4, 8.4, A.5.2-A.5.5).
# Our own structure; align with your client's risk method and, where useful, ISO/IEC 42005.
impact_assessment:
  required_for_kinds: [ai_system]          # inventory kinds that need an assessment
  review_every_days: {High: 180, default: 365}
  scales:
    likelihood: {1: Rare, 2: Unlikely, 3: Possible, 4: Likely, 5: Almost certain}
    severity:   {1: Negligible, 2: Minor, 3: Moderate, 4: Major, 5: Severe}
  bands: [[1, Low], [6, Medium], [12, High], [20, Critical]]   # score = likelihood x severity
  acceptance_required_at: 12                # residual >= this needs a named acceptance
  unacceptable_at: 20                       # residual >= this cannot be approved
  categories:
    - {id: safety, area: individuals, title: "Safety and physical or psychological harm"}
    - {id: health, area: individuals, title: "Health and wellbeing (e.g. clinical decisions)"}
    - {id: fairness, area: groups, title: "Fairness and non-discrimination across groups"}
    - {id: privacy, area: individuals, title: "Privacy and data protection"}
    - {id: autonomy, area: individuals, title: "Human autonomy, oversight and the ability to contest decisions"}
    - {id: transparency, area: individuals, title: "Transparency and explainability to the people affected"}
    - {id: security, area: individuals, title: "Security, misuse and manipulation of the system"}
    - {id: economic, area: society, title: "Economic and employment effects"}
    - {id: information, area: society, title: "Information integrity and public trust"}
    - {id: environment, area: society, title: "Environmental impact (compute, energy)"}
    - {id: rights, area: society, title: "Legal, human and civil rights"}

# Policy and procedure library (`grc docs new`). Each entry is drafted from
# documents/<template> next to this playbook (a client repo can override either).
# `satisfies` lists the requirements whose *Documented* leg the approved document supports.
# `sections` are the headings an approved document must keep (E041).
# Wording is our own; it paraphrases the intent of the standard and does not reproduce it.
documents:
  review_every_days: 365
  library:
    - {id: DOC-SCOPE, title: "AIMS Scope and Context", kind: policy, template: scope.md,
       satisfies: ["4.1", "4.2", "4.3", "4.4"], sections: [Purpose, Context, Interested parties, Scope, Exclusions, Review]}
    - {id: DOC-AI-POLICY, title: "AI Policy", kind: policy, template: ai-policy.md,
       satisfies: ["5.1", "5.2", "A.2.2", "A.2.3", "A.2.4"], sections: [Purpose, Scope, Commitments, Principles, Alignment with other policies, Responsibilities, Review]}
    - {id: DOC-ROLES, title: "AI Roles, Responsibilities and Reporting of Concerns", kind: procedure, template: roles.md,
       satisfies: ["5.3", "A.3.2", "A.3.3", "A.10.2"], sections: [Purpose, Roles, Reporting concerns, Review]}
    - {id: DOC-RISK, title: "AI Risk Management Procedure", kind: procedure, template: risk.md,
       satisfies: ["6.1.1", "6.1.2", "6.1.3", "8.2", "8.3"], sections: [Purpose, Criteria, Risk assessment, Risk treatment, Records, Review]}
    - {id: DOC-IMPACT, title: "AI System Impact Assessment Procedure", kind: procedure, template: impact.md,
       satisfies: ["6.1.4", "8.4", "A.5.2", "A.5.3", "A.5.4", "A.5.5"], sections: [Purpose, When an assessment is required, Method, Approval and acceptance, Records, Review]}
    - {id: DOC-OBJECTIVES, title: "AI Objectives and Planning of Changes", kind: procedure, template: objectives.md,
       satisfies: ["6.2", "6.3", "A.6.1.2", "A.9.3"], sections: [Purpose, Objectives, Planning, Changes to the AIMS, Review]}
    - {id: DOC-PEOPLE, title: "Resources, Competence, Awareness and Communication", kind: procedure, template: people.md,
       satisfies: ["7.1", "7.2", "7.3", "7.4", "A.4.6"], sections: [Purpose, Resources, Competence, Awareness, Communication, Review]}
    - {id: DOC-DOCINFO, title: "Control of Documented Information", kind: procedure, template: docinfo.md,
       satisfies: ["7.5"], sections: [Purpose, Creating and updating, Approval, Control, Retention, Review]}
    - {id: DOC-RESOURCES, title: "AI Resources Inventory Procedure", kind: procedure, template: resources.md,
       satisfies: ["A.4.2", "A.4.3", "A.4.4", "A.4.5"], sections: [Purpose, What is recorded, Keeping it current, Review]}
    - {id: DOC-LIFECYCLE, title: "AI System Lifecycle Procedure", kind: procedure, template: lifecycle.md,
       satisfies: ["8.1", "A.6.1.3", "A.6.2.2", "A.6.2.3", "A.6.2.4", "A.6.2.5", "A.6.2.6", "A.6.2.7", "A.6.2.8"],
       sections: [Purpose, Lifecycle stages, Verification and validation, Deployment, Operation and monitoring, Event logs, Records, Review]}
    - {id: DOC-DATA, title: "Data for AI Systems Procedure", kind: procedure, template: data.md,
       satisfies: ["A.7.2", "A.7.3", "A.7.4", "A.7.5", "A.7.6"], sections: [Purpose, Acquisition, Quality, Provenance, Preparation, Review]}
    - {id: DOC-COMMS, title: "Information for Users and Interested Parties", kind: procedure, template: comms.md,
       satisfies: ["A.8.2", "A.8.3", "A.8.4", "A.8.5"], sections: [Purpose, Information for users, External reporting, Incident communication, Review]}
    - {id: DOC-USE, title: "Responsible Use of AI Systems", kind: policy, template: use.md,
       satisfies: ["A.9.2", "A.9.4"], sections: [Purpose, Intended use, Responsible use, Review]}
    - {id: DOC-THIRDPARTY, title: "AI Suppliers, Customers and Third Parties", kind: procedure, template: thirdparty.md,
       satisfies: ["A.10.3", "A.10.4"], sections: [Purpose, Suppliers, Customers, Review]}
    - {id: DOC-AUDIT, title: "Monitoring, Measurement and Internal Audit Procedure", kind: procedure, template: audit.md,
       satisfies: ["9.1", "9.2"], sections: [Purpose, Monitoring and measurement, Internal audit, Records, Review]}
    - {id: DOC-REVIEW, title: "Management Review Procedure", kind: procedure, template: mgmt-review.md,
       satisfies: ["9.3"], sections: [Purpose, Frequency and attendees, Inputs, Outputs, Records, Review]}
    - {id: DOC-IMPROVE, title: "Nonconformity, Corrective Action and Improvement", kind: procedure, template: improve.md,
       satisfies: ["10.1", "10.2"], sections: [Purpose, Raising a finding, Corrective action, Effectiveness, Continual improvement, Review]}

# Management review (9.3). `grc review pack` assembles the inputs from the engagement record;
# the meeting's notes, decisions and actions are recorded in engagement/reviews/MR-YYYY-NN.yaml.
management_review:
  review_every_days: 365          # a review must have been held within this period (once one has been held)
  warn_before_stage1_days: 60     # warn if no review is held this close to the Stage 1 audit
  inputs:
    - {id: previous_actions, title: "Status of actions from previous management reviews"}
    - {id: context_changes, title: "Changes in external and internal issues relevant to the AIMS"}
    - {id: interested_parties, title: "Changes in the needs and expectations of interested parties"}
    - {id: performance, title: "AIMS performance: nonconformities and corrective actions, monitoring and measurement, audit results"}
    - {id: risks_and_impacts, title: "AI risks and impact assessments, and the status of treatment"}
    - {id: improvement, title: "Opportunities for continual improvement"}
    - {id: resources, title: "Adequacy of resources"}

# Hours tracking (engagement/hours.yaml, `grc hours`). Activities classify time; keywords map
# task/tag/description text from time-tracker exports onto them.
hours:
  warn_at: 0.8                 # W106 when this share of the budget is used
  forecast_weeks: 4            # burn rate = average of the last N full weeks
  max_per_person_day: 14       # E060 above this (catches duplicated imports)
  phase_split: {validate: 0.12, governance: 0.2, implement: 0.28, test: 0.2, stage1: 0.1, stage2: 0.1}
  activities:
    - {id: project_management, title: "Project management and status reporting", keywords: [status, pm, planning, project management, weekly]}
    - {id: kickoff, title: "Kickoff and scoping", keywords: [kickoff, kick-off, scoping, scope]}
    - {id: interviews, title: "Interviews and walkthroughs", keywords: [interview, walkthrough, workshop, meeting]}
    - {id: documentation, title: "Policies, procedures and documentation", keywords: [policy, procedure, document, drafting, soa]}
    - {id: risk_impact, title: "Risk and impact assessment", keywords: [risk, impact, assessment, ia-]}
    - {id: evidence_review, title: "Evidence review and testing", keywords: [evidence, review, testing, collector]}
    - {id: internal_audit, title: "Internal audit", keywords: [internal audit, audit, workpaper, sample]}
    - {id: management_review, title: "Management review", keywords: [management review, mr-]}
    - {id: remediation, title: "Remediation support", keywords: [remediation, gap, fix, corrective]}
    - {id: certification, title: "Certification audit support", keywords: [stage 1, stage 2, stage1, stage2, certification, auditor]}
    - {id: other, title: "Other", keywords: []}
